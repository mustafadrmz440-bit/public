function ContractModal({ person, debtSums, onClose, onSave, docLang, onChangeDocLang, t }) {
  const canvasRef = useRef(null);
  const drawingRef = useRef(false);
  const [hasSignature, setHasSignature] = useState(false);
  const [extraNote, setExtraNote] = useState('');
  const [saving, setSaving] = useState(false);
  const L = INVOICE_DOC_LABELS[docLang] || INVOICE_DOC_LABELS.tr;

  function getPos(e) {
    const rect = canvasRef.current.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }
  function start(e) {
    drawingRef.current = true;
    const ctx = canvasRef.current.getContext('2d');
    const { x, y } = getPos(e);
    ctx.beginPath();
    ctx.moveTo(x, y);
    setHasSignature(true);
  }
  function move(e) {
    if (!drawingRef.current) return;
    e.preventDefault();
    const ctx = canvasRef.current.getContext('2d');
    const { x, y } = getPos(e);
    ctx.lineTo(x, y);
    ctx.strokeStyle = '#111111';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }
  function end() { drawingRef.current = false; }
  function clear() {
    const ctx = canvasRef.current.getContext('2d');
    ctx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);
    setHasSignature(false);
  }

  async function submit() {
    if (!hasSignature) return;
    setSaving(true);
    const dataUrl = canvasRef.current.toDataURL('image/png');
    await onSave(dataUrl, extraNote);
    setSaving(false);
  }

  const debtText = formatCurrencySums(debtSums);
  const bodyText = L.contractBody(person.name, person.address, person.plate, person.hasIdPhoto, debtText, new Date().toLocaleDateString('tr-TR'));

  return (
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="sheet-enter rounded-2xl p-5 w-full max-h-[90vh] overflow-y-auto" style={{ background: CARD, maxWidth: 400, border: `1px solid ${BORDER}`, borderTop: `3px solid ${GOLD}` }} onClick={e => e.stopPropagation()}>
        <h3 className="font-display text-base mb-3" style={{ color: INK }}>{L.contractTitle}</h3>

        <label className="text-xs font-medium" style={{ color: INK }}>{t.docLangTitle}</label>
        <div className="flex gap-2 mt-1 mb-3">
          {['tr', 'en', 'ru'].map(dl => (
            <button key={dl} type="button" onClick={() => onChangeDocLang(dl)}
              className="flex-1 py-2 rounded-lg text-xs font-medium" style={{ background: docLang === dl ? INK : CARD, color: docLang === dl ? PAPER : INK, border: `1px solid ${docLang === dl ? INK : BORDER}` }}>
              {{ tr: 'Türkçe', en: 'English', ru: 'Русский' }[dl]}
            </button>
          ))}
        </div>

        <div className="text-xs p-3 rounded-lg mb-3 leading-relaxed whitespace-pre-line" style={{ background: CARD, border: `1px solid ${BORDER}`, color: INK }}>
          {bodyText}
        </div>
        <label className="text-xs font-medium" style={{ color: INK }}>{t.extraNoteOptional}</label>
        <textarea value={extraNote} onChange={e => setExtraNote(e.target.value)} rows={3}
          className="w-full rounded-lg px-3 py-2.5 mb-3 mt-1 text-sm resize-none" style={{ border: `1px solid ${BORDER}` }} placeholder={t.extraNotePh} />
        <label className="text-xs font-medium" style={{ color: INK }}>{L.signatureLabel}</label>
        <canvas ref={canvasRef} width={320} height={140}
          className="w-full rounded-lg mt-1 mb-2 touch-none"
          style={{ border: `1.5px dashed ${MUTED}`, background: '#fff' }}
          onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
          onTouchStart={start} onTouchMove={move} onTouchEnd={end}
        />
        <button onClick={clear} className="text-xs underline mb-4" style={{ color: MUTED }}>{t.clearSignature}</button>
        <p className="text-[12px] mb-4" style={{ color: MUTED }}>{t.signatureNote}</p>
        <div className="flex gap-2">
          <button onClick={onClose} className="flex-1 py-2.5 rounded-lg text-sm font-medium" style={{ border: `1px solid ${BORDER}`, color: INK }}>{t.cancel}</button>
          <button onClick={submit} disabled={!hasSignature || saving} className="flex-1 py-2.5 rounded-lg text-sm font-medium disabled:opacity-40" style={{ background: INK, color: PAPER }}>
            {saving ? t.saving : t.saveAndPdf}
          </button>
        </div>
      </div>
    </div>
  );
}

function PaymentPlanModal({ person, debtSums, onClose, onSave, docLang, onChangeDocLang, t }) {
  const currencies = Object.entries(debtSums).filter(([, v]) => v > 0.004).map(([c]) => c);
  const [currency, setCurrency] = useState(currencies[0] || 'TRY');
  const [total, setTotal] = useState(String(Math.round((debtSums[currencies[0]] || 0) * 100) / 100));
  const [count, setCount] = useState('12');
  const [start, setStart] = useState(new Date().toISOString().slice(0, 10));

  function addMonthsPreview(dateStr, n) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setMonth(d.getMonth() + n);
    return d.toISOString().slice(0, 10);
  }

  const n = Math.max(1, Number(count) || 1);
  const totalNum = Number(total) || 0;
  const base = Math.floor((totalNum / n) * 100) / 100;
  const preview = [];
  let allocated = 0;
  for (let i = 0; i < n && i < 36; i++) {
    const isLast = i === n - 1;
    const amount = isLast ? Math.round((totalNum - allocated) * 100) / 100 : base;
    allocated += amount;
    preview.push({ index: i + 1, amount, dueDate: addMonthsPreview(start, i) });
  }

  return (
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="sheet-enter rounded-2xl p-5 w-full max-h-[90vh] overflow-y-auto" style={{ background: CARD, maxWidth: 400, border: `1px solid ${BORDER}`, borderTop: `3px solid ${EMERALD}` }} onClick={e => e.stopPropagation()}>
        <h3 className="font-display text-base mb-1" style={{ color: INK }}>{t.paymentPlanTitle}</h3>
        <p className="text-xs mb-3" style={{ color: MUTED }}>{t.paymentPlanDesc}</p>

        <label className="text-xs font-medium" style={{ color: INK }}>{t.docLangTitle}</label>
        <div className="flex gap-2 mt-1 mb-4">
          {['tr', 'en', 'ru'].map(dl => (
            <button key={dl} type="button" onClick={() => onChangeDocLang(dl)}
              className="flex-1 py-2 rounded-lg text-xs font-medium" style={{ background: docLang === dl ? INK : CARD, color: docLang === dl ? PAPER : INK, border: `1px solid ${docLang === dl ? INK : BORDER}` }}>
              {{ tr: 'Türkçe', en: 'English', ru: 'Русский' }[dl]}
            </button>
          ))}
        </div>

        {currencies.length > 1 && (
          <>
            <label className="text-xs font-medium" style={{ color: INK }}>{t.planCurrency}</label>
            <select value={currency} onChange={e => { setCurrency(e.target.value); setTotal(String(Math.round((debtSums[e.target.value] || 0) * 100) / 100)); }}
              className="w-full rounded-lg px-3 py-2.5 mb-3 mt-1 text-sm" style={{ border: `1px solid ${BORDER}` }}>
              {currencies.map(c => <option key={c} value={c}>{c} — {formatMoney(debtSums[c], c)}</option>)}
            </select>
          </>
        )}

        <label className="text-xs font-medium" style={{ color: INK }}>{t.totalToPlan} ({currency})</label>
        <input value={total} onChange={e => setTotal(e.target.value.replace(/[^\d.,]/g, ''))}
          className="w-full rounded-lg px-3 py-2.5 mb-3 mt-1 text-sm font-num" style={{ border: `1px solid ${BORDER}` }} />

        <label className="text-xs font-medium" style={{ color: INK }}>{t.installmentCount}</label>
        <input type="number" min="1" max="36" value={count} onChange={e => setCount(e.target.value.replace(/[^\d]/g, ''))}
          className="w-full rounded-lg px-3 py-2.5 mb-3 mt-1 text-sm font-num" style={{ border: `1px solid ${BORDER}` }} />

        <label className="text-xs font-medium" style={{ color: INK }}>{t.startDate}</label>
        <input type="date" value={start} onChange={e => setStart(e.target.value)}
          className="w-full rounded-lg px-3 py-2.5 mb-4 mt-1 text-sm" style={{ border: `1px solid ${BORDER}` }} />

        <label className="text-xs font-medium" style={{ color: INK }}>{t.previewInstallments}</label>
        <div className="mt-1 mb-4 rounded-lg overflow-hidden" style={{ border: `1px solid ${BORDER}` }}>
          {preview.map(p => (
            <div key={p.index} className="flex items-center justify-between px-3 py-2 text-xs hairline" style={{ color: INK }}>
              <span>{t.installmentLabel(p.index, n)}</span>
              <span className="font-num">{formatMoney(p.amount, currency)}</span>
              <span style={{ color: MUTED }}>{p.dueDate}</span>
            </div>
          ))}
        </div>

        <div className="flex gap-2">
          <button onClick={onClose} className="flex-1 py-2.5 rounded-lg text-sm font-medium" style={{ border: `1px solid ${BORDER}`, color: INK }}>
            {t.cancel}
          </button>
          <button onClick={() => onSave(currency, total.replace(',', '.'), count, start)} disabled={!totalNum || !n}
            className="flex-1 py-2.5 rounded-lg text-sm font-medium disabled:opacity-40" style={{ background: EMERALD, color: '#fff' }}>
            {t.savePlan}
          </button>
        </div>
      </div>
    </div>
  );
}

              <div key={c} className={`flex items-center justify-between px-3 py-2 text-xs ${idx !== arr.length - 1 ? 'hairline' : ''}`} style={{ borderLeft: `3px solid ${CURRENCY_COLORS[c]}` }}>
                <span className="flex items-center gap-1.5" style={{ color: INK }}>
                  <span className="inline-block w-2 h-2 rounded-full" style={{ background: CURRENCY_COLORS[c] }} />
                  {t.oneUnitEquals('USD', 1, c)}
                </span>

              </div>
            ))}
          </div>

          <label className="text-xs font-medium" style={{ color: INK }}>{t.converterTitle}</label>
          <div className="flex gap-2 mt-1 mb-2">
            <input value={convAmount} onChange={e => setConvAmount(e.target.value.replace(/[^\d.,]/g, ''))}
              className="flex-1 rounded-lg px-3 py-2 text-sm font-num" style={{ border: `1px solid ${BORDER}` }} />
            <select value={convFrom} onChange={e => setConvFrom(e.target.value)}
              className="rounded-lg px-2 py-2 text-sm font-semibold" style={{ border: `2px solid ${fromColor}`, color: fromColor }}>
              {['TRY', 'USD', 'EUR', 'GBP', 'BTC', 'USDT'].map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div className="flex justify-center mb-2">
            <ArrowLeftRight size={14} style={{ color: MUTED }} />
          </div>
          <div className="flex gap-2 mb-3">
            <select value={convTo} onChange={e => setConvTo(e.target.value)}
              className="flex-1 rounded-lg px-2 py-2 text-sm font-semibold" style={{ border: `2px solid ${toColor}`, color: toColor }}>
              {['TRY', 'USD', 'EUR', 'GBP', 'BTC', 'USDT'].map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          {(() => {
            const usdPerFrom = exchangeRates[convFrom];
            const usdPerTo = exchangeRates[convTo];
            if (!usdPerFrom || !usdPerTo) return <p className="text-xs" style={{ color: MUTED }}>{t.ratesNotLoaded}</p>;
            const amt = Number((convAmount || '0').replace(',', '.')) || 0;
            const result = (amt * usdPerFrom) / usdPerTo;
            return (
              <div className="rounded-lg p-3 text-center" style={{ background: `${toColor}14`, border: `1px solid ${toColor}` }}>
                <span className="font-num text-lg font-semibold" style={{ color: toColor }}>
                  {result.toLocaleString('tr-TR', { maximumFractionDigits: convTo === 'BTC' ? 8 : 2 })} {convTo}
                </span>
              </div>
            );
          })()}
        </>
      ) : (
        !ratesError && <p className="text-xs mt-3" style={{ color: MUTED }}>{t.ratesNotLoaded}</p>
      )}
    </div>
  );
}

function InvoiceSignatureModal({ invoice, onClose, onSave, t }) {
  const canvasRef = useRef(null);
  const drawingRef = useRef(false);
  const [hasSignature, setHasSignature] = useState(false);
  const [saving, setSaving] = useState(false);

  function getPos(e) {
    const rect = canvasRef.current.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }
  function start(e) {
    drawingRef.current = true;
    const ctx = canvasRef.current.getContext('2d');
    const { x, y } = getPos(e);
    ctx.beginPath();
    ctx.moveTo(x, y);
    setHasSignature(true);
  }
  function move(e) {
    if (!drawingRef.current) return;
    e.preventDefault();
    const ctx = canvasRef.current.getContext('2d');
    const { x, y } = getPos(e);
    ctx.lineTo(x, y);
    ctx.strokeStyle = '#111111';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }
  function end() { drawingRef.current = false; }
  function clear() {
    const ctx = canvasRef.current.getContext('2d');
    ctx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);
    setHasSignature(false);
  }

  async function submit() {
    if (!hasSignature) return;
    setSaving(true);
    const dataUrl = canvasRef.current.toDataURL('image/png');
    await onSave(dataUrl);
    setSaving(false);
  }

  return (
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="sheet-enter rounded-2xl p-5 w-full" style={{ background: CARD, maxWidth: 400, border: `1px solid ${BORDER}`, borderTop: `3px solid ${GOLD}` }} onClick={e => e.stopPropagation()}>
        <h3 className="font-display text-base mb-1" style={{ color: INK }}>{t.invoiceSignModalTitle}</h3>
        <p className="text-xs mb-3" style={{ color: MUTED }}>{t.invoiceSignModalDesc}</p>
        <div className="text-xs p-3 rounded-lg mb-3" style={{ background: PAPER, border: `1px solid ${BORDER}`, color: INK }}>
          {invoice.desc} — {formatMoney(invoice.amount, invoice.currency || 'TRY')}
        </div>
        <canvas ref={canvasRef} width={320} height={140}
          className="w-full rounded-lg mt-1 mb-2 touch-none"
          style={{ border: `1.5px dashed ${MUTED}`, background: '#fff' }}
          onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
          onTouchStart={start} onTouchMove={move} onTouchEnd={end}
        />
        <button onClick={clear} className="text-xs underline mb-4" style={{ color: MUTED }}>{t.clearSignature}</button>
        <button onClick={submit} disabled={!hasSignature || saving}
          className="w-full py-3 rounded-lg font-medium text-sm disabled:opacity-40" style={{ background: INK, color: PAPER }}>
          {saving ? t.saving : t.save}
        </button>
      </div>
    </div>
  );
}

function ElInshirahModal({ onClose, messages, onSend, onClear, loading, hasKey, t }) {
  const [input, setInput] = useState('');

    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;

  function submit() {
    if (!input.trim() || loading) return;
    onSend(input);
    setInput('');
  }

  return (
    <div className="fixed inset-0 bg-black/50 flex items-end sm:items-center justify-center z-50" onClick={onClose}>

            )}
            <button onClick={onClose} style={{ color: MUTED }}><X size={18} /></button>
          </div>
        </div>

        <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 space-y-3">
          {messages.length === 0 && (
            <div className="text-sm p-3 rounded-lg" style={{ background: PAPER, color: MUTED }}>{t.elInshirahWelcome}</div>
          )}

            </div>
          )}

        <div className="p-3" style={{ borderTop: `1px solid ${BORDER}` }}>
          {!hasKey && (
            <p className="text-[12px] mb-2" style={{ color: BRICK }}>{t.elInshirahKeyMissing}</p>
          )}
          <div className="flex gap-2">
            <input value={input} onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && submit()}
              disabled={!hasKey || loading}
              placeholder={t.elInshirahInputPh}
              className="flex-1 rounded-lg px-3 py-2.5 text-sm disabled:opacity-50" style={{ border: `1px solid ${BORDER}` }} />
            <button onClick={submit} disabled={!hasKey || loading || !input.trim()}
              className="w-11 h-11 rounded-lg flex items-center justify-center shrink-0 disabled:opacity-40" style={{ background: GOLD, color: '#fff' }}>
              <Send size={16} />
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}
