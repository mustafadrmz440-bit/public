/* ---- localStorage tabanlı kalıcı depolama (window.storage API ile uyumlu) ---- */
if (!window.storage) {
  window.storage = {
    async get(key) {
      const v = localStorage.getItem(key);
      return v !== null ? { key, value: v } : null;
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value };
    },
    async delete(key) {
      localStorage.removeItem(key);
      return { key, deleted: true };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return { keys };
    }
  };
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function formatTL(n) { return Number(n || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function paidTotal(inv) {
  if (Array.isArray(inv.payments) && inv.payments.length) return inv.payments.reduce((s, p) => s + p.amount, 0);
  if (inv.status === 'paid') return inv.amount; // eski (kısmi ödeme öncesi) kayıtlarla uyumluluk
  return 0;
}
function remainingAmount(inv) { return Math.max(0, inv.amount - paidTotal(inv)); }
function invStatus(inv) {
  const paid = paidTotal(inv);
  if (paid >= inv.amount) return 'paid';
  if (paid > 0) return 'partial';
  return 'unpaid';
}

function daysSince(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  return Math.floor((now - d) / 86400000);
}
function currentYYYYMM() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

function parseTrDate(str) {
  const parts = (str || '').split('.');
  if (parts.length !== 3) return null;
  const [d, m, y] = parts.map(Number);
  if (!d || !m || !y) return null;
  return new Date(y, m - 1, d);
}
function daysBetweenIsoAndDate(isoDateStr, dateObj) {
  if (!dateObj) return 0;
  const start = new Date(isoDateStr + 'T00:00:00');
  return Math.floor((dateObj - start) / 86400000);
}
// Bir müşterinin faturalarına bakarak güven kademesini hesaplar:
// 'onTime' (zamanında/30 gün içinde), 'medium' (30 günü az geçen, 31-45 gün), 'late' (geciken, 45+ gün)
function personReliability(personInvoices) {
  if (!personInvoices || personInvoices.length === 0) return null;
  const rank = { onTime: 0, medium: 1, late: 2 };
  let worst = 'onTime';
  personInvoices.forEach(inv => {
    const rem = remainingAmount(inv);
    let days;
    if (rem <= 0.004) {
      const payments = inv.payments || [];
      const last = payments[payments.length - 1];
      if (!last) return;
      days = daysBetweenIsoAndDate(inv.date, parseTrDate(last.date));
    } else {
      days = daysSince(inv.date);
    }
    let cat = 'onTime';
    if (days > 45) cat = 'late';
    else if (days > 30) cat = 'medium';
    if (rank[cat] > rank[worst]) worst = cat;
  });
  return worst;
}

// Bu programın dağıtım lisans anahtarı — sadece bu anahtarı bilenler programı bir cihazda
// ilk kez etkinleştirebilir. Gerçek bir MAC adresi kontrolü tarayıcıda teknik olarak mümkün
// değildir (hiçbir tarayıcı JavaScript'in donanım adresine erişmesine izin vermez);
// bu yüzden en yakın gerçekçi çözüm olarak "anahtar + cihaz bazlı hatırlama" kullanılıyor.
// Anahtarın kendisi kod içinde düz metin durmasın diye burada sadece hash'i tutuluyor.
function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = (h * 31 + str.charCodeAt(i)) | 0; }
  return String(h);
}

function formatMoney(amount, currency) {
  const num = Number(amount || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return `${num} ${currency || 'TRY'}`;
}
function sumByCurrency(list, amountFn) {
  const sums = {};
  list.forEach(item => {
    const cur = item.currency || 'TRY';
    const amt = amountFn(item);
    sums[cur] = (sums[cur] || 0) + amt;
  });
  return sums;
}
function currencySumsPositive(sums) {
  return Object.values(sums).some(v => v > 0.004);
}
function formatCurrencySums(sums) {
  const entries = Object.entries(sums).filter(([, v]) => v > 0.004);
  if (entries.length === 0) return `0.00 TRY`;
  return entries.map(([cur, v]) => formatMoney(v, cur)).join(' + ');
}
function scalarizeSums(sums) {
  return Object.values(sums).reduce((a, b) => a + b, 0);
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 900;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// jsPDF'in standart yazı tipleri (helvetica/times) Türkçe'ye özgü İ, ı, ş, ğ karakterlerini
// desteklemiyor (İ→0, ı→1, ş→_ gibi bozuluyordu). Bu yüzden Türkçe karakterleri tam
// destekleyen bir yazı tipini (Noto Sans) PDF'e gömüyoruz.
function arrayBufferToBase64(buffer) {
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

function base64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

async function deriveBackupKey(password, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encryptBackupData(jsonString, password) {
  const enc = new TextEncoder();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveBackupKey(password, salt);
  const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(jsonString));
  return {
    veresiyeEncrypted: true, version: 1,
    salt: arrayBufferToBase64(salt.buffer),
    iv: arrayBufferToBase64(iv.buffer),
    data: arrayBufferToBase64(ciphertext),
  };
}

async function decryptBackupData(encObj, password) {
  const dec = new TextDecoder();
  const salt = new Uint8Array(base64ToArrayBuffer(encObj.salt));
  const iv = new Uint8Array(base64ToArrayBuffer(encObj.iv));
  const key = await deriveBackupKey(password, salt);
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, base64ToArrayBuffer(encObj.data));
  return dec.decode(plainBuf);
}

let pdfFontDataPromise = null;
function loadPdfFontData() {
  if (!pdfFontDataPromise) {
    pdfFontDataPromise = (async () => {
      const [regRes, boldRes] = await Promise.all([
        fetch('https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts/hinted/ttf/NotoSans/NotoSans-Regular.ttf'),
        fetch('https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts/hinted/ttf/NotoSans/NotoSans-Bold.ttf'),
      ]);
      const [regBuf, boldBuf] = await Promise.all([regRes.arrayBuffer(), boldRes.arrayBuffer()]);
      return { regular: arrayBufferToBase64(regBuf), bold: arrayBufferToBase64(boldBuf) };
    })();
  }
  return pdfFontDataPromise;
}

let pdfFontRegisteredOn = null;
async function setupTurkishFont(doc) {
  try {
    const { regular, bold } = await loadPdfFontData();
    doc.addFileToVFS('NotoSans-Regular.ttf', regular);
    doc.addFont('NotoSans-Regular.ttf', 'NotoSans', 'normal');
    doc.addFileToVFS('NotoSans-Bold.ttf', bold);
    doc.addFont('NotoSans-Bold.ttf', 'NotoSans', 'bold');
    doc.setFont('NotoSans', 'normal');
    return true;
  } catch (e) {
    return false; // yazı tipi yüklenemezse jsPDF varsayılan fontuna düşer
  }
}

  async function enableBiometric() {
    try {
      const challenge = crypto.getRandomValues(new Uint8Array(32));
      const userId = crypto.getRandomValues(new Uint8Array(16));
      const cred = await navigator.credentials.create({
        publicKey: {
          challenge,
          rp: { name: 'Hikmetoğlu Motors' },
          user: { id: userId, name: 'yonetici', displayName: 'Yönetici' },
          pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
          authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
          timeout: 60000,
        },
      });
      const credId = arrayBufferToBase64(cred.rawId);
      await window.storage.set('biometric-cred-id', credId);
      setBiometricEnabled(true);
      setToast(t.biometricEnabledToast);
    } catch (e) {
      setError(t.biometricSetupError);
    }
  }

  async function tryBiometricUnlock() {
    try {
      const bc = await window.storage.get('biometric-cred-id');
      if (!bc || !bc.value) return false;
      const challenge = crypto.getRandomValues(new Uint8Array(32));
      const idBytes = base64ToArrayBuffer(bc.value);
      await navigator.credentials.get({
        publicKey: {
          challenge,
          allowCredentials: [{ id: idBytes, type: 'public-key' }],
          userVerification: 'required',
          timeout: 60000,
        },
      });
      setUnlocked(true);
      logAction('Biyometrik giriş', '');
      return true;
    } catch (e) {
      setError(t.biometricAuthError);
      return false;
    }
  }

  function exportAuditLogCSV() {
    const csvEscape = (v) => {
      const s = String(v ?? '');
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const lines = [['Tarih/Saat', 'Personel', 'İşlem', 'Detay'].map(csvEscape).join(',')];
    auditLog.forEach(e => {
      lines.push([e.ts, e.staff, e.action, e.detail].map(csvEscape).join(','));
    });
    const csvContent = '\uFEFF' + lines.join('\r\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `islem-kayitlari-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    setToast('İşlem kayıtları indirildi');
  }

  async function buildExcelWorkbook(monthStr = null, dateRange = null) {
    const XLSX = await loadXLSX();
    const personName = (id) => (people.find(p => p.id === id) || {}).name || '';
    const inRange = (dateStr) => {
      if (monthStr) return (dateStr || '').slice(0, 7) === monthStr;
      if (dateRange) return (!dateRange.from || dateStr >= dateRange.from) && (!dateRange.to || dateStr <= dateRange.to);
      return true;
    };
    const invoicesForBook = (monthStr || dateRange) ? invoices.filter(inv => inRange(inv.date)) : invoices;
    const expensesForBook = (monthStr || dateRange) ? expenses.filter(e => inRange(e.date)) : expenses;
    const printLogForBook = (monthStr || dateRange) ? printLog.filter(pl => inRange(pl.invoiceDate)) : printLog;

    const invoiceRows = invoicesForBook.map(inv => ({
      [t.person]: personName(inv.personId),
      [t.descCol]: inv.desc,
      [t.dateCol]: inv.date,
      [t.amountCol]: inv.amount,
      [t.currencyCol]: inv.currency || 'TRY',
      [t.paidCol]: paidTotal(inv),
      [t.remainingCol]: remainingAmount(inv),
      [t.statusCol]: remainingAmount(inv) <= 0.004 ? t.statusPaid : (paidTotal(inv) > 0 ? t.statusPartial : t.statusUnpaid),
    }));

    const paymentRows = [];
    invoices.forEach(inv => {
      (inv.payments || []).forEach(p => {
        if (monthStr || dateRange) {
          const d = parseTrDate(p.date);
          if (!d) return;
          const pIso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
          if (monthStr && pIso.slice(0, 7) !== monthStr) return;
          if (dateRange && !((!dateRange.from || pIso >= dateRange.from) && (!dateRange.to || pIso <= dateRange.to))) return;
        }
        paymentRows.push({
          [t.person]: personName(inv.personId),
          [t.descCol]: inv.desc,
          [t.dateCol]: p.date,
          [t.amountCol]: p.amount,
          [t.currencyCol]: inv.currency || 'TRY',
          [t.methodCol]: methodLabelFor(p.method),
        });
      });
    });

    const expenseRows = expensesForBook.map(e => ({
      [t.descCol]: e.desc,
      [t.dateCol]: e.date,
      [t.amountCol]: e.amount,
      [t.currencyCol]: e.currency || 'TRY',
      [t.expenseCategoryLabel]: t[`expCat${e.category.charAt(0).toUpperCase()}${e.category.slice(1)}`] || e.category,
    }));

    const collectedSums = sumByCurrency(invoicesForBook, paidTotal);
    const outstandingSums = sumByCurrency(invoicesForBook, remainingAmount);
    const expenseSums = sumByCurrency(expensesForBook, e => e.amount);
    const summaryCurrencies = Array.from(new Set([...Object.keys(collectedSums), ...Object.keys(outstandingSums), ...Object.keys(expenseSums)]));
    const summaryRows = summaryCurrencies.map(cur => ({
      [t.currencyCol]: cur,
      [t.totalIncomeLabel]: collectedSums[cur] || 0,
      [t.totalExpenseLabel]: expenseSums[cur] || 0,
      [t.netProfitLabel]: (collectedSums[cur] || 0) - (expenseSums[cur] || 0),
      [t.uncollectedLabel]: outstandingSums[cur] || 0,
    }));

    const printLogRows = printLogForBook.map(pl => ({
      [t.person]: pl.personName,

  async function buildMonthlyInvoicePackPDF(monthStr) {
    const PDFLib = await loadPDFLib();
    const monthInvoices = invoices
      .filter(inv => (inv.date || '').slice(0, 7) === monthStr)
      .sort((a, b) => (a.date < b.date ? -1 : 1));
    const merged = await PDFLib.PDFDocument.create();
    for (const inv of monthInvoices) {
      const person = people.find(p => p.id === inv.personId);
      if (!person) continue;
      const { doc } = await buildInvoicePDF(person, inv);
      const bytes = doc.output('arraybuffer');
      const srcDoc = await PDFLib.PDFDocument.load(bytes);
      const copiedPages = await merged.copyPages(srcDoc, srcDoc.getPageIndices());
      copiedPages.forEach(page => merged.addPage(page));
    }
    const mergedBytes = await merged.save();
    return { bytes: mergedBytes, filename: `hikmetoglu-motors-faturalar-${monthStr}.pdf`, count: monthInvoices.length };
  }

  async function createPaymentPlan(personId, currency, totalAmount, installmentCount, startDate) {
    const n = Math.max(1, Number(installmentCount) || 1);
    const total = Number(totalAmount) || 0;
    if (total <= 0) return;
    const base = Math.floor((total / n) * 100) / 100;
    const installments = [];
    let allocated = 0;
    for (let i = 0; i < n; i++) {
      const isLast = i === n - 1;
      const amount = isLast ? Math.round((total - allocated) * 100) / 100 : base;
      allocated += amount;
      installments.push({
        id: uid(), index: i + 1, dueDate: addMonths(startDate, i), amount,
        paid: false, paidDate: null,
      });
    }
    const plan = {
      id: uid(), personId, currency: currency || 'TRY', totalAmount: total,
      installmentCount: n, startDate, createdAt: new Date().toLocaleDateString('tr-TR'),
      installments, createdBy: staffName || null,
    };
    savePaymentPlans([...paymentPlans, plan]);
    setPlanPerson(null);
    setToast('Ödeme planı oluşturuldu');
  }

  async function payPlanInstallment(plan, installmentOrId) {
    const installmentId = (installmentOrId && typeof installmentOrId === 'object') ? installmentOrId.id : installmentOrId;
    const inst = plan.installments.find(i => i.id === installmentId);
    if (!inst || inst.paid) return;
    const todayStr = new Date().toLocaleDateString('tr-TR');
    let remaining = inst.amount;
    const personInvoicesSorted = invoices
      .filter(inv => inv.personId === plan.personId && (inv.currency || 'TRY') === plan.currency && remainingAmount(inv) > 0)
      .sort((a, b) => (a.date < b.date ? -1 : 1));
    const payAmountByInvoiceId = {};
    for (const inv of personInvoicesSorted) {
      if (remaining <= 0.004) break;
      const rem = remainingAmount(inv);
      const pay = Math.min(rem, remaining);
      payAmountByInvoiceId[inv.id] = pay;
      remaining -= pay;
    }
    const nextInvoices = invoices.map(inv => {
      const pay = payAmountByInvoiceId[inv.id];
      if (!pay) return inv;
      const payment = { id: uid(), amount: pay, method: 'nakit', date: todayStr, hasReceipt: false, by: staffName || null };
      return { ...inv, payments: [...(inv.payments || []), payment] };
    });
    saveInvoices(nextInvoices);

    const nextPlans = paymentPlans.map(p => p.id === plan.id
      ? { ...p, installments: p.installments.map(i => i.id === installmentId ? { ...i, paid: true, paidDate: todayStr } : i) }
      : p);
    savePaymentPlans(nextPlans);

    const person = people.find(p => p.id === plan.personId);
    logAction('Taksit ödendi', `${person ? person.name : ''} — ${t.installmentLabel(inst.index, plan.installmentCount)} — ${formatMoney(inst.amount, plan.currency)}`);
    setToast('Taksit ödendi olarak işaretlendi');
  }

  function buildBusinessContext() {
    const todayIso = new Date().toISOString().slice(0, 10);
    const totalUnpaid = sumByCurrency(invoices, remainingAmount);
    const topDebtorsList = people
      .map(p => ({ name: p.name, sums: balanceFor(p.id) }))
      .filter(x => currencySumsPositive(x.sums))
      .sort((a, b) => scalarizeSums(b.sums) - scalarizeSums(a.sums))
      .slice(0, 5)
      .map(x => `${x.name}: ${formatCurrencySums(x.sums)}`)
      .join(', ') || 'yok';
    const overdueInvoices = invoices.filter(inv => remainingAmount(inv) > 0.004 && daysSince(inv.date) > 30);
    const overdueNames = [...new Set(overdueInvoices.map(inv => {
      const p = people.find(pp => pp.id === inv.personId);
      return p ? p.name : '?';
    }))].join(', ') || 'yok';
    const collected = sumByCurrency(invoices, paidTotal);
    const expenseSums = sumByCurrency(expenses.filter(e => (e.date || '').slice(0, 7) === currentYYYYMM()), e => e.amount);
    const collectedThisMonth = sumByCurrency(
      invoices.flatMap(inv => (inv.payments || []).filter(p => paymentYYYYMM(p.date) === currentYYYYMM()).map(p => ({ ...p, currency: inv.currency }))),
      p => p.amount
    );
    const lowStock = stockItems.filter(s => s.quantity <= s.minQuantity).map(s => `${s.name} (${s.quantity} ${s.unit})`).join(', ') || 'yok';
    const upcomingAppts = appointments
      .filter(a => !a.done && a.date >= todayIso)
      .sort((a, b) => (a.date < b.date ? -1 : 1))
      .slice(0, 5)
      .map(a => `${a.customerName} — ${a.date}${a.time ? ' ' + a.time : ''}`)
      .join(', ') || 'yok';
    const openPlans = paymentPlans.filter(pl => !pl.installments.every(i => i.paid)).length;

    return [
      `Toplam müşteri sayısı: ${people.length}`,
      `Toplam açık (tahsil edilmemiş) bakiye: ${formatCurrencySums(totalUnpaid)}`,
      `En çok borçlu 5 müşteri: ${topDebtorsList}`,
      `30 günden uzun süredir gecikmiş faturası olan müşteriler: ${overdueNames}`,
      `Bugüne kadar toplam tahsil edilen: ${formatCurrencySums(collected)}`,
      `Bu ay tahsil edilen: ${formatCurrencySums(collectedThisMonth)}`,
      `Bu ay giderler: ${formatCurrencySums(expenseSums)}`,
      `Azalan stok kalemleri: ${lowStock}`,
      `Yaklaşan randevular: ${upcomingAppts}`,
      `Tamamlanmamış ödeme planı sayısı: ${openPlans}`,
      `Bugünün tarihi: ${todayIso}`,
    ].join('\n');
  }

  async function sendElInshirahMessage(userText) {
    if (!anthropicApiKey) { setError(t.elInshirahKeyMissing); return; }
    if (!userText.trim()) return;
    const newMessages = [...elInshirahMessages, { role: 'user', content: userText.trim() }];
    persistElInshirahMessages(newMessages);
    setElInshirahLoading(true);
    try {
      const systemPrompt = `Senin adın El-İnşirah. Hikmetoğlu Motors adlı oto galeri/servisin Alacak-Verecek Programı içinde çalışan yardımcı bir analiz asistanısın. Aşağıda programın güncel iş verilerinin bir özeti var; sorulara bu verilere dayanarak, kısa, net ve pratik (iş sahibinin anlayacağı dilde, Türkçe) cevaplar ver. Sorunları tespit et, öneriler sun. Eğer soru bu verilerle ilgisizse, elindeki bilgiyle nazikçe yardımcı ol.\n\n${buildBusinessContext()}`;
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': anthropicApiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-sonnet-5',
          max_tokens: 1024,
          system: systemPrompt,
          messages: newMessages.map(m => ({ role: m.role, content: m.content })),
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error((data && data.error && data.error.message) || 'API hatası');
      const replyText = (data.content || []).map(c => c.text || '').join('\n').trim() || t.elInshirahEmptyReply;
      persistElInshirahMessages([...newMessages, { role: 'assistant', content: replyText }]);
    } catch (e) {
      persistElInshirahMessages([...newMessages, { role: 'assistant', content: t.elInshirahError(e.message || '') }]);
    } finally {
      setElInshirahLoading(false);
    }
  }

  async function addPayment(invoiceId, amountPaid, method, file) {
    const amt = Number(amountPaid);
    if (!amt || amt <= 0) return;
    const paymentId = uid();
    let hasReceipt = false;
    if (file) {
      try {
        const dataUrl = await compressImage(file);
        await window.storage.set(`receipt-${paymentId}`, dataUrl);
        hasReceipt = true;
      } catch (e) { setError('Fotoğraf kaydedilemedi.'); }
    }
    const payment = { id: paymentId, amount: amt, method, date: new Date().toLocaleDateString('tr-TR'), hasReceipt, by: staffName || null };
    const next = invoices.map(inv => inv.id === invoiceId
      ? { ...inv, payments: [...(inv.payments || []), payment] }
      : inv);
    saveInvoices(next);
    setPayingInvoice(null);
    const updated = next.find(i => i.id === invoiceId);
    const rem = remainingAmount(updated);
    const person = people.find(p => p.id === updated.personId);
    logAction('Ödeme alındı', `${person ? person.name : ''} — ${formatMoney(amt, updated.currency)} (${method})`);
    setToast(rem <= 0 ? 'Ödeme kaydedildi — fatura kapandı' : `Ödeme kaydedildi — kalan ${formatMoney(rem, updated.currency)}`);
  }

    const inv = invoices.find(i => i.id === invoiceId);
    const payment = inv && (inv.payments || []).find(p => p.id === paymentId);
    const next = invoices.map(inv => inv.id === invoiceId
      ? { ...inv, payments: (inv.payments || []).filter(p => p.id !== paymentId) }
      : inv);
    saveInvoices(next);
    try { await window.storage.delete(`receipt-${paymentId}`); } catch (e) {}
    logAction('Ödeme silindi', payment ? formatMoney(payment.amount, inv.currency) : paymentId);
    if (payment) {
      setUndoAction({
        label: t.undoDeletePaymentLabel,
        restore: () => {
          saveInvoices(next.map(i => i.id === invoiceId ? { ...i, payments: [...(i.payments || []), payment] } : i));
          setUndoAction(null);
          setToast(t.undoRestoredToast);
        },
      });
    } else {
      setToast('Ödeme silindi');
    }
  }

  async function buildInvoicePDF(person, inv) {
    const jsPDF = await loadJsPDF();
    const doc = new jsPDF({ unit: 'mm', format: 'a5' });
    await setupTurkishFont(doc);
    const L = INVOICE_DOC_LABELS[docLang] || INVOICE_DOC_LABELS.tr;
    const inkRGB = [16, 25, 46];
    const redRGB = [178, 24, 24];

    // Kırmızı-beyaz marka başlığı
    const pageW = 148;
    doc.setFillColor(...redRGB);
    doc.rect(0, 0, pageW, 30, 'F');
    const logoW = 34;
    const logoH = logoW / LOGO_ASPECT;
    doc.setFillColor(255, 255, 255);
    doc.roundedRect(8, 5, logoW + 4, logoH + 8, 2, 2, 'F');
    try { doc.addImage(LOGO_DATA_URI, 'PNG', 10, 9, logoW, logoH); } catch (e) {}
    doc.setFont('NotoSans', 'bold');
    doc.setFontSize(14);
    doc.setTextColor(255, 255, 255);
    doc.text('HİKMETOĞLU MOTORS', 52, 15);
    doc.setFont('NotoSans', 'normal');
    doc.setFontSize(8.5);
    doc.setTextColor(255, 225, 225);
    doc.text(L.subtitle, 52, 21);

    let y = 40;
    doc.setFont('NotoSans', 'bold');
    doc.setFontSize(15);
    doc.setTextColor(...inkRGB);
    doc.text(L.title, 12, y);
    if (inv.invoiceNo) {
      doc.setFontSize(10);
      doc.setTextColor(...redRGB);
      doc.text(`#${String(inv.invoiceNo).padStart(4, '0')}`, 136, y, { align: 'right' });
    }
    y += 4;
    doc.setDrawColor(...redRGB);
    doc.setLineWidth(0.8);
    doc.line(12, y, 136, y);
    y += 10;
    doc.setFontSize(11);
    doc.setTextColor(40, 40, 40);
    const st = invStatus(inv);
    const paid = paidTotal(inv);
    const rem = remainingAmount(inv);
    const rows = [
      [L.person, person.name],
      [L.phone, person.phone || '-'],
    ];
    if (person.address) rows.push([L.address, person.address]);
    if (person.plate) rows.push([L.plate, person.plate]);
    rows.forEach(([label, val]) => {
      doc.setFont('NotoSans', 'bold');
      doc.text(`${label}:`, 12, y);
      doc.setFont('NotoSans', 'normal');
      doc.text(String(val), 55, y);
      y += 7;
    });

    doc.setFont('NotoSans', 'bold');
    doc.text(`${L.desc}:`, 12, y);
    y += 5.5;
    doc.setFont('NotoSans', 'normal');
    (inv.desc || '').split('\n').forEach(line => {
      if (line.trim() === '') { y += 3; return; }
      const wrapped = doc.splitTextToSize(line, 116);
      doc.text(wrapped, 12, y);
      y += wrapped.length * 5.5;
    });
    y += 2.5;

    if (inv.items && inv.items.length > 0) {
      doc.setFont('NotoSans', 'bold');
      doc.setFontSize(9.5);
      doc.text(L.itemCol, 12, y);
      doc.text(L.qtyCol, 82, y);
      doc.text(L.priceCol, 100, y);
      doc.text(L.totalCol, 122, y);
      y += 2;
      doc.setDrawColor(200, 200, 200);
      doc.setLineWidth(0.2);
      doc.line(12, y, 136, y);
      y += 4.5;
      doc.setFont('NotoSans', 'normal');
      inv.items.forEach(it => {
        const lineTotal = (Number(it.qty) || 0) * (Number(it.unitPrice) || 0);
        doc.text(String(it.desc || '-').slice(0, 34), 12, y);
        doc.text(String(it.qty || 0), 82, y);
        doc.text(formatTL(it.unitPrice || 0), 100, y);
        doc.text(formatTL(lineTotal), 122, y);
        y += 5.5;
      });
      y += 3;
      doc.setFontSize(11);
    }

    const rows2 = [
      [L.date, inv.date],
      [L.totalAmount, formatMoney(inv.amount, inv.currency)],
      [L.status, st === 'paid' ? L.statusPaid : st === 'partial' ? L.statusPartial : L.statusUnpaid],
    ];
    if (st !== 'unpaid') {
      rows2.push([L.paidTotal, formatMoney(paid, inv.currency)]);
    }
    if (st === 'partial') {
      rows2.push([L.remainingBalance, formatMoney(rem, inv.currency)]);
    }
    if (inv.editedAt) {
      rows2.push([L.edited, inv.editedAt]);
    }
    rows2.forEach(([label, val]) => {
      doc.setFont('NotoSans', 'bold');
      doc.text(`${label}:`, 12, y);
      doc.setFont('NotoSans', 'normal');
      doc.text(String(val), 55, y);
      y += 7;
    });

    const payments = inv.payments || [];
    if (payments.length) {
      y += 3;
      doc.setFont('NotoSans', 'bold');
      doc.setFontSize(10);
      doc.text(`${L.paymentHistory}:`, 12, y);
      y += 6;
      doc.setFont('NotoSans', 'normal');
      doc.setFontSize(9.5);
      payments.forEach(p => {
        const label = { nakit: L.cash, kart: L.card, dekont: L.transfer, cek: L.cheque, usdt: L.usdt, btc: L.btc }[p.method] || p.method;
        doc.text(`${p.date} — ${formatMoney(p.amount, inv.currency)} (${label})`, 12, y);
        y += 5.5;
      });
      y += 2;
    }

    for (const p of payments) {
      if (p.hasReceipt) {
        const img = await getReceipt(`receipt-${p.id}`);
        if (img) {
          y += 4;
          doc.setFont('NotoSans', 'bold');
          doc.setFontSize(10);
          doc.text(`${L.receiptFor} (${p.date}):`, 12, y);
          y += 4;
          try { doc.addImage(img, 'JPEG', 12, y, 70, 50); y += 54; } catch (e) {}
        }
      }
    }

    if (inv.note) {
      y += 4;
      doc.setDrawColor(...redRGB);
      doc.setLineWidth(0.4);
      doc.line(12, y, 136, y);
      y += 6;
      doc.setFont('NotoSans', 'normal');
      doc.setFontSize(9.5);
      doc.setTextColor(90, 90, 90);
      const wrapped = doc.splitTextToSize(inv.note, 116);
      doc.text(wrapped, 12, y);
      y += wrapped.length * 5;
    }

    if (inv.hasSignature) {
      const sig = await getReceipt(`signature-invoice-${inv.id}`);
      if (sig) {
        if (y > 155) { doc.addPage(); y = 16; } else { y += 8; }
        doc.setFont('NotoSans', 'bold');
        doc.setFontSize(9.5);
        doc.setTextColor(...inkRGB);
        doc.text(`${L.signatureLabel}:`, 12, y);
        y += 3;
        try { doc.addImage(sig, 'PNG', 12, y, 60, 26); } catch (e) {}
      }
    }

    const filename = `fatura-${person.name.replace(/\s+/g, '-')}-${inv.date}.pdf`;
    return { doc, filename };
  }

  async function ensureDriveFolder() {
    if (driveFolderId) return driveFolderId;
    const searchRes = await fetch(
      `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent("name='Hikmetoğlu Motors Yedekler' and mimeType='application/vnd.google-apps.folder' and trashed=false")}&fields=files(id,name)`,
      { headers: { Authorization: `Bearer ${driveAccessToken}` } }
    );
    const searchData = await searchRes.json();
    if (searchData.files && searchData.files.length > 0) {
      const id = searchData.files[0].id;
      setDriveFolderId(id);
      try { await window.storage.set('google-drive-folder-id', id); } catch (e) {}
      return id;
    }
    const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
      method: 'POST',
      headers: { Authorization: `Bearer ${driveAccessToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: 'Hikmetoğlu Motors Yedekler', mimeType: 'application/vnd.google-apps.folder' }),
    });
    const createData = await createRes.json();
    setDriveFolderId(createData.id);
    try { await window.storage.set('google-drive-folder-id', createData.id); } catch (e) {}
    return createData.id;
  }

  async function uploadToDrive(filename, blob) {
    if (!driveAccessToken) return false;
    try {
      const folderId = await ensureDriveFolder();
      const metadata = { name: filename, parents: [folderId] };
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      form.append('file', blob);
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: { Authorization: `Bearer ${driveAccessToken}` },
        body: form,
      });
      if (!res.ok) throw new Error('upload failed');
      setToast(t.driveUploadedToast(filename));
      return true;
    } catch (e) {
      setError(t.driveUploadError);
      return false;
    }
  }


  async function exportBackup(password) {
    const receipts = {};
    for (const inv of invoices) {
      for (const p of inv.payments || []) {
        if (p.hasReceipt) {
          const img = await getReceipt(`receipt-${p.id}`);
          if (img) receipts[`receipt-${p.id}`] = img;
        }
      }
    }
    for (const person of people) {
      if (person.hasIdPhoto) {
        const img = await getReceipt(`idphoto-${person.id}`);
        if (img) receipts[`idphoto-${person.id}`] = img;
      }
    }
    for (const c of contracts) {
      const img = await getReceipt(`signature-${c.id}`);
      if (img) receipts[`signature-${c.id}`] = img;
    }
    const payload = { exportedAt: new Date().toISOString(), people, invoices, contracts, paymentPlans, receipts };
    const jsonStr = JSON.stringify(payload, null, 2);
    const pass = (password || '').trim();

    let blobContent = jsonStr;
    let filename = `veresiye-yedek-${new Date().toISOString().slice(0, 10)}.json`;
    if (pass) {
      try {
        const encObj = await encryptBackupData(jsonStr, pass);
        blobContent = JSON.stringify(encObj);
        filename = `veresiye-yedek-sifreli-${new Date().toISOString().slice(0, 10)}.json`;
      } catch (e) {
        setError('Şifreli yedek oluşturulamadı.');
        return;
      }
    }
    const blob = new Blob([blobContent], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
    setToast(pass ? 'Şifreli yedek indirildi' : 'Yedek indirildi');
    const nowIso = new Date().toISOString();
    setLastBackupAt(nowIso);
    try { await window.storage.set('last-backup-at', nowIso); } catch (e) {}
    if (autoUploadDrive && driveAccessToken) await uploadToDrive(filename, blob);
  }

  function exportCSV() {
    const headers = ['Fatura No', 'Müşteri', 'Telefon', 'Açıklama', 'Tarih', 'Tutar', 'Döviz', 'Durum', 'Ödenen', 'Kalan'];
    const csvEscape = (v) => {
      const s = String(v ?? '');
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const lines = [headers.map(csvEscape).join(',')];
    invoices.forEach(inv => {
      const person = people.find(p => p.id === inv.personId);
      const st = invStatus(inv);
      const stLabel = st === 'paid' ? 'ÖDENDİ' : st === 'partial' ? 'KISMİ ÖDENDİ' : 'ÖDENMEDİ';
      lines.push([
        inv.invoiceNo || '', person ? person.name : '', person ? (person.phone || '') : '',
        (inv.desc || '').replace(/\n/g, ' | '), inv.date, inv.amount, inv.currency || 'TRY',
        stLabel, paidTotal(inv), remainingAmount(inv),
      ].map(csvEscape).join(','));
    });
    const csvContent = '\uFEFF' + lines.join('\r\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `veresiye-kayitlar-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();

  async function importBackup(file, password) {
    try {
      const text = await file.text();
      let payload = JSON.parse(text);
      if (payload && payload.veresiyeEncrypted) {
        const pass = (password || '').trim();
        if (!pass) { setError('Bu yedek şifreli. Önce şifresini gir.'); return; }
        try {
          const decrypted = await decryptBackupData(payload, pass);
          payload = JSON.parse(decrypted);
        } catch (e) {
          setError('Şifre yanlış veya dosya bozuk.');
          return;
        }
      }
      if (!Array.isArray(payload.people) || !Array.isArray(payload.invoices)) {
        throw new Error('geçersiz format');
      }
      await savePeople(payload.people);
      await saveInvoices(payload.invoices);
      if (Array.isArray(payload.contracts)) {
        await saveContracts(payload.contracts);
      }
      if (Array.isArray(payload.paymentPlans)) {
        await savePaymentPlans(payload.paymentPlans);
      }
      if (payload.receipts) {
        for (const [key, img] of Object.entries(payload.receipts)) {
          try { await window.storage.set(key, img); } catch (e) {}
        }
      }
      setToast('Yedek yüklendi');
    } catch (e) {
      setError('Yedek dosyası okunamadı. Geçerli bir .json yedek dosyası seçtiğinden emin ol.');
    }
  }

  function parseCSV(text) {
    const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
    if (lines.length < 2) return [];
    const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
    return lines.slice(1).map(line => {
      const cols = line.split(',').map(c => c.trim());
      const row = {};
      headers.forEach((h, i) => { row[h] = cols[i] || ''; });
      return row;
    });
  }

  async function importCSV(file) {

      if (rows.length === 0) throw new Error('boş');

      const nextInvoices = [...invoices];
      let addedPeople = 0, addedInvoices = 0;
      for (const row of rows) {
        if (!row.name || !row.amount) continue;
        let person = nextPeople.find(p => p.name.trim().toLowerCase() === row.name.trim().toLowerCase());
        if (!person) {
          person = { id: uid(), name: row.name.trim(), phone: (row.phone || '').trim() };
          nextPeople.push(person);
          addedPeople++;
        }
        nextInvoices.push({
          id: uid(), personId: person.id,
          desc: row.description || row.aciklama || 'CSV içe aktarım',
          amount: Number(row.amount) || 0,
          date: row.date || new Date().toISOString().slice(0, 10),
          note: null, payments: [], createdBy: staffName || null
        });
        addedInvoices++;
      }
      await savePeople(nextPeople);
      await saveInvoices(nextInvoices);
      setToast(`${addedInvoices} fatura, ${addedPeople} yeni müşteri içe aktarıldı`);

  function paymentYYYYMM(dateStr) {
    const parts = (dateStr || '').split('.');

  const netProfitCurrencies = Array.from(new Set([...Object.keys(collectedThisMonthSums), ...Object.keys(expensesThisMonthSums)]));
  const trendPrimaryCurrency = (() => {
    const sums = sumByCurrency(invoices, inv => inv.amount);
    const entries = Object.entries(sums);
    if (entries.length === 0) return 'TRY';
    return entries.sort((a, b) => b[1] - a[1])[0][0];
  })();
  const monthlyTrend = (() => {
    const months = [];
    const now = new Date();
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      months.push({ ym: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`, monthIdx: d.getMonth() });
    }
    return months.map(({ ym, monthIdx }) => {
      let collected = 0;
      invoices.forEach(inv => {
        if ((inv.currency || 'TRY') !== trendPrimaryCurrency) return;
        (inv.payments || []).forEach(p => {
          if (paymentYYYYMM(p.date) === ym) collected += p.amount;
        });
      });
      let expense = 0;
      expenses.forEach(e => {
        if ((e.currency || 'TRY') !== trendPrimaryCurrency) return;
        if ((e.date || '').slice(0, 7) === ym) expense += e.amount;
      });
      return { ym, monthIdx, collected, expense };

            <button onClick={() => setTab('overdue')} className="flex-1 flex flex-col items-center gap-1 py-3 relative">

              <span className="text-[12px] font-medium" style={{ color: tab === 'backup' ? INK : MUTED }}>{t.tabBackup}</span>

      {toast && (

      {undoAction && (

          <span>{undoAction.label}</span>
          <button onClick={undoAction.restore} className="font-bold underline shrink-0" style={{ color: GOLD }}>

      {appPasswordGate && (
        <PasswordGate
          title={t.staffAccessTitle}
          description={t.staffAccessDesc}
          onCheck={checkPassword}
          onSuccess={() => { setAppPasswordGate(null); setTab('backup'); }}
          onCancel={() => setAppPasswordGate(null)}
          t={t}
        />
      )}
      {showAddPerson && <AddPersonModal onClose={() => setShowAddPerson(false)} onAdd={addPerson} t={t} />}
      {editingPerson && (
        <EditPersonModal

          onClose={() => setEditingPerson(null)}
          onSave={(name, phone, address, plate, email) => updatePerson(editingPerson.id, name, phone, address, plate, email)}
          t={t}

      )}
      {signingInvoice && (
        <InvoiceSignatureModal
          invoice={signingInvoice}
          onClose={() => setSigningInvoice(null)}
          onSave={(dataUrl) => saveInvoiceSignature(signingInvoice.id, dataUrl)}
          t={t}

      {showAddRecurring && (
        <RecurringInvoiceModal
          person={showAddRecurring}
          onClose={() => setShowAddRecurring(null)}
          onSave={(desc, amount, currency, day) => addRecurringTemplate(showAddRecurring.id, desc, amount, currency, day)}
          t={t}
        />
      )}
      {showAddInvoice && activePerson && (
        <AddInvoiceModal onClose={() => setShowAddInvoice(false)} onAdd={(d, a, dt, n, c, items, addr) => addInvoice(activePerson.id, d, a, dt, n, c, items, addr)} person={activePerson} t={t} />
      )}
      {payingInvoice && (
        <PayModal invoice={payingInvoice} remainingAmount={remainingAmount(payingInvoice)}
          onClose={() => setPayingInvoice(null)} onConfirm={addPayment} t={t} />
      )}
      {editingInvoice && (
        <EditInvoiceModal invoice={editingInvoice} onClose={() => setEditingInvoice(null)}
          onSave={(d, a, dt, n, c, items) => updateInvoice(editingInvoice.id, d, a, dt, n, c, items)} t={t} />
      )}
      {contractPerson && (
        <ContractModal
          person={contractPerson}
          debtSums={balanceFor(contractPerson.id)}
          onClose={() => setContractPerson(null)}
          onSave={(sig, note) => createContract(contractPerson, balanceFor(contractPerson.id), sig, note)}
          docLang={docLang}
          onChangeDocLang={changeDocLang}
          t={t}
        />
      )}
      {planPerson && (
        <PaymentPlanModal
          person={planPerson}
          debtSums={balanceFor(planPerson.id)}
          onClose={() => setPlanPerson(null)}
          onSave={(currency, total, count, start) => createPaymentPlan(planPerson.id, currency, total, count, start)}
          docLang={docLang}
          onChangeDocLang={changeDocLang}
          t={t}
        />
      )}
      {serviceRecordPerson && (
        <ServiceRecordModal
          person={serviceRecordPerson}
          onClose={() => setServiceRecordPerson(null)}
          onSave={(plate, date, desc, km, cost, currency, photoFile) => addServiceRecord(serviceRecordPerson.id, plate, date, desc, km, cost, currency, photoFile)}
          t={t}
        />
      )}
      {showAddExpense && (
        <ExpenseModal onClose={() => setShowAddExpense(false)} onSave={addExpense} t={t} />
      )}
      {confirmDeleteExpense && (
        <TwoStepConfirm
          danger
          message1={t.deleteExpenseConfirm1}
          message2={t.deleteExpenseConfirm2}
          onConfirm={() => deleteExpense(confirmDeleteExpense.id)}
          onCancel={() => setConfirmDeleteExpense(null)}
          t={t}
        />
      )}
      {(showAddStock || editingStockItem) && (
        <StockItemModal
          item={editingStockItem}
          onClose={() => { setShowAddStock(false); setEditingStockItem(null); }}
          onSave={(name, qty, unit, minQty, cost, sell, currency) =>
            addOrUpdateStockItem(editingStockItem ? editingStockItem.id : null, name, qty, unit, minQty, cost, sell, currency)}
          t={t}
        />
      )}
      {confirmDeleteStock && (
        <TwoStepConfirm
          danger
          message1={t.deleteStockConfirm1}
          message2={t.deleteStockConfirm2}
          onConfirm={() => deleteStockItem(confirmDeleteStock.id)}
          onCancel={() => setConfirmDeleteStock(null)}
          t={t}
        />
      )}
      {showAddAppointment && (
        <AppointmentModal onClose={() => setShowAddAppointment(false)} onSave={addAppointment} people={people} t={t} />
      )}
      {confirmDeleteAppointment && (
        <TwoStepConfirm
          danger
          message1={t.deleteAppointmentConfirm1}
          message2={t.deleteAppointmentConfirm2}
          onConfirm={() => deleteAppointment(confirmDeleteAppointment.id)}
          onCancel={() => setConfirmDeleteAppointment(null)}
          t={t}
        />
      )}
      {batchQueue && (
        <BatchReminderModal
          items={batchQueue}
          onSend={(item) => sendOverdueReminderWA(item.person, item.invoices)}
          onClose={() => setBatchQueue(null)}
          onDone={() => { setBatchQueue(null); markReminderSent(); }}
          t={t}
        />
      )}
      {showStaffPrompt && (
        <StaffPromptModal
          staffMembers={staffMembers}
          checkPin={(name, pin) => {
            const s = staffMembers.find(m => m.name === name);
            return s && hashPass(pin) === s.pinHash;
          }}
          onSave={(name) => {
            const trimmed = name.trim();
            setStaffName(trimmed);
            const s = staffMembers.find(m => m.name === trimmed);
            setStaffRole(s ? (s.role || 'staff') : 'admin');
            setShowStaffPrompt(false);
          }}
          onSkip={() => setShowStaffPrompt(false)}
          t={t}
        />
      )}
      {showChangePassword && (
        <ChangePasswordModal
          onChange={changePassword}
          onClose={() => setShowChangePassword(false)}
          t={t}
        />
      )}
    </div>
  );
}

function PersonView({ person, invoices, onDeletePerson, onEditPerson, onSendInvoice, onSendPaid, onSendDebtReminder, onSendDebtReminderSMS, onSendDebtReminderEmail, onDownloadPDF, onPrintPDF, onSendPDF, onSignInvoice, onPay, onEdit, onDeletePayment, onOpenContract, onSetIdPhoto, contracts, onDownloadContract, onOpenPlan, onPlanBlocked, plans, onPayInstallment, onRemindInstallment, onPrintPlan, onDownloadPlan, onSendPlan, serviceRecords, onOpenServiceRecord, onDeleteServiceRecord, onPrintServiceHistory, onDownloadServiceHistory, onSendServiceHistory, recurringTemplates, onOpenRecurring, onToggleRecurring, onDeleteRecurring, onOpenCustomerView, checkPassword, getReceipt, lateFeeRate, docLang, onChangeDocLang, t }) {
  const [receiptView, setReceiptView] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [confirmDeletePayment, setConfirmDeletePayment] = useState(null); // { invoiceId, paymentId, amount, currency }
  const [confirmDeleteServiceRecord, setConfirmDeleteServiceRecord] = useState(null);
  const [plansExpanded, setPlansExpanded] = useState(false);
  const [passwordGate, setPasswordGate] = useState(null); // { type: 'delete' | 'edit' | 'delete-payment', ... }
  const [invoiceSearch, setInvoiceSearch] = useState('');
  const [showInvoiceFilters, setShowInvoiceFilters] = useState(false);
  const [filterDateFrom, setFilterDateFrom] = useState('');
  const [filterDateTo, setFilterDateTo] = useState('');
  const [filterAmountMin, setFilterAmountMin] = useState('');
  const [filterAmountMax, setFilterAmountMax] = useState('');
  const sortedAll = [...invoices].sort((a, b) => (a.date < b.date ? 1 : -1));
  const searchQ = invoiceSearch.trim().toLowerCase();
  const hasActiveFilters = !!(filterDateFrom || filterDateTo || filterAmountMin || filterAmountMax);
  const sorted = sortedAll.filter(inv => {
    if (searchQ && !(inv.desc || '').toLowerCase().includes(searchQ)) return false;
    if (filterDateFrom && inv.date < filterDateFrom) return false;
    if (filterDateTo && inv.date > filterDateTo) return false;
    if (filterAmountMin && inv.amount < Number(filterAmountMin)) return false;
    if (filterAmountMax && inv.amount > Number(filterAmountMax)) return false;
    return true;
  });
  const unpaidSums = sumByCurrency(invoices, remainingAmount);
  const hasUnpaid = currencySumsPositive(unpaidSums);
  const methodLabels = { nakit: t.cash, kart: t.card, dekont: t.transfer, cek: t.cheque, usdt: t.usdt, btc: t.btc };
  const reliability = personReliability(invoices);
  const reliabilityInfo = reliability === 'late' ? { color: BRICK, label: t.reliabilityLate }
    : reliability === 'medium' ? { color: GOLD, label: t.reliabilityMedium }
    : reliability === 'onTime' ? { color: EMERALD, label: t.reliabilityOnTime }
    : null;

  async function viewReceipt(paymentId) {
    const img = await getReceipt(`receipt-${paymentId}`);
    if (img) setReceiptView(img);
  }

  async function viewIdPhoto() {
    const img = await getReceipt(`idphoto-${person.id}`);
    if (img) setReceiptView(img);
  }

  function handlePasswordSuccess() {
    const gate = passwordGate;
    setPasswordGate(null);
    if (gate.type === 'delete') setConfirmDelete(true);
    else if (gate.type === 'edit') onEdit(gate.invoice);
    else if (gate.type === 'delete-payment') setConfirmDeletePayment(gate.payload);
    else if (gate.type === 'early-installment') onPayInstallment(gate.payload.plan, gate.payload.inst);
  }

  return (
    <div className="p-5 screen-enter pb-8">
      <div className="flex items-center justify-between mb-2">
        {person.phone && <div className="text-xs flex items-center gap-1" style={{ color: MUTED }}><Phone size={12} />{person.phone}</div>}
        <button onClick={() => onEditPerson(person)} className="text-xs flex items-center gap-1 px-2 py-1 rounded" style={{ color: INK }}>
          <Pencil size={13} /> {t.editCustomer}
        </button>
        <button onClick={() => setPasswordGate({ type: 'delete' })} className="text-xs flex items-center gap-1 px-2 py-1 rounded" style={{ color: BRICK }}>
          <Trash2 size={13} /> {t.deleteCustomer}
        </button>
      </div>

      {reliabilityInfo && (
        <div className="mb-2">
          <span className="inline-flex items-center gap-1.5 text-[13px] font-semibold px-2.5 py-1 rounded-full" style={{ background: `${reliabilityInfo.color}22`, color: reliabilityInfo.color }}>
            <span className="w-1.5 h-1.5 rounded-full" style={{ background: reliabilityInfo.color }} />
            {reliabilityInfo.label}
          </span>
        </div>
      )}

      {person.address && (
        <div className="text-xs flex items-start gap-1 mb-2" style={{ color: MUTED }}>
          <MapPin size={12} className="mt-0.5 shrink-0" />
          <span>{person.address}</span>
        </div>
      )}
      {person.plate && (
        <div className="text-xs flex items-center gap-1 mb-2" style={{ color: MUTED }}>
          <span className="font-num font-semibold px-1.5 py-0.5 rounded" style={{ border: `1px solid ${BORDER}`, color: INK }}>{person.plate}</span>
        </div>
      )}

      <div className="flex gap-2 mb-4">
        {person.hasIdPhoto ? (
          <button onClick={viewIdPhoto} className="flex items-center gap-1 text-[13px] px-2.5 py-1.5 rounded-md font-medium" style={{ background: PAPER, color: INK, border: `1px solid ${BORDER}` }}>
            <ScanLine size={12} /> {t.idPhotoView}
          </button>
        ) : (
          <label className="flex items-center gap-1 text-[13px] px-2.5 py-1.5 rounded-md font-medium cursor-pointer" style={{ background: PAPER, color: INK, border: `1px solid ${BORDER}` }}>
            <ScanLine size={12} /> {t.idPhotoAdd}
            <input type="file" accept="image/*" capture="environment" className="hidden"
              onChange={e => e.target.files[0] && onSetIdPhoto(person.id, e.target.files[0])} />
          </label>
        )}
        <button onClick={() => onOpenContract(person)} className="flex items-center gap-1 text-[13px] px-2.5 py-1.5 rounded-md font-medium" style={{ background: GOLD, color: '#fff' }}>
          <FileSignature size={12} /> {t.createContract}
        </button>
        <button onClick={() => {
          const hasActivePlan = plans && plans.some(pl => !pl.installments.every(i => i.paid));
          if (hasActivePlan) onPlanBlocked(); else onOpenPlan(person);
        }} className="flex items-center gap-1 text-[13px] px-2.5 py-1.5 rounded-md font-medium" style={{ background: EMERALD, color: '#fff' }}>
          <BarChart3 size={12} /> {t.paymentPlanBtn}
        </button>
        <button onClick={() => window.open(KKTC_MB_URL, '_blank')} className="flex items-center gap-1 text-[13px] px-2.5 py-1.5 rounded-md font-medium" style={{ background: PAPER, color: INK, border: `1px solid ${BORDER}` }}>
          <BarChart3 size={12} /> {t.kktcMbBtn}
        </button>
      </div>

      {passwordGate && (
        <PasswordGate
          title={passwordGate.type === 'edit' ? t.passwordTitleEdit : passwordGate.type === 'early-installment' ? t.earlyInstallmentTitle : t.passwordTitleDelete}
          description={passwordGate.type === 'early-installment' ? t.earlyInstallmentDesc : undefined}
          onCheck={checkPassword}
          onSuccess={handlePasswordSuccess}
          onCancel={() => setPasswordGate(null)}
          t={t}
        />
      )}

      {confirmDelete && (
        <TwoStepConfirm
          danger
          message1={t.deleteCustomerConfirm1(person.name)}
          message2={t.deleteCustomerConfirm2}
          onConfirm={() => { setConfirmDelete(false); onDeletePerson(); }}
          onCancel={() => setConfirmDelete(false)}
          t={t}
        />
      )}

      {confirmDeletePayment && (
        <TwoStepConfirm
          danger
          message1={t.deletePaymentConfirm1(formatMoney(confirmDeletePayment.amount, confirmDeletePayment.currency))}
          message2={t.deletePaymentConfirm2}
          onConfirm={() => { onDeletePayment(confirmDeletePayment.invoiceId, confirmDeletePayment.paymentId); setConfirmDeletePayment(null); }}
          onCancel={() => setConfirmDeletePayment(null)}
          t={t}
        />
      )}

      {confirmDeleteServiceRecord && (
        <TwoStepConfirm
          danger
          message1={t.deleteServiceRecordConfirm1}
          message2={t.deleteServiceRecordConfirm2}
          onConfirm={() => { onDeleteServiceRecord(confirmDeleteServiceRecord.id); setConfirmDeleteServiceRecord(null); }}
          onCancel={() => setConfirmDeleteServiceRecord(null)}
          t={t}
        />
      )}

      {hasUnpaid && person.phone && (
        <div className="mb-5">
          <div className="flex gap-1.5 mb-2">
            {['tr', 'en', 'ru'].map(dl => (
              <button key={dl} onClick={() => onChangeDocLang(dl)}
                className="flex-1 py-1.5 rounded-lg text-[12px] font-semibold" style={{ background: docLang === dl ? INK : CARD, color: docLang === dl ? PAPER : MUTED, border: `1px solid ${docLang === dl ? INK : BORDER}` }}>
                {{ tr: 'TR', en: 'EN', ru: 'RU' }[dl]}
              </button>
            ))}
          </div>
          <button onClick={() => onSendDebtReminder(invoices)}
            className="w-full flex items-center justify-center gap-2 py-3 rounded-lg text-sm font-medium"
            style={{ background: INK, color: PAPER, borderTop: `2px solid ${GOLD}` }}>
            <Bell size={15} /> {t.debtReminderBtn} — {formatCurrencySums(unpaidSums)}
          </button>
          <div className="flex gap-2 mt-2">
            <button onClick={() => onSendDebtReminderSMS(invoices)}
              className="flex-1 text-[12px] font-medium py-2 rounded-lg" style={{ background: CARD, color: INK, border: `1px solid ${BORDER}` }}>
              {t.sendViaSms}
            </button>
            {person.email && (
              <button onClick={() => onSendDebtReminderEmail(invoices)}
                className="flex-1 text-[12px] font-medium py-2 rounded-lg" style={{ background: CARD, color: INK, border: `1px solid ${BORDER}` }}>
                {t.sendViaEmail}
              </button>
            )}
          </div>
          <p className="text-[11px] mt-1.5" style={{ color: MUTED }}>{t.smsEmailFileNote}</p>
        </div>
      )}

      {person.phone && (
        <button onClick={() => onOpenCustomerView(person)}
          className="w-full flex items-center justify-center gap-2 mb-5 py-2.5 rounded-lg text-sm font-medium"
          style={{ background: '#25D366', color: '#fff' }}>
          <Send size={14} /> {t.customerViewBtn}
        </button>
      )}

      {contracts && contracts.length > 0 && (
        <div className="rounded-xl p-4 mb-4" style={{ background: CARD, border: `1px solid ${BORDER}` }}>
          <div className="text-[12px] tracking-[0.15em] font-semibold uppercase mb-2" style={{ color: MUTED }}>{t.contractsHeader}</div>
          <div className="space-y-2">
            {contracts.map(c => (
              <div key={c.id} className="text-[13px]" style={{ color: INK }}>
                <div className="flex items-center justify-between">
                  <span>{c.date} — {formatCurrencySums(c.debtSummary)}{c.createdBy && ` (${c.createdBy})`}</span>
                  <button onClick={() => onDownloadContract(c)} className="underline" style={{ color: MUTED }}>{t.downloadPdf}</button>
                </div>
                {c.extraNote && <div className="italic mt-0.5" style={{ color: MUTED }}>{c.extraNote}</div>}
              </div>
            ))}
          </div>
        </div>
      )}

      {plans && plans.length > 0 && (
        <div className="rounded-xl p-4 mb-4" style={{ background: CARD, border: `1px solid ${BORDER}` }}>
          <button onClick={() => setPlansExpanded(!plansExpanded)} className="w-full flex items-center justify-between">
            <span className="text-[12px] tracking-[0.15em] font-semibold uppercase" style={{ color: MUTED }}>{t.paymentPlansHeader}</span>
            <ChevronLeft size={16} style={{ color: MUTED, transform: plansExpanded ? 'rotate(90deg)' : 'rotate(-90deg)', transition: 'transform 0.15s' }} />

          {plansExpanded && (
          <div className="space-y-4 mt-2">
            {plans.map(plan => {
              const allPaid = plan.installments.every(i => i.paid);

              const planAccent = allPaid ? EMERALD : hasOverdue ? BRICK : BORDER;

                <div key={plan.id} className="rounded-lg p-3" style={{ background: PAPER, borderLeft: `3px solid ${planAccent}` }}>

                    {plan.createdAt} — {formatMoney(plan.totalAmount, plan.currency)} / {plan.installmentCount} {plan.createdBy && `(${plan.createdBy})`}

                  {allPaid && (
                    <div className="text-[13px] mb-1.5 font-medium" style={{ color: EMERALD }}>{t.planFullyPaid}</div>

                          <span style={{ color: MUTED }}> · {t.dueDateLabel}: {inst.dueDate}</span>
                        </span>
                        {inst.paid ? (
                          <span className="text-[12px] font-semibold px-2 py-0.5 rounded-full badge-paid">{t.installmentPaidBadge}</span>

                              {t.markInstallmentPaid}
                            </button>
                          </div>
                        )}
                      </div>
                      );
                    })}

      {receiptView && (

  );

function AddInvoiceModal({ onClose, onAdd, person, t }) {
  const [desc, setDesc] = useState('');
  const [amount, setAmount] = useState('');
  const [currency, setCurrency] = useState('TRY');
  const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
  const [note, setNote] = useState('');
  const [address, setAddress] = useState(person.address || '');
  const [items, setItems] = useState([{ id: uid(), desc: '', qty: '1', unitPrice: '' }]);
  const [saving, setSaving] = useState(false);

  const usingItems = items.length > 0;
  const itemsTotal = items.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.unitPrice) || 0), 0);
  const effectiveAmount = usingItems ? String(itemsTotal) : amount;

  function addItemRow() {
    setItems([...items, { id: uid(), desc: '', qty: '1', unitPrice: '' }]);
  }
  function updateItem(id, field, value) {
    setItems(items.map(it => it.id === id ? { ...it, [field]: value } : it));
  }
  function removeItem(id) {
    setItems(items.filter(it => it.id !== id));
  }

  async function submit() {
    setSaving(true);
    await onAdd(desc, effectiveAmount.replace(',', '.'), date, note, currency, items, address);
    setSaving(false);
  }

  return (
    <Modal onClose={onClose} title={t.addInvoiceTitle}>
      <label className="text-xs font-medium" style={{ color: INK }}>{t.description}</label>
      <textarea autoFocus value={desc} onChange={e => setDesc(e.target.value)} rows={3}
        className="w-full rounded-lg px-3 py-2.5 mb-3 mt-1 text-sm resize-y" style={{ border: `1px solid ${BORDER}` }} placeholder={t.descPh} />

      <label className="text-xs font-medium" style={{ color: INK }}>{t.addressOptional}</label>

function EditInvoiceModal({ invoice, onClose, onSave, t }) {
  const [desc, setDesc] = useState(invoice.desc);
  const [amount, setAmount] = useState(String(invoice.amount));
  const [currency, setCurrency] = useState(invoice.currency || 'TRY');
  const [date, setDate] = useState(invoice.date);
  const [note, setNote] = useState(invoice.note || '');
  const [items, setItems] = useState(invoice.items || []);

  const usingItems = items.length > 0;
  const itemsTotal = items.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.unitPrice) || 0), 0);

  function addItemRow() {
    setItems([...items, { id: uid(), desc: '', qty: '1', unitPrice: '' }]);

  function updateItem(id, field, value) {
    setItems(items.map(it => it.id === id ? { ...it, [field]: value } : it));

    setItems(items.filter(it => it.id !== id));

  return (
    <Modal onClose={onClose} title={t.editInvoiceTitle}>

      <label className="text-xs font-medium" style={{ color: INK }}>{t.lineItemsOptional}</label>
      <p className="text-[13px] mb-2 mt-0.5" style={{ color: MUTED }}>{t.lineItemsDesc}</p>
      {items.map(it => (
        <div key={it.id} className="flex gap-1.5 mb-2 items-center">
          <input value={it.desc} onChange={e => updateItem(it.id, 'desc', e.target.value)}
            placeholder={t.itemDescPh} className="flex-[2] min-w-0 rounded-lg px-2 py-2 text-xs" style={{ border: `1px solid ${BORDER}` }} />
          <input value={it.qty} onChange={e => updateItem(it.id, 'qty', e.target.value.replace(/[^\d.,]/g, ''))}

          <input value={it.unitPrice} onChange={e => updateItem(it.id, 'unitPrice', e.target.value.replace(/[^\d.,]/g, ''))}
            placeholder={t.itemUnitPrice} className="w-16 rounded-lg px-2 py-2 text-xs font-num" style={{ border: `1px solid ${BORDER}` }} />

      <label className="text-xs font-medium" style={{ color: INK }}>{usingItems ? t.computedTotal : t.amountAndCurrency}</label>
      <div className="flex gap-2 mt-1 mb-3">

          onChange={e => !usingItems && setAmount(e.target.value.replace(/[^\d.,]/g, ''))}

          className="flex-1 rounded-lg px-3 py-2.5 text-sm font-num" style={{ border: `1px solid ${BORDER}`, background: usingItems ? BORDER : CARD }} />
        <select value={currency} onChange={e => setCurrency(e.target.value)}
          className="rounded-lg px-2 py-2.5 text-sm" style={{ border: `1px solid ${BORDER}` }}>
          {CURRENCIES.map(c => <option key={c} value={c}>{c}</option>)}

      </div>
      <label className="text-xs font-medium" style={{ color: INK }}>{t.dateLabel}</label>
      <input type="date" value={date} onChange={e => setDate(e.target.value)}

      <p className="text-sm font-semibold mb-4" style={{ color: GOLD }}>{t.correctionWillShow(new Date().toLocaleDateString('tr-TR'))}</p>
      <button onClick={() => onSave(desc, effectiveAmount.replace(',', '.'), date, note, currency, items)} disabled={!desc.trim() || !effectiveAmount}
        className="w-full py-3 rounded-lg font-medium text-sm disabled:opacity-40" style={{ background: GOLD, color: '#fff' }}>
        {t.saveCorrection}

function PayModal({ invoice, remainingAmount: remaining, onClose, onConfirm, t }) {
  const [method, setMethod] = useState('nakit');
  const [amount, setAmount] = useState(String(remaining));
  const [file, setFile] = useState(null);
  const [preview, setPreview] = useState(null);
  const [saving, setSaving] = useState(false);
  const [confirmStep, setConfirmStep] = useState(false);

  function handleFile(f) {
    setFile(f);
    setPreview(URL.createObjectURL(f));
  }

  const numericAmount = Number((amount || '0').replace(',', '.'));
  const isValid = numericAmount > 0;

  async function confirm() {
    setSaving(true);
    await onConfirm(invoice.id, amount.replace(',', '.'), method, file);
    setSaving(false);
  }

  const methodLabel = { nakit: t.cash, kart: t.card, dekont: t.transfer, cek: t.cheque, usdt: t.usdt, btc: t.btc }[method];

  return (
    <Modal onClose={onClose} title={t.payTitle(formatMoney(remaining, invoice.currency))}>
      <label className="text-xs font-medium" style={{ color: INK }}>{t.amountPaid} ({invoice.currency || 'TRY'})</label>
      <input value={amount} onChange={e => setAmount(e.target.value.replace(/[^\d.,]/g, ''))}
        className="w-full rounded-lg px-3 py-2.5 mb-1 mt-1 text-sm font-num" style={{ border: `1px solid ${BORDER}` }} placeholder="0.00" />
      {numericAmount > 0 && numericAmount < remaining && (
        <p className="text-sm font-semibold mb-3" style={{ color: GOLD }}>{t.partialNote(formatMoney(remaining - numericAmount, invoice.currency))}</p>
      )}
      {numericAmount > remaining && (
        <p className="text-[13px] mb-3" style={{ color: MUTED }}>{t.overpayNote(formatMoney(remaining, invoice.currency))}</p>
      )}
      {!(numericAmount > 0 && numericAmount < remaining) && !(numericAmount > remaining) && <div className="mb-3" />}

      <label className="text-xs font-medium" style={{ color: INK }}>{t.paymentMethod}</label>
      <div className="grid grid-cols-3 gap-2 mt-1 mb-4">
        {[
          { k: 'nakit', l: t.cash, Icon: Wallet, iconColor: null },
          { k: 'kart', l: t.card, Icon: CreditCard, iconColor: null },
          { k: 'dekont', l: t.transfer, Icon: FileText, iconColor: null },
          { k: 'cek', l: t.cheque, Icon: FileSignature, iconColor: '#D4A017' },
          { k: 'usdt', l: t.usdt, Icon: Coins, iconColor: '#16A34A' },
          { k: 'btc', l: t.btc, Icon: Bitcoin, iconColor: '#D4A017' },
        ].map(({ k, l, Icon, iconColor }) => (
          <button key={k} onClick={() => setMethod(k)}
            className="flex flex-col items-center gap-1 rounded-lg py-2.5 text-xs"
            style={{ background: method === k ? INK : CARD, color: method === k ? PAPER : INK, border: `1px solid ${method === k ? INK : BORDER}` }}>
            <Icon size={16} style={iconColor ? { color: iconColor } : undefined} /> {l}
          </button>
        ))}
      </div>

      <label className="text-xs font-medium" style={{ color: INK }}>{t.receiptPhotoOptional}</label>
      <div className="mt-1 mb-4">
        {preview ? (
          <div className="relative inline-block">
            <img src={preview} className="h-28 rounded-lg" style={{ border: `1px solid ${BORDER}` }} alt="" />
            <button onClick={() => { setFile(null); setPreview(null); }}
              className="absolute -top-2 -right-2 bg-white rounded-full p-0.5" style={{ border: `1px solid ${BORDER}` }}>
              <X size={12} />
            </button>
          </div>
        ) : (
          <label className="flex items-center gap-2 rounded-lg px-3 py-3 text-xs cursor-pointer" style={{ border: `1.5px dashed ${MUTED}`, color: MUTED }}>
            <Camera size={16} /> {t.receiptCapture}
            <input type="file" accept="image/*" capture="environment" className="hidden"
              onChange={e => e.target.files[0] && handleFile(e.target.files[0])} />
          </label>
        )}
      </div>

      <button onClick={() => setConfirmStep(true)} disabled={saving || !isValid}
        className="w-full py-3 rounded-lg font-medium text-sm disabled:opacity-50" style={{ background: EMERALD, color: '#fff' }}>
        {saving ? t.saving : t.markPaid}
      </button>

      {confirmStep && (
        <TwoStepConfirm
          message1={t.paymentConfirm1(formatMoney(numericAmount, invoice.currency), methodLabel)}
          message2={t.paymentConfirm2}
          onConfirm={() => { setConfirmStep(false); confirm(); }}
          onCancel={() => setConfirmStep(false)}
          t={t}
        />
      )}
    </Modal>
  );
}

          <button onClick={() => onChangeLanguage('en')} className="text-[12px] px-2 py-1 rounded font-medium" style={{ background: lang === 'en' ? INK : 'transparent', color: lang === 'en' ? PAPER : MUTED }}>EN</button>

        </div>
        <h3 className="font-display text-base mb-1 text-center" style={{ color: INK }}>{t.licenseTitle}</h3>
        <p className="text-xs text-center mb-4" style={{ color: MUTED }}>{t.licenseDesc}</p>

        <label className="text-xs font-medium" style={{ color: INK }}>{t.deviceLabelOptional}</label>
        <input value={label} onChange={e => setLabel(e.target.value)}
          placeholder={t.deviceLabelPh}
          className="w-full rounded-lg px-3 py-2.5 mb-3 mt-1 text-sm" style={{ border: `1px solid ${BORDER}` }} />

          {t.activate}
        </button>
      </div>

  );
}

function LockScreen({ passSet, onCreate, onUnlock, lang, onChangeLanguage, biometricEnabled, onBiometricUnlock, t }) {
  const [pass, setPass] = useState('');
  const [confirm, setConfirm] = useState('');
  const [input, setInput] = useState('');
  const [err, setErr] = useState('');
  const [resetMode, setResetMode] = useState(false);
  const [confirmingReset, setConfirmingReset] = useState(false);

  function submitCreate() {
    if (pass.length < 4) { setErr(t.passwordTooShort); return; }
    if (pass !== confirm) { setErr(t.passwordsMismatch); return; }
    onCreate(pass);
  }

  function submitUnlock() {
    const ok = onUnlock(input);
    if (!ok) setErr(t.wrongPassword);
  }

  return (
    <div className="min-h-screen flex items-center justify-center font-body p-6" style={{ background: INK }}>
      <style>{FONT_STYLE}</style>
      <div className="w-full rounded-2xl p-6" style={{ background: CARD, maxWidth: 360, border: `1px solid ${BORDER}`, borderTop: `3px solid ${GOLD}` }}>
        <div className="flex justify-end gap-1 mb-2">
          <button onClick={() => onChangeLanguage('tr')} className="text-[12px] px-2 py-1 rounded font-medium" style={{ background: lang === 'tr' ? INK : 'transparent', color: lang === 'tr' ? PAPER : MUTED }}>TR</button>
          <button onClick={() => onChangeLanguage('en')} className="text-[12px] px-2 py-1 rounded font-medium" style={{ background: lang === 'en' ? INK : 'transparent', color: lang === 'en' ? PAPER : MUTED }}>EN</button>
        </div>
        <div className="text-center mb-5">
          <img src={LOGO_DATA_URI} alt={t.appName} className="mx-auto mb-2" style={{ height: 44, width: 44 * LOGO_ASPECT }} />
          <div className="text-[12px] tracking-[0.15em] uppercase" style={{ color: MUTED }}>{t.appSubtitle}</div>
        </div>

        {(!passSet || resetMode) ? (
          <>
            <p className="text-xs text-center mb-4" style={{ color: MUTED }}>
              {resetMode ? t.resetPrompt : t.firstUse}
            </p>
            <input type="password" value={pass} onChange={e => { setPass(e.target.value); setErr(''); }} placeholder={t.newPassword} autoFocus
              className="w-full rounded-lg px-3 py-2.5 mb-3 text-sm" style={{ border: `1px solid ${BORDER}` }} />
            <input type="password" value={confirm} onChange={e => { setConfirm(e.target.value); setErr(''); }} placeholder={t.newPasswordAgain}
              onKeyDown={e => e.key === 'Enter' && submitCreate()}
              className="w-full rounded-lg px-3 py-2.5 mb-3 text-sm" style={{ border: `1px solid ${BORDER}` }} />
            {err && <p className="text-xs mb-3" style={{ color: BRICK }}>{err}</p>}
            <button onClick={submitCreate} className="w-full py-3 rounded-lg font-medium text-sm" style={{ background: INK, color: PAPER }}>
              {resetMode ? t.saveNewAndUnlock : t.createAndUnlock}
            </button>
            {resetMode && (
              <button onClick={() => { setResetMode(false); setConfirmingReset(false); setErr(''); }} className="w-full mt-2 text-xs" style={{ color: MUTED }}>
                {t.rememberedPassword}
              </button>
            )}
          </>
        ) : (
          <>
            <p className="text-xs text-center mb-4" style={{ color: MUTED }}>{t.enterToContinue}</p>
            {biometricEnabled && (
              <button onClick={onBiometricUnlock} className="w-full flex items-center justify-center gap-2 py-3 rounded-lg text-sm font-medium mb-3" style={{ background: EMERALD, color: '#fff' }}>
                <ScanLine size={16} /> {t.biometricLoginBtn}
              </button>
            )}
            <input type="password" value={input} onChange={e => { setInput(e.target.value); setErr(''); }} placeholder={t.password} autoFocus
              onKeyDown={e => e.key === 'Enter' && submitUnlock()}
              className="w-full rounded-lg px-3 py-2.5 mb-3 text-sm" style={{ border: `1px solid ${BORDER}` }} />
            {err && <p className="text-xs mb-3" style={{ color: BRICK }}>{err}</p>}
            <button onClick={submitUnlock} className="w-full py-3 rounded-lg font-medium text-sm" style={{ background: INK, color: PAPER }}>
              {t.unlock}
            </button>

            {!confirmingReset ? (
              <button onClick={() => setConfirmingReset(true)} className="w-full mt-3 text-xs underline" style={{ color: MUTED }}>
                {t.forgotPassword}
              </button>
            ) : (
              <div className="mt-3 p-3 rounded-lg" style={{ background: 'rgba(155,58,46,0.08)' }}>
                <p className="text-xs mb-2" style={{ color: BRICK }}>{t.resetWarning}</p>
                <div className="flex gap-2">
                  <button onClick={() => setConfirmingReset(false)} className="flex-1 py-2 rounded-lg text-xs font-medium" style={{ border: `1px solid ${BORDER}`, color: INK }}>{t.cancel}</button>
                  <button onClick={() => { setResetMode(true); setConfirmingReset(false); setErr(''); }} className="flex-1 py-2 rounded-lg text-xs font-medium" style={{ background: BRICK, color: '#fff' }}>{t.yesReset}</button>
                </div>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

function TwoStepConfirm({ message1, message2, onConfirm, onCancel, danger, t }) {
  const [step, setStep] = useState(1);
  const accent = danger ? BRICK : EMERALD;
  const tt = t || TRANSLATIONS.tr;
  return (
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-6" onClick={onCancel}>
      <div className="sheet-enter rounded-2xl p-5 w-full" style={{ background: CARD, maxWidth: 340, border: `1px solid ${BORDER}`, borderTop: `3px solid ${accent}` }} onClick={e => e.stopPropagation()}>
        <div className="text-[12px] tracking-[0.15em] uppercase font-semibold mb-2" style={{ color: MUTED }}>
          {tt.step} {step} / 2
        </div>
        <p className="text-sm mb-5" style={{ color: INK }}>{step === 1 ? message1 : message2}</p>
        <div className="flex gap-2">
          <button onClick={onCancel} className="flex-1 py-2.5 rounded-lg text-sm font-medium" style={{ border: `1px solid ${BORDER}`, color: INK }}>
            {tt.cancel}
          </button>
          <button onClick={() => (step === 1 ? setStep(2) : onConfirm())}
            className="flex-1 py-2.5 rounded-lg text-sm font-medium" style={{ background: accent, color: '#fff' }}>
            {step === 1 ? tt.yes : tt.confirm}
          </button>
        </div>
      </div>
    </div>
  );
}

function PasswordGate({ title, description, onCheck, onSuccess, onCancel, t }) {
  const [pass, setPass] = useState('');
  const [err, setErr] = useState('');
  const tt = t || TRANSLATIONS.tr;

  function submit() {
    if (onCheck(pass)) {
      onSuccess();
    } else {
      setErr(tt.wrongPassword);
    }
  }

  return (
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-6" onClick={onCancel}>
      <div className="sheet-enter rounded-2xl p-5 w-full" style={{ background: CARD, maxWidth: 340, border: `1px solid ${BORDER}`, borderTop: `3px solid ${GOLD}` }} onClick={e => e.stopPropagation()}>
        <h3 className="font-display text-base mb-1" style={{ color: INK }}>{title}</h3>
        <p className="text-xs mb-4" style={{ color: MUTED }}>{description || tt.passwordPrompt}</p>
        <input type="password" value={pass} autoFocus
          onChange={e => { setPass(e.target.value); setErr(''); }}
          onKeyDown={e => e.key === 'Enter' && submit()}
          placeholder={tt.password}
          className="w-full rounded-lg px-3 py-2.5 mb-3 text-sm" style={{ border: `1px solid ${BORDER}` }} />
        {err && <p className="text-xs mb-3" style={{ color: BRICK }}>{err}</p>}
        <div className="flex gap-2">
          <button onClick={onCancel} className="flex-1 py-2.5 rounded-lg text-sm font-medium" style={{ border: `1px solid ${BORDER}`, color: INK }}>

  const [oldPass, setOldPass] = useState('');
  const [newPass, setNewPass] = useState('');
  const [confirmPass, setConfirmPass] = useState('');
  const [err, setErr] = useState('');
