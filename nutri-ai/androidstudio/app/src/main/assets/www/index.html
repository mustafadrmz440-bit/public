        });
      }

      paintCatalog();
    }
  });
}


/* ===== js/views/plan.js ===== */
/* views/plan.js — Haftalık kişisel beslenme programı */




let plan = null;
let selDate = todayStr();
let adding = new Set();

async function render_plan(root) {
  await load();
  paint_plan(root);
}

async function load(refresh = false) {
  plan = await api(`/api/plan?date=${todayStr()}${refresh ? '&refresh=1' : ''}`);
  const t = todayStr();
  selDate = plan.days.find((d) => d.date === t) ? t : plan.days[0].date;
}

function paint_plan(root) {
  const targets = state.user.targets;
  const day = plan.days.find((d) => d.date === selDate);
  const totalKcal = day.meals.reduce((a, m) => a + m.kcal, 0);

  root.innerHTML = `
  <div class="view">
    <header class="view-head">
      <div>
        <h1>Haftalık Programın</h1>
        <p class="muted">${fmtDateShort(plan.weekKey)} – ${fmtDateShort(plan.days[6].date)} · Hedefin: ${targets.kcal} kcal/gün</p>
      </div>
      <div class="head-actions">
        <span class="ai-badge">${icon('sparkles', 16)} AI ile kişiselleştirildi</span>
        <button class="btn btn-ghost" id="plan-refresh">${icon('refresh', 17)} Yeni Varyasyon</button>
      </div>
    </header>

    <div class="day-tabs">
      ${plan.days.map((d) => `
        <button class="day-tab ${d.date === selDate ? 'active' : ''} ${d.date === todayStr() ? 'today' : ''}" data-date="${d.date}">
          <span>${dayShort(d.date)}</span><b>${fmtDateShort(d.date)}</b>
        </button>`).join('')}
    </div>

    <div class="card plan-day-summary">
      <div>
        <b>${fmtDateLong(selDate)}</b>
        <span class="muted"> — planlanan toplam ${totalKcal} kcal</span>
      </div>
      <div class="plan-balance ${Math.abs(totalKcal - targets.kcal) <= targets.kcal * 0.1 ? 'ok' : ''}">
        ${Math.abs(totalKcal - targets.kcal) <= targets.kcal * 0.1 ? icon('check', 16) + ' Hedefe uygun' : `${totalKcal > targets.kcal ? '+' : ''}${totalKcal - targets.kcal} kcal sapma`}
      </div>
    </div>

    <div class="plan-meals">
      ${MEAL_ORDER.map((slot) => {
        const m = day.meals.find((x) => x.slot === slot);
        if (!m) return '';
        const key = selDate + slot;
        return `
        <div class="card plan-meal">
          <img class="plan-img" src="${m.recipe.img}" alt="${esc(m.recipe.name)}" loading="lazy"/>
          <div class="plan-body">
            <div class="plan-slot">${MEALS[slot].label}</div>
            <h3 class="plan-name">${esc(m.recipe.name)}</h3>
            <div class="plan-meta">
              <span>${icon('flame', 14)} ${m.kcal} kcal</span>
              <span>${icon('clock', 14)} ${m.recipe.time} dk</span>
              <span class="chip">${m.servings} porsiyon</span>
            </div>
          </div>
          <div class="plan-actions">
            <button class="btn btn-sm btn-ghost plan-detail" data-rid="${m.recipe.id}">${icon('book', 15)} Tarif</button>
            <button class="btn btn-sm btn-primary plan-eat" data-slot="${slot}" data-i="${plan.days.indexOf(day)}" ${adding.has(key) ? 'disabled' : ''}>${icon('check', 15)} Yedim</button>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;

  root.querySelectorAll('.day-tab').forEach((b) => b.addEventListener('click', () => { selDate = b.dataset.date; paint_plan(root); }));

  root.querySelector('#plan-refresh').addEventListener('click', () => confirmModal({
    title: 'Yeni program varyasyonu',
    text: 'Yapay zekâ bu hafta için farklı yemek kombinasyonlarından oluşan yeni bir plan oluşturacak. Mevcut plan değişecek, devam edilsin mi?',
    confirmText: 'Planı Yenile',
    onConfirm: async () => { await load(true); paint_plan(root); toast('Yeni program hazır! ✨', 'ok'); }
  }));

  root.querySelectorAll('.plan-detail').forEach((b) => b.addEventListener('click', () => {
    const r = state.recipes.find((x) => x.id === b.dataset.rid);
    openRecipeModal(r, async (recipe, slot) => {
      await api('/api/diary', {
        method: 'POST',
        body: { date: selDate, meal: slot, name: recipe.name, kcal: recipe.kcal, protein: recipe.protein, carbs: recipe.carbs, fat: recipe.fat, source: 'tarif' }
      });
      toast(`${recipe.name}, ${MEALS[slot].label.toLowerCase()} öğününe eklendi`, 'ok');
    });
  }));

  root.querySelectorAll('.plan-eat').forEach((b) => b.addEventListener('click', async () => {
    const slot = b.dataset.slot;
    const d = plan.days[Number(b.dataset.i)];
    const m = d.meals.find((x) => x.slot === slot);
    const key = d.date + slot;
    adding.add(key);
    b.disabled = true;
    try {
      await api('/api/diary', {
        method: 'POST',
        body: {
          date: d.date, meal: slot, name: m.recipe.name, kcal: m.kcal,
          protein: Math.round(m.recipe.protein * m.servings),
          carbs: Math.round(m.recipe.carbs * m.servings),
          fat: Math.round(m.recipe.fat * m.servings),
          source: 'plan'
        }
      });
      toast(`${m.recipe.name} ${d.date === todayStr() ? 'bugünün' : 'günün'} ${MEALS[slot].label.toLowerCase()} öğününe eklendi`, 'ok');
    } finally {
      adding.delete(key);
      b.disabled = false;
    }
  }));
}


/* ===== js/views/recipes.js ===== */
/* views/recipes.js — Tarif kataloğu + detay modalı */



let filter = 'Tümü';
let q = '';

const FILTERS = ['Tümü', 'Kahvaltı', 'Öğle', 'Akşam', 'Ara Öğün', 'Vegan', 'Yüksek Protein', 'Glutensiz'];

function matchSlot(r, filter) {
  switch (filter) {
    case 'Tümü': return true;
    case 'Kahvaltı': return r.slots.includes('kahvalti');
    case 'Öğle': return r.slots.includes('oglen');
    case 'Akşam': return r.slots.includes('aksam');
    case 'Ara Öğün': return r.slots.includes('ara');
    case 'Vegan': return r.tags.includes('vegan');
    case 'Yüksek Protein': return r.tags.includes('yuksek-protein');
    case 'Glutensiz': return r.tags.includes('glutensiz');
    default: return true;
  }
}

function render_recipes(root) {
  root.innerHTML = `
  <div class="view">
    <header class="view-head">
      <div>
        <h1>Tarifler</h1>
        <p class="muted">Diyetisyen onaylı, kalori kontrollü ${state.recipes.length} tarif</p>
      </div>
    </header>

    <div class="search-row recipes-search">
      <div class="search-box">${icon('search', 17)}<input id="rec-q" placeholder="Tarif ara… (menemen, somon, yulaf)" value="${esc(q)}"/></div>
    </div>
    <div class="chip-row" id="rec-chips">
      ${FILTERS.map((f) => `<button class="chip ${filter === f ? 'active' : ''}" data-f="${esc(f)}">${esc(f)}</button>`).join('')}
    </div>

    <div class="recipe-grid" id="rec-grid"></div>
  </div>`;

  const grid = root.querySelector('#rec-grid');

  function paintGrid() {
    const list = state.recipes.filter((r) =>
      matchSlot(r, filter) && (!q || r.name.toLowerCase().includes(q) || r.desc.toLowerCase().includes(q) || r.tags.some((t) => t.includes(q)))
    );
    grid.innerHTML = list.map((r) => `
      <article class="recipe-card" data-id="${r.id}">
        <div class="recipe-img-wrap">
          <img src="${r.img}" alt="${esc(r.name)}" loading="lazy"/>
          <span class="recipe-kcal">${r.kcal} kcal</span>
        </div>
        <div class="recipe-body">
          <h3>${esc(r.name)}</h3>
          <p class="muted clamp2">${esc(r.desc)}</p>
          <div class="recipe-meta">
            <span>${icon('clock', 14)} ${r.time} dk</span>
            <span>${icon('flame', 14)} P ${r.protein}g · K ${r.carbs}g · Y ${r.fat}g</span>
          </div>
          <div class="tag-row">
            ${r.slots.map((s) => `<span class="tag">${MEALS[s].label}</span>`).join('')}
            ${r.tags.slice(0, 2).map((t) => `<span class="tag alt">${({ 'vegan': 'Vegan', 'vejetaryen': 'Vejetaryen', 'yuksek-protein': 'Yüksek Protein', 'glutensiz': 'Glutensiz', 'pratik': 'Pratik', 'lifli': 'Lifli', 'dusuk-kalori': 'Düşük Kalori', 'dusuk-karb': 'Düşük Karb.' })[t] || t}</span>`).join('')}
          </div>
        </div>
      </article>`).join('') || emptyState('🍳', 'Tarif bulunamadı', 'Arama veya filtreyi değiştirerek tekrar dene.');

    grid.querySelectorAll('.recipe-card').forEach((c) => c.addEventListener('click', () => {
      const r = state.recipes.find((x) => x.id === c.dataset.id);
      openRecipeModal(r, addToDiary);
    }));
  }

  async function addToDiary(recipe, slot) {
    await api('/api/diary', {
      method: 'POST',
      body: { date: todayStr(), meal: slot, name: recipe.name, kcal: recipe.kcal, protein: recipe.protein, carbs: recipe.carbs, fat: recipe.fat, source: 'tarif' }
    });
    toast(`${recipe.name} bugünün ${MEALS[slot].label.toLowerCase()} öğününe eklendi`, 'ok');
  }

  root.querySelector('#rec-q').addEventListener('input', (e) => { q = e.target.value.toLowerCase(); paintGrid(); });
  root.querySelectorAll('#rec-chips .chip').forEach((c) => c.addEventListener('click', () => {
    filter = c.dataset.f;
    root.querySelectorAll('#rec-chips .chip').forEach((x) => x.classList.toggle('active', x === c));
    paintGrid();
  }));

  paintGrid();
}

/* ===== js/views/scan.js ===== */
/* views/scan.js — AI kamera yemek tarama ekranı */





let result = null;      // aktif analiz sonucu
let shotURL = null;     // yakalanan karenin önizlemesi
let portion = 1;
let slot = guessSlot();
let analyzing = false;
let modelState = 'idle'; // idle | loading | ready | error

function guessSlot() {
  const hh = new Date().getHours();
  if (hh < 11) return 'kahvalti';
  if (hh < 16) return 'oglen';
  if (hh < 18.5) return 'ara';
  return 'aksam';
}

window.addEventListener('hashchange', () => {
  if (!location.hash.includes('/tara')) stopCamera();
});

async function render_scan(root, { query }) {
  const qd = query.get('date');
  if (qd && qd !== todayStr()) slot = guessSlot();
  paint_scan(root);
  ensureModel().then(() => { modelState = 'ready'; }).catch(() => { modelState = 'error'; });
}

function paint_scan(root) {
  root.innerHTML = `
  <div class="view">
    <header class="view-head">
      <div>
        <h1>AI Yemek Tarama</h1>
        <p class="muted">Yemeğinin fotoğrafını çek — kalori ve makrolarını yapay zekâ anında hesaplar.</p>
      </div>
      <div class="head-actions">
        <span class="privacy-chip">${icon('check', 15)} Fotoğraflar cihazdan çıkmaz</span>
      </div>
    </header>

    <div class="scan-grid">
      <div class="card scan-cam-card">
        <div class="cam-wrap" id="cam-wrap">
          <video id="cam" autoplay playsinline muted class="${result ? 'hidden' : ''}"></video>
          ${shotURL ? `<img src="${shotURL}" class="cam-shot" alt="çekilen yemek fotoğrafı"/>` : ''}
          <div class="cam-frame"></div>
          ${analyzing ? `<div class="scanline"></div>` : ''}
          ${!result && !analyzing ? `<div class="cam-hint">Yemeği çerçeveye al ${icon('camera', 15)}</div>` : ''}
          ${analyzing ? `<div class="cam-analyzing">${spinner(26)} <span>Analiz ediliyor…</span></div>` : ''}
        </div>
        <div class="cam-model-state" id="model-state">${
          modelState === 'ready' ? `${icon('sparkles', 15)} Yapay zekâ modeli hazır`
          : modelState === 'error' ? `${icon('info', 15)} Sinir ağı modeli yüklenemedi — hızlı tahmin modu kullanılacak`
          : `${spinner(14)} Yapay zekâ modeli hazırlanıyor…`
        }</div>
        <div class="cam-actions">
          <button class="btn btn-primary btn-lg" id="btn-capture" ${analyzing ? 'disabled' : ''}>${icon('camera', 20)} ${result ? 'Yeniden Çek' : 'Fotoğraf Çek'}</button>
          <label class="btn btn-ghost btn-lg upload-btn" ${analyzing ? 'data-disabled' : ''}>${icon('upload', 18)} Yükle
            <input type="file" id="file-in" accept="image/*" hidden/>
          </label>
        </div>
        <p class="cam-note">${icon('info', 14)} Analiz tarayıcınızda, cihazınızda yapılır. Fotoğraf hiçbir sunucuya gönderilmez.</p>
      </div>

      <div class="card scan-result-card" id="result-pane">${resultPaneHTML()}</div>
    </div>

    ${state.recentScans.length ? `
    <h2 class="section-title">Bu oturumdaki taramalar</h2>
    <div class="scan-history">
      ${state.recentScans.map((s, i) => `
        <button class="scan-thumb ${result === s.ref ? 'active' : ''}" data-i="${i}">
          <img src="${s.thumb}" alt=""/><span>${esc(s.name)}</span>
        </button>`).join('')}
    </div>` : ''}
  </div>`;

  bind(root);
  if (!result && !analyzing) initCamera(root);
}

async function initCamera(root) {
  const video = root.querySelector('#cam');
  try {
    await startCamera(video);
  } catch (e) {
    const wrap = root.querySelector('#cam-wrap');
    if (wrap) wrap.innerHTML = `
      <div class="cam-error">
        ${icon('camera', 34)}
        <b>Kameraya erişilemedi</b>
        <p class="muted">Tarayıcı izinlerini kontrol edin ya da "Yükle" ile fotoğraf seçin. (Kamera için güvenli bağlantı gerekir.)</p>
      </div>`;
  }
}

function resultPaneHTML() {
  if (analyzing) {
    return `
    <div class="scan-waiting">
      ${spinner(30)}
      <b>Yapay zekâ yemeğini inceliyor…</b>
      <div class="wait-steps">
        <span>Görüntü işleniyor</span> ${icon('chevronRight', 13)}
        <span>Yemek tanınıyor</span> ${icon('chevronRight', 13)}
        <span>Makrolar hesaplanıyor</span>
      </div>
    </div>`;
  }
  if (!result) {
    return `
    <div class="scan-empty">
      <div class="scan-empty-ic">${icon('scan', 36)}</div>
      <h3>Sonuç burada görünecek</h3>
      <p class="muted">Fotoğrafı çektiğinde yapay zekâ yemeği tanımlar; kalori, protein, karbonhidrat ve yağ değerlerini porsiyon ayarıyla günlüğüne ekleyebilirsin.</p>
      <div class="scan-tips">
        <div>${icon('check', 15)} Tabak çerçevenin içine tam girsin</div>
        <div>${icon('check', 15)} Mümkünse üstten ve iyi ışıkta çek</div>
        <div>${icon('check', 15)} Tanınmazsa listeden elle seçebilirsin</div>
      </div>
    </div>`;
  }

  const m = result.matched;
  const top = m[0];
  const conf = Math.round(top.prob * 100);
  const alt = m.slice(1, 4);
  const kcal = Math.round(top.food.kcal * portion);
  const uncertain = top.prob < 0.1;

  return `
  <div class="scan-result">
    ${result.engine === 'heuristic' ? `<div class="mode-warn">${icon('info', 15)} Hızlı Tahmin Modu — sinir ağı modeli yüklenemedi. Sonucu doğrulamak için listeyi kullan.</div>` : ''}
    ${uncertain ? `<div class="mode-warn soft">${icon('info', 15)} Emin olamadım — doğru yemeği aşağıdaki adaylardan seçebilirsin.</div>` : ''}
    <div class="sr-head">
      <div class="sr-conf">
        <span class="sr-conf-label">Tanıma güveni</span>
        <div class="sr-conf-bar"><div style="width:${Math.max(6, conf)}%"></div></div>

function bind(root) {
  const captureBtn = root.querySelector('#btn-capture');
  const fileIn = root.querySelector('#file-in');
  if (fileIn) {
    const lbl = fileIn.closest('.upload-btn');
    fileIn.addEventListener('click', (e) => { if (lbl.dataset.disabled) { e.preventDefault(); toast('Analiz sürerken bekleyin', 'warn'); } });
    fileIn.addEventListener('change', () => {
      const f = fileIn.files[0];
      if (!f) return;
      const img = new Image();
      img.onload = () => analyzeFrom(img);
      img.onerror = () => toast('Görsel okunamadı', 'err');
      img.src = URL.createObjectURL(f);
    });
  }
  captureBtn.addEventListener('click', async () => {
    if (analyzing) return;
    const video = root.querySelector('#cam');
    if (!cameraActive()) { await initCamera(root); return; }
    if (!video.videoWidth) return toast('Kamera hazır değil, bir saniye bekleyin', 'warn');
    analyzeFrom(video);
  });

  // Sonuç panelindeki olaylar (delege)
  const pane = root.querySelector('#result-pane');
  pane.addEventListener('click', async (e) => {
    const altChip = e.target.closest('.sr-alt-chip');
    if (altChip) {
      const fid = altChip.dataset.fid;
      const food = state.catalog.find((f) => f.id === fid);
      result.matched.unshift({ food, prob: 0.85, rawClass: 'manual' });
      paint_scan(root);
      return;
    }
    const pb = e.target.closest('.pbtn');
    if (pb && pb.dataset.p) { portion = Number(pb.dataset.p); paint_scan(root); return; }
    if (pb && pb.dataset.s) { slot = pb.dataset.s; paint_scan(root); return; }
    if (e.target.closest('#sr-manual')) { openManualPicker(); return; }
    if (e.target.closest('#sr-add')) {
      const top = result.matched[0];
      await api('/api/diary', {
        method: 'POST',
        body: {
          date: todayStr(), meal: slot, name: top.food.name,
          kcal: Math.round(top.food.kcal * portion),
          protein: +(top.food.protein * portion).toFixed(1),
          carbs: +(top.food.carbs * portion).toFixed(1),
          fat: +(top.food.fat * portion).toFixed(1),
          source: 'ai'
        }
      });
      toast(`${top.food.name} (${Math.round(top.food.kcal * portion)} kcal) ${MEALS[slot].label.toLowerCase()} öğününe eklendi 🎉`, 'ok');
      state.recentScans.unshift({ thumb: shotURL, name: top.food.name, ref: result });
      state.recentScans = state.recentScans.slice(0, 8);
      result = null;
      shotURL = null;
      paint_scan(root);
    }
  });

  root.querySelectorAll('.scan-thumb').forEach((t) => t.addEventListener('click', () => {
    result = state.recentScans[Number(t.dataset.i)].ref;
    portion = 1;
    paint_scan(root);
  }));
}

async function analyzeFrom(srcEl) {
  if (analyzing) return;
  analyzing = true;
  const canvas = captureToCanvas(srcEl);
  shotURL = canvas.toDataURL('image/jpeg', 0.85);
  result = null;
  paint_scan(document.querySelector('#view'));

  const t0 = Date.now();
  let out;
  try {
    out = await classify(canvas);
  } catch {
    out = colorFallback(canvas);
  }
  // Analiz animasyonunun en az 1.6s görünmesi
  const wait = Math.max(0, 1600 - (Date.now() - t0));
  setTimeout(() => {
    analyzing = false;
    result = out;
    portion = 1;
    slot = guessSlot();
    paint_scan(document.querySelector('#view'));
    if (out.engine === 'heuristic' && out.note) toast(out.note, 'warn');
  }, wait);
}

function openManualPicker() {
  openModal(`
    <div class="modal-head"><h3>Yemeği elle seç</h3><button class="icon-btn" data-close>${icon('x', 18)}</button></div>
    <div class="modal-body">
      <div class="search-row"><div class="search-box">${icon('search', 17)}<input id="mp-q" placeholder="Besin ara…"/></div></div>
      <div class="food-list" id="mp-list"></div>
    </div>
  `, {
    width: 560,
    onMount(overlay, close) {
      const list = overlay.querySelector('#mp-list');
      const paintList = (q = '') => {
        const items = state.catalog.filter((f) => !q || f.name.toLowerCase().includes(q));
        list.innerHTML = items.map((f) => `
          <button class="food-row" data-id="${f.id}">
            <div><b>${esc(f.name)}</b><small>${esc(f.portion)} · ${f.kcal} kcal</small></div>
            <span class="add-badge">${icon('plus', 15)}</span>
          </button>`).join('');
        list.querySelectorAll('.food-row').forEach((b) => b.addEventListener('click', () => {
          const food = state.catalog.find((f) => f.id === b.dataset.id);
          result.matched.unshift({ food, prob: 1, rawClass: 'manual' });
          close();
          paint_scan(document.querySelector('#view'));
        }));
      };
      paintList();
      overlay.querySelector('#mp-q').addEventListener('input', (e) => paintList(e.target.value.toLowerCase()));
    }
  });
}

/* views/reports.js — İstatistikler: kalori grafiği, makro ortalamaları, kilo takibi */



let repStats = null;
let range = 14;

async function render_reports(root) {
  repStats = await api(`/api/repStats?end=${todayStr()}&days=${range}`);
  paint_reports(root);
}

function paint_reports(root) {
  const t = repStats.targets;
  const days = repStats.days.slice(-range);
  const active = days.filter((d) => d.meals > 0);
  const avgKcal = active.length ? Math.round(active.reduce((a, d) => a + d.kcal, 0) / active.length) : 0;
  const avgProtein = active.length ? Math.round(active.reduce((a, d) => a + d.protein, 0) / active.length) : 0;
  const avgCarbs = active.length ? Math.round(active.reduce((a, d) => a + d.carbs, 0) / active.length) : 0;
  const avgFat = active.length ? Math.round(active.reduce((a, d) => a + d.fat, 0) / active.length) : 0;
  const avgWater = active.length ? Math.round(active.reduce((a, d) => a + d.water, 0) / active.length) : 0;
  const totalLogs = active.reduce((a, d) => a + d.meals, 0);
  const weights = repStats.weights;
  const wDelta = weights.length >= 2 ? +(weights[weights.length - 1].kg - weights[0].kg).toFixed(1) : null;
  const macroSum = avgProtein + avgCarbs + avgFat || 1;

  root.innerHTML = `
  <div class="view">
    <header class="view-head">
      <div>
        <h1>Raporlar</h1>
        <p class="muted">Son ${range} günlük beslenme performansın</p>
      </div>
      <div class="head-actions">
        ${[7, 14, 30].map((r) => `<button class="chip ${range === r ? 'active' : ''}" data-r="${r}">${r} gün</button>`).join('')}
      </div>
    </header>

    <div class="stat-cards">
      <div class="card stat"><span class="stat-ic fire">${icon('flame', 19)}</span><div><b>${repStats.streak}</b><span>günlük seri</span></div></div>
      <div class="card stat"><span class="stat-ic green">${icon('book', 19)}</span><div><b>${totalLogs}</b><span>kayıt girilen öğün</span></div></div>
      <div class="card stat"><span class="stat-ic blue">${icon('target', 19)}</span><div><b>${avgKcal || '—'}</b><span>ort. günlük kcal</span></div></div>
      <div class="card stat"><span class="stat-ic cyan">${icon('drop', 19)}</span><div><b>${avgWater || '—'} ml</b><span>ort. günlük su</span></div></div>
    </div>

    <div class="card chart-card">
      <h3 class="card-title">${icon('chart', 18)} Günlük Kalori Alımı <small class="muted">— kesikli çizgi hedef (${t.kcal} kcal)</small></h3>
      ${barChart(
        days.map((d) => ({ label: fmtDateShort(d.date), v: Math.round(d.kcal), dim: d.meals === 0 })),
        { w: 760, h: 200, target: t.kcal }
      )}
      ${active.length === 0 ? `<p class="muted center pad">Henüz kayıt yok. "Bugün" sekmesinden öğün ekleyerek grafiklerini doldurmaya başla.</p>` : ''}
    </div>

    <div class="reports-row">
      <div class="card chart-card">
        <h3 class="card-title">${icon('chart', 18)} Ortalama Makro Dağılımı</h3>
        <div class="macro-donut-row">
          <div class="macro-stack">
            <div class="mstack"><span>Protein <b>${avgProtein}g</b></span><div class="pbar"><div style="width:${Math.round((avgProtein / macroSum) * 100)}%;background:var(--primary)"></div></div></div>
            <div class="mstack"><span>Karbonhidrat <b>${avgCarbs}g</b></span><div class="pbar"><div style="width:${Math.round((avgCarbs / macroSum) * 100)}%;background:#0ea5e9"></div></div></div>
            <div class="mstack"><span>Yağ <b>${avgFat}g</b></span><div class="pbar"><div style="width:${Math.round((avgFat / macroSum) * 100)}%;background:#f59e0b"></div></div></div>
          </div>
          <div class="macro-circle">
            <svg viewBox="0 0 42 42" width="130" height="130">
              <circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--ring-bg)" stroke-width="6"/>
              <circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--primary)" stroke-width="6" stroke-dasharray="${(avgProtein / macroSum * 100).toFixed(1)} 100" transform="rotate(-90 21 21)" stroke-dashoffset="0"/>
              <circle cx="21" cy="21" r="15.9" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-dasharray="${(avgCarbs / macroSum * 100).toFixed(1)} 100" stroke-dashoffset="${(-avgProtein / macroSum * 100).toFixed(1)}" transform="rotate(-90 21 21)"/>
              <circle cx="21" cy="21" r="15.9" fill="none" stroke="#f59e0b" stroke-width="6" stroke-dasharray="${(avgFat / macroSum * 100).toFixed(1)} 100" stroke-dashoffset="${(-(avgProtein + avgCarbs) / macroSum * 100).toFixed(1)}" transform="rotate(-90 21 21)"/>
              <text x="21" y="22" text-anchor="middle" class="mc-text">Makro</text>
            </svg>
          </div>
        </div>
      </div>

      <div class="card chart-card">
        <div class="card-title-row">
          <h3 class="card-title">${icon('activity', 18)} Kilo Takibi</h3>
          <button class="btn btn-sm btn-ghost" id="w-add">${icon('plus', 15)} Kilo Ekle</button>
        </div>
        ${wDelta !== null ? `<div class="w-delta ${wDelta <= 0 ? 'good' : ''}">${wDelta <= 0 ? '▼' : '▲'} ${Math.abs(wDelta)} kg ${wDelta <= 0 ? 'kayıt başlangıcından beri' : 'artış'}</div>` : ''}
        ${lineChart(
          weights.map((w) => ({ v: w.kg, label: fmtDateShort(w.date) })),
          { w: 380, h: 170, fmt: (v) => v + ' kg' }
        )}
        ${weights.length === 0 ? `<p class="muted center pad">Kilo ekle, gelişimini burada izle.</p>` : ''}
      </div>
    </div>
  </div>`;

  root.querySelectorAll('.head-actions .chip').forEach((c) => c.addEventListener('click', async () => {
    range = Number(c.dataset.r);
    repStats = await api(`/api/repStats?end=${todayStr()}&days=${range}`);
    paint_reports(root);
  }));

  root.querySelector('#w-add').addEventListener('click', () => confirmModal({
    title: 'Bugünün kilosu',
    text: 'Sabah aç karnına tartım en doğru sonucu verir.',
    placeholder: 'Örn. 68.5',
    confirmText: 'Kaydet',
    onConfirm: async () => {
      const v = parseFloat(document.getElementById('confirm-input').value.replace(',', '.'));
      if (!(v >= 30 && v <= 300)) throw new Error('Geçerli bir kilo gir (30–300 kg).');
      await api('/api/weights', { method: 'POST', body: { date: todayStr(), kg: v } });
      repStats = await api(`/api/repStats?end=${todayStr()}&days=${range}`);
      paint_reports(root);
      toast('Kilo kaydedildi', 'ok');
    }
  }));
}

          height: overlay.querySelector('#e-height').value,
          weight: overlay.querySelector('#e-weight').value,
          targetWeight: overlay.querySelector('#e-tw').value || null,
          activity: overlay.querySelector('#e-act').value,
          goal: overlay.querySelector('#e-goal').value
        };
        try {
          const { user } = await api('/api/profile', { method: 'PUT', body });
          state.user = user;
          toast('Hedeflerin güncellendi ve programın yeniden hesaplandı', 'ok');
          close();
          render_profile(document.getElementById('view'));
        } catch (e) {
          overlay.querySelector('#e-err').textContent = e.message;
        }
      });
    }
  });
}


/* ===== js/main.js ===== */
const Auth = { render: render_auth };
const Onboarding = { render: render_onboarding };
const Today = { render: render_today };
const Plan = { render: render_plan };
const Recipes = { render: render_recipes, openRecipeModal };
const Scan = { render: render_scan };
const Reports = { render: render_reports };
const Profile = { render: render_profile };
/* main.js — Uygulama önyükleme + hash yönlendirici */











const app = document.getElementById('app');

const ROUTES = {
  '/giris': Auth,
  '/onboarding': Onboarding,
  '/bugun': Today,
  '/program': Plan,
  '/tarifler': Recipes,
  '/tara': Scan,
  '/raporlar': Reports,
  '/profil': Profile
};

const NAV = [
  { path: '/bugun', label: 'Bugün', icon: 'home' },
  { path: '/program', label: 'Programım', icon: 'map' },
  { path: '/tara', label: 'AI Tarama', icon: 'scan' },
  { path: '/tarifler', label: 'Tarifler', icon: 'book' },
  { path: '/raporlar', label: 'Raporlar', icon: 'chart' },
  { path: '/profil', label: 'Profil', icon: 'user' }
];

let bootDone = false;

function navigate(path) {
  if (location.hash === '#' + path) render();
  else location.hash = '#' + path;
}

function parseHash() {
  const raw = (location.hash || '#/bugun').slice(1);
  const [path, query] = raw.split('?');
  return { path: path || '/bugun', query: new URLSearchParams(query || '') };
}

/* --------------------------- Uygulama kabuğu (shell) ---------------------- */

function shellHTML(active) {
  const u = state.user;
  const navItems = NAV.map(
    (n) => `
    <a class="nav-item ${active === n.path ? 'active' : ''}" href="#${n.path}" data-path="${n.path}">
      ${icon(n.icon, 20)}<span>${n.label}</span>
    </a>`
  ).join('');

  const initials = (u.name || '?').trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();

  return `
  <aside class="sidebar">
    <a class="brand" href="#/bugun">
      <svg viewBox="0 0 24 24" width="34" height="34"><rect width="24" height="24" rx="6" fill="rgba(163,230,53,.14)"/><path d="M11 19a6 6 0 0 1-1.04-11.9C14.7 6.1 15.9 5.65 17.5 3.6c.85 1.7 1.7 3.55 1.7 6.8C19.2 14.6 15.4 19 11 19z" fill="#a3e635"/></svg>
      <span>Nutri<b>AI</b></span>
    </a>
    <nav class="side-nav">${navItems}</nav>
    <div class="side-user">
      <div class="avatar">${initials}</div>
      <div class="side-user-info">
        <div class="side-user-name">${u.name}</div>
        <div class="side-user-mail">${u.email}</div>
      </div>
      <button class="icon-btn" id="logout-btn" title="Çıkış Yap">${icon('logout', 18)}</button>
    </div>
  </aside>

  <header class="mobile-topbar">
    <a class="brand" href="#/bugun">
      <svg viewBox="0 0 24 24" width="28" height="28"><rect width="24" height="24" rx="6" fill="rgba(163,230,53,.14)"/><path d="M11 19a6 6 0 0 1-1.04-11.9C14.7 6.1 15.9 5.65 17.5 3.6c.85 1.7 1.7 3.55 1.7 6.8C19.2 14.6 15.4 19 11 19z" fill="#a3e635"/></svg>
      <span>Nutri<b>AI</b></span>
    </a>
    <a class="avatar-link" href="#/profil"><div class="avatar avatar-sm">${initials}</div></a>
  </header>

  <main class="content" id="view"></main>

  <nav class="bottom-nav">
    <a class="bnav ${active === '/bugun' ? 'active' : ''}" href="#/bugun">${icon('home', 22)}<span>Bugün</span></a>
    <a class="bnav ${active === '/program' ? 'active' : ''}" href="#/program">${icon('map', 22)}<span>Program</span></a>
    <a class="bnav-fab ${active === '/tara' ? 'active' : ''}" href="#/tara" aria-label="AI Tarama">${icon('scan', 24)}</a>
    <a class="bnav ${active === '/tarifler' ? 'active' : ''}" href="#/tarifler">${icon('book', 22)}<span>Tarifler</span></a>
    <a class="bnav ${active === '/profil' ? 'active' : ''}" href="#/profil">${icon('user', 22)}<span>Profil</span></a>
  </nav>`;
}

function bindShell() {
  const lb = document.getElementById('logout-btn');
  if (lb) lb.addEventListener('click', async () => {
    await api('/api/auth/logout', { method: 'POST' });
    state.user = null;
    toast('Çıkış yapıldı. Görüşmek üzere!', 'ok');
    navigate('/giris');
  });
}

/* --------------------------------- Render --------------------------------- */

async function render() {
  const { path, query } = parseHash();
  const user = state.user;

  // Yönlendirme kuralları
  if (!user && path !== '/giris') return navigate('/giris');
  if (user && !user.onboarded && path !== '/onboarding' && path !== '/giris') return navigate('/onboarding');
  if (user && user.onboarded && (path === '/giris' || path === '/onboarding')) return navigate('/bugun');
  if (!ROUTES[path]) return navigate(user ? '/bugun' : '/giris');

  const view = ROUTES[path];
  const needsShell = user && user.onboarded;

  if (needsShell) {
    app.innerHTML = shellHTML(path);
    bindShell();
  }

  const container = needsShell ? document.getElementById('view') : app;
  try {
    await view.render(container, { query, navigate, state });
  } catch (e) {
    console.error(e);
    container.innerHTML = `<div class="view"><div class="card pad"><h3>Bir hata oluştu</h3><p class="muted">${e.message}</p></div></div>`;
  }
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', render);

(async function boot() {
  try {
    const me = await api('/api/me').catch(() => null);
    state.user = me ? me.user : null;
    if (state.user) await loadInitialData();
  } catch (e) {
    console.warn(e);
  }
  bootDone = true;
  render();
})();

</script>
</body>
</html>
