/* ---- Firebase Firestore Real-Time Storage Engine ---- */
window.storage = {
  async get(key) {
    try {
      const doc = await window.db.collection('app_data').doc(key).get();
      if (doc.exists) {
        return { key, value: doc.data().value };
      }
      return null;
    } catch (e) {
      console.error("Firebase Read Error:", e);
      return null;
    }
  },
  async set(key, value) {
    try {
      await window.db.collection('app_data').doc(key).set({ value: value });
      return { key, value };
    } catch (e) {
      console.error("Firebase Write Error:", e);
      return { key, value };
    }
  },
  async delete(key) {
    try {
      await window.db.collection('app_data').doc(key).delete();
      return { key, deleted: true };
    } catch (e) {
      console.error("Firebase Delete Error:", e);
      return { key, deleted: false };
    }
  },
  async list(prefix) {
    try {
      const snapshot = await window.db.collection('app_data').get();
      const keys = [];
      snapshot.forEach(doc => {
        if (!prefix || doc.id.startsWith(prefix)) {
          keys.push(doc.id);
        }
      });
      return { keys };
    } catch (e) {
      console.error("Firebase List Error:", e);
      return { keys: [] };
    }
  }
};

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function formatTL(n) { return Number(n || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function paidTotal(inv) {
  if (Array.isArray(inv.payments) && inv.payments.length) return inv.payments.reduce((s, p) => s + p.amount, 0);
  if (inv.status === 'paid') return inv.amount;
  return 0;
}
function remainingAmount(inv) { return Math.max(0, inv.amount - paidTotal(inv)); }
function invStatus(inv) {
  const paid = paidTotal(inv);
  if (paid >= inv.amount) return 'paid';
  if (paid > 0) return 'partial';
  return 'unpaid';
}

function daysSince(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  return Math.floor((now - d) / 86400000);
}

function personReliability(personInvoices) {
  if (!personInvoices || personInvoices.length === 0) return null;
  const rank = { onTime: 0, medium: 1, late: 2 };
  let worst = 'onTime';
  personInvoices.forEach(inv => {
    const rem = remainingAmount(inv);
    let days = daysSince(inv.date);
    let cat = 'onTime';
    if (days > 45) cat = 'late';
    else if (days > 30) cat = 'medium';
    if (rank[cat] > rank[worst]) worst = cat;
  });
  return worst;
}

const CURRENCIES = ['TRY', 'USD', 'EUR', 'GBP'];
const EXPENSE_CATEGORIES = ['kira', 'maas', 'parca', 'fatura', 'yakit', 'diger'];

function App() {
  const [data, setData] = useState({ people: [], invoices: [], expenses: [] });
  const [loading, setLoading] = useState(true);

  // Real-time listener from Firebase Firestore
  useEffect(() => {
    const unsubscribe = window.db.collection('app_data').doc('main_store')
      .onSnapshot((doc) => {
        if (doc.exists) {
          const fetchedData = doc.data().value;
          if (fetchedData) {
            setData(typeof fetchedData === 'string' ? JSON.parse(fetchedData) : fetchedData);
          }
        }
        setLoading(false);
      }, (err) => {
        console.error("Firestore sync error:", err);
        setLoading(false);
      });

    return () => unsubscribe();
  }, []);

  const saveData = async (newData) => {
    setData(newData);
    await window.storage.set('main_store', JSON.stringify(newData));
  };

  if (loading) {
    return (

          <RefreshCw className="animate-spin mb-2 mx-auto" size={32} />

    );

        </div>
      </main>
    </div>
  );
}
