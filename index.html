<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0F19">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ocakbaşı POS">
<title>Ocakbaşı POS — Modern Restoran Panel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<!-- Firebase Compatibility Libraries -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
  :root {
    --bg-main: #0b0f19;
    --bg-card: #111827;
    --bg-card-hover: #1f2937;
    --border: #1f2937;
    --border-accent: #374151;
    
    --primary: #ff6b00;
    --primary-glow: rgba(255, 107, 0, 0.25);
    --primary-hover: #ff8533;
    
    --text-main: #f9fafb;
    --text-muted: #9ca3af;
    --text-dim: #6b7280;
    
    --success: #10b981;
    --success-bg: rgba(16, 185, 129, 0.12);
    --warning: #f59e0b;
    --warning-bg: rgba(245, 158, 11, 0.12);
    --danger: #ef4444;
    --danger-bg: rgba(239, 68, 68, 0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  button, input, textarea { font-family: inherit; }

  /* ===== MODERN TOP BAR ===== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: #111827;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 30;
    backdrop-filter: blur(12px);
  }

  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--primary), #d946ef);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px; color: #fff;
    box-shadow: 0 0 15px var(--primary-glow);
  }
  .brand h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
  
  .sync-badge {
    font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
    display: inline-flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .sync-online { background: var(--success-bg); color: var(--success); border: 1px solid rgba(16,185,129,0.3); }
  .sync-offline { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }

  .tabs { display: flex; gap: 8px; background: #0b0f19; padding: 4px; border-radius: 12px; border: 1px solid var(--border); }
  .tab-btn {
    background: transparent; border: none; color: var(--text-muted);
    padding: 8px 16px; border-radius: 8px; cursor: pointer;
    font-weight: 600; font-size: 13px; position: relative;
    transition: all 0.15s ease;
  }
  .tab-btn:hover { color: var(--text-main); }
  .tab-btn.active { background: var(--primary); color: #fff; box-shadow: 0 0 12px var(--primary-glow); }
  
  .tab-badge {
    position: absolute; top: -4px; right: -4px;
    background: var(--danger); color: #fff; font-size: 10px; font-weight: 800;
    border-radius: 10px; padding: 2px 6px; min-width: 18px; text-align: center;
  }

  .user-box { display: flex; align-items: center; gap: 14px; }
  .clock { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-muted); font-weight: 500; }
  .current-user { font-size: 13px; font-weight: 700; color: var(--primary); }
  .logout-btn {
    background: var(--bg-card-hover); border: 1px solid var(--border); color: var(--text-muted);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600;
    transition: all 0.15s ease;
  }
  .logout-btn:hover { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }

  /* ===== LOGIN SCREEN ===== */
  #login-screen {
    position: fixed; inset: 0; z-index: 100; background: var(--bg-main);
    display: flex; align-items: center; justify-content: center;
  }
  body.logged-in #login-screen { display: none; }
  body:not(.logged-in) #app-shell { display: none; }
  
  .login-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px;
    padding: 40px 36px; width: 100%; max-width: 380px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    text-align: center;
  }
  .login-card h2 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
  .login-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
  .login-form { display: flex; flex-direction: column; gap: 12px; }
  .login-form input {
    font-size: 14px; padding: 12px 14px; border: 1px solid var(--border);
    border-radius: 10px; background: var(--bg-main); color: var(--text-main); outline: none;
    transition: border-color 0.15s ease;
  }
  .login-form input:focus { border-color: var(--primary); }
  .login-form button {
    background: var(--primary); color: #fff; border: none; padding: 12px;
    border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer;
    box-shadow: 0 4px 14px var(--primary-glow); transition: background 0.15s ease;
  }
  .login-form button:hover { background: var(--primary-hover); }

  /* ===== TOAST ===== */
  #toast-wrap { position: fixed; top: 76px; right: 24px; z-index: 60; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--bg-card); color: var(--text-main); padding: 12px 18px; border-radius: 10px;
    font-size: 13px; font-weight: 600; border: 1px solid var(--border);
    box-shadow: 0 10px 25px rgba(0,0,0,0.3); animation: slidein 0.2s ease;
  }
  @keyframes slidein { from { opacity:0; transform: translateX(20px); } to { opacity:1; transform: translateX(0); } }

  /* ===== MAIN CONTENT VIEW ===== */
  .view { padding: 28px; max-width: 1440px; margin: 0 auto; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .section-title { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }

  /* ===== TABLES GRID ===== */
  .table-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
  .table-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px; cursor: pointer; text-align: left; transition: all 0.15s ease;
    display: flex; flex-direction: column; justify-content: space-between; min-height: 135px;
  }
  .table-card:hover { transform: translateY(-3px); border-color: var(--primary); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
  .table-card .tno { font-size: 18px; font-weight: 800; color: var(--text-main); }
  .table-card .tstatus {
    font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 8px;
    display: inline-block; margin-top: 10px; width: fit-content; text-transform: uppercase;
  }
  .table-card .ttotal { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: var(--primary); margin-top: 12px; }

  .s-empty { background: rgba(255,255,255,0.05); color: var(--text-dim); }
  .s-ordering { background: var(--warning-bg); color: var(--warning); }
  .s-kitchen { background: rgba(255, 107, 0, 0.15); color: var(--primary); }
  .s-ready { background: var(--success-bg); color: var(--success); animation: pulse 1.5s infinite; }
  .s-payment { background: var(--danger-bg); color: var(--danger); }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.6;} }

  /* ===== ORDER LAYOUT ===== */
  .order-layout { display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px; }
  @media (max-width: 960px) { .order-layout { grid-template-columns: 1fr; } }
  
  .back-btn {
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted);
    padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13px;
    margin-bottom: 20px; display: inline-flex; align-items: center; gap: 8px; transition: all 0.15s ease;
  }
  .back-btn:hover { border-color: var(--primary); color: var(--text-main); }

  .menu-block { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
  .category-title { font-size: 14px; font-weight: 700; text-transform: uppercase; color: var(--primary); margin: 20px 0 12px; letter-spacing: 0.5px; }
  .category:first-child .category-title { margin-top: 0; }
  
  .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .item-btn {
    background: var(--bg-main); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between;
    transition: all 0.12s ease; gap: 8px; text-align: left;
  }
  .item-btn:hover { border-color: var(--primary); background: var(--bg-card-hover); transform: translateY(-2px); }
  .item-name { font-size: 14px; font-weight: 600; color: var(--text-main); }
  .item-price { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: var(--primary); }

  /* TICKET / BILL */
  .ticket {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .ticket-head { padding: 20px; border-bottom: 1px solid var(--border); text-align: center; }
  .ticket-head .tname { font-size: 20px; font-weight: 800; }
  .ticket-body { padding: 16px; max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .empty-note { text-align: center; color: var(--text-dim); font-size: 13px; padding: 30px 0; }
  
  .line {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; background: var(--bg-main); border-radius: 10px; font-size: 13px;
  }
  .l-name { font-weight: 600; flex: 1; }
  .l-qty { display: flex; align-items: center; gap: 8px; margin: 0 12px; }
  .qty-btn {
    background: var(--bg-card-hover); border: 1px solid var(--border); color: var(--text-main);
    width: 24px; height: 24px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 700;
  }
  .qty-btn:hover { border-color: var(--primary); }

  .field-block { padding: 0 20px 14px; }
  .field-block label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 6px; letter-spacing: 0.5px; }
  .field-block textarea, .field-block input {
    width: 100%; font-size: 13px; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 10px; background: var(--bg-main); color: var(--text-main); outline: none;
  }
  .field-block textarea:focus, .field-block input:focus { border-color: var(--primary); }

  .wa-row { display: flex; gap: 8px; }
  .wa-btn {
    background: #25D366; color: #fff; border: none; padding: 0 16px; border-radius: 10px;
    font-weight: 700; font-size: 12px; cursor: pointer; white-space: nowrap; transition: opacity 0.15s ease;
  }
  .wa-btn:hover { opacity: 0.9; }

  .ticket-totals { padding: 16px 20px; border-top: 1px solid var(--border); }
  .trow { display: flex; justify-content: space-between; font-size: 18px; font-weight: 800; color: var(--text-main); }
  .trow span:last-child { font-family: 'JetBrains Mono', monospace; color: var(--primary); }

  .ticket-actions { padding: 0 20px 20px; display: flex; flex-direction: column; gap: 10px; }
  .btn {
    font-weight: 700; font-size: 14px; padding: 12px; border: none; border-radius: 10px;
    cursor: pointer; transition: all 0.15s ease; text-align: center;
  }
  .btn-send { background: var(--primary); color: #fff; box-shadow: 0 4px 14px var(--primary-glow); }
  .btn-send:hover { background: var(--primary-hover); }
  .btn-pay { background: var(--success); color: #fff; }
  .btn-pay:hover { opacity: 0.9; }

  /* ===== KDS (KITCHEN DYNAMIC DASHBOARD) ===== */
  .kds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .kds-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
    padding: 18px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .kds-card.bekliyor { border-left: 4px solid var(--warning); }
  .kds-card.hazirlaniyor { border-left: 4px solid var(--primary); }
  .kds-card.hazir { border-left: 4px solid var(--success); }
  
  .kds-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .kds-table { font-size: 18px; font-weight: 800; }
  .kds-items { font-size: 13px; line-height: 1.8; color: var(--text-muted); margin-bottom: 14px; }
  .kds-actions { display: flex; gap: 8px; }
  .kds-btn {
    flex: 1; font-weight: 700; font-size: 12px; padding: 8px; border: none; border-radius: 8px; cursor: pointer; color: #fff;
  }
  .kds-btn.prep { background: var(--primary); }
  .kds-btn.ready { background: var(--success); }

  /* ===== SUMMARY & EXPENSES ===== */
  .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .summary-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
  .summary-card .s-label { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
  .summary-card .s-value { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 800; color: var(--primary); }

  .expense-block { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-top: 24px; }
  .expense-form { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .expense-form input {
    font-size: 13px; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--bg-main); color: var(--text-main); outline: none;
  }
  .expense-form button {
    background: var(--danger); color: #fff; border: none; padding: 10px 18px;
    border-radius: 8px; font-weight: 700; cursor: pointer;
  }

  .expense-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }

  /* RESPONSIVE */
  @media (max-width: 640px) {
    .topbar { flex-wrap: wrap; gap: 12px; padding: 12px 16px; }
    .tabs { order: 3; width: 100%; overflow-x: auto; }
    .tab-btn { font-size: 12px; padding: 6px 12px; flex-shrink: 0; }
    .view { padding: 16px; }
    .table-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="brand" style="justify-content: center; margin-bottom: 16px;">
      <div class="brand-icon">O</div>
      <h1>Ocakbaşı POS</h1>
    </div>
    <div class="login-sub">Sisteme erişmek için giriş yapın</div>
    <div class="login-form">
      <input type="text" id="login-name" placeholder="Kullanıcı Adı">
      <input type="password" id="login-pass" placeholder="Şifre" onkeydown="if(event.key==='Enter') handleLogin();">
      <button id="btn-login" onclick="handleLogin()">Giriş Yap</button>
    </div>
  </div>
</div>

<div id="app-shell">

<div class="topbar">
  <div class="brand">
    <div class="brand-icon">O</div>
    <div>
      <h1>Ocakbaşı POS</h1>
    </div>
    <span id="sync-indicator" class="sync-badge sync-offline">Sync...</span>
  </div>
  
  <div class="tabs">
    <button class="tab-btn active" data-view="masalar" onclick="switchView('masalar')">Masalar</button>
    <button class="tab-btn" data-view="mutfak" onclick="switchView('mutfak')">Mutfak<span class="tab-badge" id="badge-mutfak" style="display:none;">0</span></button>
    <button class="tab-btn" data-view="kasa" onclick="switchView('kasa')">Kasa<span class="tab-badge" id="badge-kasa" style="display:none;">0</span></button>
    <button class="tab-btn" data-view="gunsonu" onclick="switchView('gunsonu')">Gün Sonu</button>
    <button class="tab-btn" data-view="personel" onclick="switchView('personel')">Personel</button>
    <button class="tab-btn" data-view="menuyonetim" onclick="switchView('menuyonetim')">Menü</button>
  </div>
  
  <div class="user-box">
    <span class="clock" id="clock"></span>
    <span class="current-user" id="current-user"></span>
    <button class="logout-btn" onclick="handleLogout()">Çıkış</button>
  </div>
</div>

<div id="toast-wrap"></div>
<div class="view" id="view-root"></div>

</div>

<script>
/* ============ FIREBASE CONFIG & INIT ============ */
const firebaseConfig = {
  apiKey: "AIzaSyAANxv0YtzXCG-y0CVln3QXdudHXlL94Ew",
  authDomain: "ocakbasi-kasa.firebaseapp.com",
  projectId: "ocakbasi-kasa",
  storageBucket: "ocakbasi-kasa.firebasestorage.app",
  messagingSenderId: "211570484231",
  appId: "1:211570484231:web:0bee101bf224be45a976a2",
  measurementId: "G-BQKZZ10QH6"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ============ INITIAL STATE ============ */
const INITIAL_MENU = [
  { cat: "Ana Yemekler", items: [
    { id:"adana",   name:"Adana Kebap", price:280 },
    { id:"urfa",    name:"Urfa Kebap", price:270 },
    { id:"pirzola", name:"Kuzu Pirzola", price:420 },
    { id:"tavuk",   name:"Tavuk Şiş", price:220 },
    { id:"kofte",   name:"Izgara Köfte", price:230 },
    { id:"lahmacun",name:"Lahmacun", price:90 }
  ]},
  { cat: "Başlangıçlar", items: [
    { id:"mercimek", name:"Mercimek Çorbası", price:90 },
    { id:"ezme",     name:"Acılı Ezme", price:70 },
    { id:"humus",    name:"Humus", price:95 },
    { id:"cacik",    name:"Cacık", price:75 }
  ]},
  { cat: "İçecekler", items: [
    { id:"ayran",  name:"Ayran", price:40 },
    { id:"kola",   name:"Kola (kutu)", price:50 },
    { id:"su",     name:"Su", price:20 },
    { id:"cay",    name:"Çay", price:25 }
  ]},
  { cat: "Tatlılar", items: [
    { id:"baklava", name:"Baklava (dilim)", price:110 },
    { id:"kunefe",  name:"Künefe", price:150 }
  ]}
];

function makeTable(no){
  return {
    no,
    status: 'empty',
    order: { items:{}, note:'' },
    kitchenStatus: null,
    whatsapp: ''
  };
}

let state = {
  tables: Array.from({length:10}, (_,i) => makeTable(i+1)),
  menu: INITIAL_MENU,
  activeView: 'masalar',
  selectedTableNo: null,
  salesLog: [],
  expenses: [],
  currentUser: null
};

/* ============ REALTIME FIREBASE SYNC ============ */
db.collection("restaurant").doc("live_state")
  .onSnapshot((doc) => {
    const indicator = document.getElementById('sync-indicator');
    if (doc.exists) {
      const cloud = doc.data();
      if(cloud.tables) state.tables = cloud.tables;
      if(cloud.menu) state.menu = cloud.menu;
      if(cloud.salesLog) state.salesLog = cloud.salesLog;
      if(cloud.expenses) state.expenses = cloud.expenses;
      
      if(indicator) {
        indicator.textContent = "● CANLI SYNC";
        indicator.className = "sync-badge sync-online";
      }
      renderUI();
    } else {
      saveStateToCloud();
    }
  }, (err) => {
    console.error("Sync Error:", err);
    const indicator = document.getElementById('sync-indicator');
    if(indicator) {
      indicator.textContent = "● OFFLINE";
      indicator.className = "sync-badge sync-offline";
    }
  });

function saveStateToCloud() {
  db.collection("restaurant").doc("live_state").set({
    tables: state.tables,
    menu: state.menu,
    salesLog: state.salesLog,
    expenses: state.expenses
  });
}

/* ============ HELPERS ============ */
function tl(n){ return '₺' + (n || 0).toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function getTable(no){ return state.tables.find(t => t.no === no); }
function orderTotal(order){ return Object.values(order.items || {}).reduce((s,l)=>s+l.price*l.qty,0); }
function statusLabel(s){
  return { empty:'Boş', ordering:'Sipariş', kitchen:'Mutfakta', ready:'Hazır', payment:'Ödeme' }[s] || 'Boş';
}
function statusClass(s){
  return { empty:'s-empty', ordering:'s-ordering', kitchen:'s-kitchen', ready:'s-ready', payment:'s-payment' }[s] || 's-empty';
}

function toast(msg){
  const wrap = document.getElementById('toast-wrap');
  if(!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=> el.remove(), 3500);
}

function updateClock(){
  const clockEl = document.getElementById('clock');
  if(clockEl) {
    const now = new Date();
    clockEl.textContent = now.toLocaleTimeString('tr-TR');
  }
}
setInterval(updateClock, 1000);

/* ============ RENDER LOGIC ============ */
function renderUI() {
  renderTopbar();
  const root = document.getElementById('view-root');
  if(!root) return;

  if (state.activeView === 'masalar') {
    if (state.selectedTableNo !== null) {
      renderOrderPanel(root);
    } else {
      renderMasalarGrid(root);
    }
  } else if (state.activeView === 'mutfak') {
    renderMutfak(root);
  } else if (state.activeView === 'kasa') {
    renderKasa(root);
  } else if (state.activeView === 'gunsonu') {
    renderGunSonu(root);
  } else if (state.activeView === 'personel') {
    renderPersonel(root);
  } else if (state.activeView === 'menuyonetim') {
    renderMenuYonetim(root);
  }
}

function renderTopbar(){
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.view === state.activeView);
  });
  const kitchenCount = state.tables.filter(t=>t.status==='kitchen').length;
  const readyCount = state.tables.filter(t=>t.status==='ready').length;
  const badgeM = document.getElementById('badge-mutfak');
  if(badgeM) {
    badgeM.style.display = kitchenCount+readyCount > 0 ? 'inline-block' : 'none';
    badgeM.textContent = kitchenCount+readyCount;
  }

  const payCount = state.tables.filter(t=>t.status==='payment'||t.status==='ready').length;
  const badgeK = document.getElementById('badge-kasa');
  if(badgeK) {
    badgeK.style.display = payCount > 0 ? 'inline-block' : 'none';
    badgeK.textContent = payCount;
  }

  const userEl = document.getElementById('current-user');
  if(userEl && state.currentUser){
    userEl.textContent = state.currentUser;
  }
}

/* ============ VIEWS ============ */

// 1. MASALAR GRID
function renderMasalarGrid(root){
  let html = `
    <div class="section-header">
      <h2 class="section-title">Masalar Overview</h2>
    </div>
    <div class="table-grid">
  `;
  state.tables.forEach(t => {
    const total = orderTotal(t.order);
    html += `
      <div class="table-card" onclick="state.selectedTableNo=${t.no}; renderUI();">
        <div>
          <div class="tno">Masa ${t.no}</div>
          <span class="tstatus ${statusClass(t.status)}">${statusLabel(t.status)}</span>
        </div>
        ${total>0 ? `<div class="ttotal">${tl(total)}</div>` : ''}
      </div>
    `;
  });
  html += `</div>`;
  root.innerHTML = html;
}

// 2. ORDER PANEL
function renderOrderPanel(root){
  const t = getTable(state.selectedTableNo);
  const total = orderTotal(t.order);

  let html = `
    <button class="back-btn" onclick="state.selectedTableNo=null; renderUI();">← Masalara Dön</button>
    <div class="order-layout">
      <div class="menu-block">
        <h2 class="section-title" style="margin-bottom:16px;">Masa ${t.no} — Sipariş Seçimi</h2>
  `;

  state.menu.forEach(cat => {
    html += `<div class="category"><div class="category-title">${cat.cat}</div><div class="items-grid">`;
    cat.items.forEach(item => {
      html += `
        <div class="item-btn" onclick="addItem(${t.no}, '${item.id}', '${item.name}', ${item.price})">
          <span class="item-name">${item.name}</span>
          <span class="item-price">${tl(item.price)}</span>
        </div>
      `;
    });
    html += `</div></div>`;
  });

  html += `</div>
    <div>
      <div class="ticket">
        <div class="ticket-head">
          <div class="tname">Masa ${t.no} Adisyon</div>
          <span class="tstatus ${statusClass(t.status)}" style="margin-top:6px;">${statusLabel(t.status)}</span>
        </div>
        <div class="ticket-body">
  `;

  const itemsArr = Object.entries(t.order.items || {});
  if(itemsArr.length === 0){
    html += `<div class="empty-note">Henüz eklenmiş ürün bulunmuyor.</div>`;
  } else {
    itemsArr.forEach(([id, item]) => {
      html += `
        <div class="line">
          <span class="l-name">${item.name}</span>
          <div class="l-qty">
            <button class="qty-btn" onclick="updateQty(${t.no}, '${id}', -1)">-</button>
            <b>${item.qty}</b>
            <button class="qty-btn" onclick="updateQty(${t.no}, '${id}', 1)">+</button>
          </div>
          <b style="font-family:'JetBrains Mono';">${tl(item.price * item.qty)}</b>
        </div>
      `;
    });
  }

  html += `
        </div>
        <div class="field-block">
          <label>Sipariş Notu</label>
          <textarea id="order-note" rows="2" placeholder="Örn: Az acılı, buzsuz kola..." onchange="updateNote(${t.no}, this.value)">${t.order.note || ''}</textarea>
        </div>
        <div class="field-block">
          <label>WhatsApp Adisyon Gönder</label>
          <div class="wa-row">
            <input type="tel" id="wa-phone" placeholder="905xxxxxxxxx" value="${t.whatsapp || ''}" onchange="updatePhone(${t.no}, this.value)">
            <button class="wa-btn" onclick="sendWhatsApp(${t.no})">Gönder</button>
          </div>
        </div>
        <div class="ticket-totals">
          <div class="trow">
            <span>Toplam:</span>
            <span>${tl(total)}</span>
          </div>
        </div>
        <div class="ticket-actions">
          <button class="btn btn-send" onclick="sendToKitchen(${t.no})">Mutfağa Gönder</button>
          <button class="btn btn-pay" onclick="clearTable(${t.no})">Adisyonu Kapat (Öde)</button>
        </div>
      </div>
    </div>
  </div>`;

  root.innerHTML = html;
}

function addItem(tableNo, id, name, price) {
  const t = getTable(tableNo);
  if(!t.order.items) t.order.items = {};
  if(t.order.items[id]) {
    t.order.items[id].qty++;
  } else {
    t.order.items[id] = { name, price, qty: 1 };
  }
  if(t.status === 'empty') t.status = 'ordering';
  saveStateToCloud();
}

function updateQty(tableNo, id, delta) {
  const t = getTable(tableNo);
  if(t.order.items[id]){
    t.order.items[id].qty += delta;
    if(t.order.items[id].qty <= 0) delete t.order.items[id];
  }
  if(Object.keys(t.order.items).length === 0) t.status = 'empty';
  saveStateToCloud();
}

function updateNote(tableNo, note) {
  const t = getTable(tableNo);
  t.order.note = note;
  saveStateToCloud();
}

function updatePhone(tableNo, phone) {
  const t = getTable(tableNo);
  t.whatsapp = phone;
  saveStateToCloud();
}

function sendWhatsApp(tableNo) {
  const t = getTable(tableNo);
  if (!t.whatsapp) {
    toast("Lütfen telefon numarası girin!");
    return;
  }
  const total = orderTotal(t.order);
  let text = `*OCAKBAŞI RESTORAN ADİSYON*\n*Masa:* ${t.no}\n----------------------------------\n`;
  Object.values(t.order.items || {}).forEach(i => {
    text += `${i.name} x${i.qty} = ₺${(i.price * i.qty).toFixed(2)}\n`;
  });
  if(t.order.note) text += `\n*Not:* ${t.order.note}\n`;
  text += `----------------------------------\n*TOPLAM TUTAR:* ₺${total.toFixed(2)}\n\nAfiyet olsun!`;
  
  const cleanPhone = t.whatsapp.replace(/[^0-9]/g, '');
  const url = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank');
}

function sendToKitchen(tableNo) {
  const t = getTable(tableNo);
  if(Object.keys(t.order.items || {}).length === 0) {
    toast("Adisyonda ürün yok!");
    return;
  }
  t.status = 'kitchen';
  t.kitchenStatus = 'bekliyor';
  toast(`Masa ${tableNo} mutfağa gönderildi.`);
  saveStateToCloud();
}

function clearTable(tableNo) {
  const t = getTable(tableNo);
  const total = orderTotal(t.order);
  if(total > 0){
    state.salesLog.push({ tableNo, total, time: new Date().toLocaleTimeString('tr-TR') });
  }
  t.order = { items:{}, note:'' };
  t.status = 'empty';
  t.kitchenStatus = null;
  t.whatsapp = '';
  state.selectedTableNo = null;
  toast(`Masa ${tableNo} kapatıldı.`);
  saveStateToCloud();
}

// 3. KDS MUTFAK
function renderMutfak(root){
  const kitchenTables = state.tables.filter(t => t.status === 'kitchen' || t.status === 'ready');
  let html = `<h2 class="section-title" style="margin-bottom:20px;">Mutfak Ekranı (KDS)</h2>`;

  if(kitchenTables.length === 0){
    html += `<div style="text-align:center; padding:60px; color:var(--text-dim);">Mutfakta aktif sipariş bulunmuyor.</div>`;
  } else {
    html += `<div class="kds-grid">`;
    kitchenTables.forEach(t => {
      html += `
        <div class="kds-card ${t.kitchenStatus || 'bekliyor'}">
          <div>
            <div class="kds-top">
              <span class="kds-table">MASA ${t.no}</span>
              <span style="font-size:11px; text-transform:uppercase; font-weight:700;">${t.kitchenStatus || 'bekliyor'}</span>
            </div>
            <div class="kds-items">
      `;
      Object.values(t.order.items || {}).forEach(item => {
        html += `<div>• ${item.name} x<b>${item.qty}</b></div>`;
      });
      if(t.order.note) {
        html += `<div style="color:var(--primary); margin-top:8px; font-weight:600;">Not: ${t.order.note}</div>`;
      }
      html += `</div></div>
          <div class="kds-actions">
            <button class="kds-btn prep" onclick="setKitchenStatus(${t.no}, 'hazirlaniyor')">Hazırlanıyor</button>
            <button class="kds-btn ready" onclick="setKitchenStatus(${t.no}, 'hazir')">Hazır</button>
          </div>
        </div>
      `;
    });
    html += `</div>`;
  }
  root.innerHTML = html;
}

function setKitchenStatus(tableNo, kStatus){
  const t = getTable(tableNo);
  t.kitchenStatus = kStatus;
  if(kStatus === 'hazir') t.status = 'ready';
  else t.status = 'kitchen';
  saveStateToCloud();
}

// 4. KASA
function renderKasa(root){
  let html = `<h2 class="section-title" style="margin-bottom:20px;">Kasa Bekleyen Adisyonlar</h2>`;
  const activeTables = state.tables.filter(t => orderTotal(t.order) > 0);

  if(activeTables.length === 0){
    html += `<div style="text-align:center; padding:60px; color:var(--text-dim);">Ödeme bekleyen masa yok.</div>`;
  } else {
    html += `<div class="table-grid">`;
    activeTables.forEach(t => {
      html += `
        <div class="table-card" onclick="clearTable(${t.no})">
          <div>
            <div class="tno">Masa ${t.no}</div>
            <div class="ttotal" style="margin-top:8px;">${tl(orderTotal(t.order))}</div>
          </div>
          <button class="btn btn-pay" style="margin-top:14px; width:100%; font-size:12px; padding:8px;">Tahsil Et & Kapat</button>
        </div>
      `;
    });
    html += `</div>`;
  }
  root.innerHTML = html;
}

// 5. GÜN SONU
function renderGunSonu(root){
  const totalRevenue = state.salesLog.reduce((s, x) => s + x.total, 0);
  const totalExpense = state.expenses.reduce((s, x) => s + x.amount, 0);

  let html = `
    <h2 class="section-title" style="margin-bottom:20px;">Gün Sonu Raporu</h2>
    <div class="summary-cards">
      <div class="summary-card">
        <div class="s-label">Toplam Ciro</div>
        <div class="s-value" style="color:var(--success);">${tl(totalRevenue)}</div>
      </div>
      <div class="summary-card">
        <div class="s-label">Toplam Gider</div>
        <div class="s-value" style="color:var(--danger);">${tl(totalExpense)}</div>
      </div>
      <div class="summary-card">
        <div class="s-label">Net Kazanç</div>
        <div class="s-value">${tl(totalRevenue - totalExpense)}</div>
      </div>
    </div>

    <div class="expense-block">
      <h3 style="font-size:16px; font-weight:700;">Gider Kaydı Ekle</h3>
      <div class="expense-form">
        <input type="text" id="exp-desc" placeholder="Gider açıklaması..." style="flex:2;">
        <input type="number" id="exp-amt" placeholder="Tutar (₺)" style="flex:1;">
        <button onclick="addExpense()">Gider Ekle</button>
      </div>
      <div style="margin-top:20px;">
  `;

  state.expenses.forEach((e) => {
    html += `<div class="expense-row"><span>${e.desc}</span><b style="font-family:'JetBrains Mono';">${tl(e.amount)}</b></div>`;
  });

  html += `</div></div>`;
  root.innerHTML = html;
}

function addExpense(){
  const descEl = document.getElementById('exp-desc');
  const amtEl = document.getElementById('exp-amt');
  const desc = descEl ? descEl.value : '';
  const amount = amtEl ? parseFloat(amtEl.value) : 0;
  if(desc && amount){
    state.expenses.push({ desc, amount, time: new Date().toLocaleTimeString('tr-TR') });
    saveStateToCloud();
  }
}

// 6. PERSONEL & MENU MANAGEMENT
function renderPersonel(root){
  root.innerHTML = `
    <h2 class="section-title" style="margin-bottom:20px;">Personel Paneli</h2>
    <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:24px; max-width:400px;">
      <p style="color:var(--text-muted); margin-bottom:16px;">Oturum Açan Kullanıcı: <b style="color:var(--primary);">${state.currentUser || 'Giriş Yapılmadı'}</b></p>
      <button class="logout-btn" onclick="handleLogout()" style="padding:10px 20px;">Oturumu Kapat</button>
    </div>
  `;
}

function renderMenuYonetim(root){
  let html = `<h2 class="section-title" style="margin-bottom:20px;">Menü ve Fiyat Düzenleme</h2>`;
  state.menu.forEach((cat, cIdx) => {
    html += `<div style="font-size:14px; font-weight:800; color:var(--primary); margin-top:24px; text-transform:uppercase;">${cat.cat}</div>`;
    cat.items.forEach((item, iIdx) => {
      html += `
        <div style="display:flex; gap:10px; margin-top:10px; align-items:center;">
          <input type="text" value="${item.name}" style="background:var(--bg-card); border:1px solid var(--border); color:#fff; padding:10px 12px; border-radius:8px; flex:1;" onchange="updateMenuItemName(${cIdx}, ${iIdx}, this.value)">
          <input type="number" value="${item.price}" style="background:var(--bg-card); border:1px solid var(--border); color:#fff; padding:10px 12px; border-radius:8px; width:110px;" onchange="updateMenuItemPrice(${cIdx}, ${iIdx}, this.value)">
          <span style="font-weight:700;">₺</span>
          <button onclick="removeMenuItem(${cIdx}, ${iIdx})" style="background:var(--danger-bg); color:var(--danger); border:1px solid var(--danger); border-radius:8px; padding:10px 14px; cursor:pointer; font-weight:700;">Sil</button>
        </div>
      `;
    });
    html += `<button onclick="addMenuItem(${cIdx})" style="background:var(--bg-card); border:1px solid var(--border); color:var(--text-main); border-radius:8px; padding:8px 14px; cursor:pointer; margin-top:10px; font-weight:600; font-size:12px;">+ Yeni Ürün Ekle</button>`;
  });
  root.innerHTML = html;
}

function updateMenuItemName(cIdx, iIdx, val) {
  state.menu[cIdx].items[iIdx].name = val;
  saveStateToCloud();
}

function updateMenuItemPrice(cIdx, iIdx, val) {
  state.menu[cIdx].items[iIdx].price = parseFloat(val) || 0;
  saveStateToCloud();
}

function addMenuItem(cIdx) {
  const newId = 'item_' + Date.now();
  state.menu[cIdx].items.push({ id: newId, name: "Yeni Ürün", price: 0 });
  saveStateToCloud();
}

function removeMenuItem(cIdx, iIdx) {
  state.menu[cIdx].items.splice(iIdx, 1);
  saveStateToCloud();
}

/* ============ SYSTEM CONTROLS ============ */
function switchView(view) {
  state.activeView = view;
  state.selectedTableNo = null;
  renderUI();
}

function handleLogin() {
  const nameEl = document.getElementById('login-name');
  const name = nameEl ? nameEl.value.trim() : '';
  if(name) {
    state.currentUser = name;
    document.body.classList.add('logged-in');
    renderUI();
  } else {
    toast("Lütfen kullanıcı adınızı girin!");
  }
}

function handleLogout() {
  state.currentUser = null;
  document.body.classList.remove('logged-in');
  const nameEl = document.getElementById('login-name');
  const passEl = document.getElementById('login-pass');
  if(nameEl) nameEl.value = '';
  if(passEl) passEl.value = '';
}
</script>
