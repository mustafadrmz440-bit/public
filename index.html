<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#232420">
<title>Ocakbaşı Kasa — Restoran Yönetim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Firebase Live Sync SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
  :root{
    --board:#232420;
    --board-2:#2c2d27;
    --board-3:#34362e;
    --chalk:#efe9da;
    --dim:#a39d86;
    --paper:#faf6ec;
    --mustard:#c99a2e;
    --rust:#a8402e;
    --sage:#6b7a5e;
    --sage-2:#8fa87a;
    --line:#454639;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--board); color:var(--chalk);
    font-family:'Inter', sans-serif; min-height:100vh;
  }
  button{font-family:inherit;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 26px; background:var(--board-2); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
  }
  .brand{ display:flex; align-items:baseline; gap:12px; }
  .brand h1{ font-family:'Oswald', sans-serif; font-weight:700; font-size:22px; margin:0; }
  .brand .tag{ font-family:'Courier Prime', monospace; font-size:11px; color:var(--mustard); text-transform:uppercase; }
  .sync-status{ font-size:11px; padding:3px 8px; border-radius:12px; font-weight:600; font-family:'Courier Prime', monospace; }
  .sync-online{ background:rgba(143,168,122,0.2); color:var(--sage-2); border:1px solid var(--sage-2); }
  .sync-offline{ background:rgba(168,64,46,0.2); color:var(--rust); border:1px solid var(--rust); }
  
  .tabs{ display:flex; gap:6px; }
  .tab-btn{
    background:none; border:1px solid var(--line); color:var(--dim);
    padding:9px 18px; border-radius:6px; cursor:pointer;
    font-family:'Oswald', sans-serif; font-weight:600; font-size:13.5px; position:relative;
  }
  .tab-btn.active{ background:var(--mustard); color:#232420; border-color:var(--mustard); }
  .tab-badge{
    position:absolute; top:-7px; right:-7px; background:var(--rust); color:#fff;
    font-size:10px; font-weight:700; border-radius:50%; width:18px; height:18px;
    display:flex; align-items:center; justify-content:center;
  }

  #login-screen{
    position:fixed; inset:0; z-index:100; background:var(--board);
    display:flex; align-items:center; justify-content:center;
  }
  body.logged-in #login-screen{ display:none; }
  body:not(.logged-in) #app-shell{ display:none; }
  
  .login-card{
    background:var(--board-2); border:1px solid var(--line); border-radius:12px;
    padding:36px 32px; width:100%; max-width:340px; text-align:center;
  }
  .login-form{ display:flex; flex-direction:column; gap:10px; margin-top:15px; }
  .login-form input{
    font-size:14px; padding:11px; border:1px solid var(--line); border-radius:6px;
    background:#1a1b17; color:var(--chalk);
  }
  .login-form button{
    background:var(--mustard); color:#232420; border:none; padding:11px;
    border-radius:6px; font-family:'Oswald', sans-serif; font-weight:600; cursor:pointer;
  }

  #toast-wrap{ position:fixed; top:70px; right:24px; z-index:50; display:flex; flex-direction:column; gap:8px; }
  .toast{ background:var(--sage); color:#fff; padding:12px 18px; border-radius:6px; font-size:13.5px; }

  .view{ padding:26px; max-width:1400px; margin:0 auto; }
  .section-title{ font-family:'Oswald', sans-serif; font-size:15px; letter-spacing:2px; color:var(--mustard); margin-bottom:18px; }

  .table-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:14px; }
  .table-card{
    background:var(--board-2); border:2px solid var(--line); border-radius:10px;
    padding:16px 14px; cursor:pointer; text-align:left; color:var(--chalk); position:relative;
  }
  .table-card:hover{ border-color:var(--mustard); }
  .table-card .tno{ font-family:'Oswald', sans-serif; font-size:22px; font-weight:700; }
  .table-card .tstatus{
    font-family:'Courier Prime', monospace; font-size:11px; margin-top:8px; padding:3px 8px; border-radius:20px; display:inline-block;
  }
  .table-card .ttotal{ font-family:'Courier Prime', monospace; font-size:12px; color:var(--dim); margin-top:8px; }

  .s-empty{ background:#3a3b32; color:#9a9682; }
  .s-ordering{ background:#4a4326; color:var(--mustard); }
  .s-kitchen{ background:#5a3d24; color:#f0a95c; }
  .s-ready{ background:#3d4d34; color:var(--sage-2); }
  .s-payment{ background:#4a2b25; color:#e08672; }

  .order-layout{ display:grid; grid-template-columns:1.4fr 1fr; gap:22px; }
  @media (max-width:900px){ .order-layout{ grid-template-columns:1fr; } }
  
  .items-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .item-btn{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--board-2); border:1px solid var(--line); border-radius:6px;
    padding:11px 13px; cursor:pointer; color:var(--chalk);
  }
  .item-btn:hover{ border-color:var(--mustard); }

  .ticket{ background:var(--paper); color:var(--board); border-radius:6px; padding:18px; font-family:'Courier Prime', monospace; }
  .ticket-line{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dotted #b9b092; }

  @media (max-width:640px){
    .topbar{ flex-wrap:wrap; gap:10px; padding:10px; }
    .tabs{ order:3; width:100%; overflow-x:auto; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="brand" style="justify-content:center;">
      <h1>Ocakbaşı Kasa</h1>
    </div>
    <div style="font-size:13px; color:var(--dim); margin-top:4px;">Giriş Yapın</div>
    <div class="login-form">
      <input type="text" id="login-name" placeholder="Adınız">
      <input type="password" id="login-pass" placeholder="Şifre">
      <button id="btn-login" onclick="handleLogin()">Giriş Yap</button>
    </div>
  </div>
</div>

<div id="app-shell">
  <div class="topbar">
    <div class="brand">
      <h1>Ocakbaşı Kasa</h1>
      <span class="tag">Restoran Yönetim</span>
      <span id="sync-indicator" class="sync-status sync-offline">Syncing...</span>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchView('masalar')">Masalar</button>
      <button class="tab-btn" onclick="switchView('mutfak')">Mutfak <span class="tab-badge" id="badge-mutfak" style="display:none;">0</span></button>
      <button class="tab-btn" onclick="switchView('kasa')">Kasa <span class="tab-badge" id="badge-kasa" style="display:none;">0</span></button>
      <button class="tab-btn" onclick="switchView('gunsonu')">Gün Sonu</button>
    </div>
    <div>
      <span id="current-user" style="font-size:13px; color:var(--mustard); font-weight:600;"></span>
      <button onclick="handleLogout()" style="background:none; border:1px solid var(--line); color:var(--dim); padding:4px 8px; border-radius:4px; cursor:pointer;">Çıkış</button>
    </div>
  </div>

  <div id="toast-wrap"></div>
  <div class="view" id="view-root"></div>
</div>

<script>
// ===== FIREBASE INITIALIZATION =====
const firebaseConfig = {
  apiKey: "AIzaSyAANxv0YtzXCG-y0CVln3QXdudHXlL94Ew",
  authDomain: "ocakbasi-kasa.firebaseapp.com",
  projectId: "ocakbasi-kasa",
  storageBucket: "ocakbasi-kasa.firebasestorage.app",
  messagingSenderId: "211570484231",
  appId: "1:211570484231:web:0bee101bf224be45a976a2",
  measurementId: "G-BQKZZ10QH6"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// LOCAL INITIAL STATE
const INITIAL_MENU = [
  { cat: "Ana Yemekler", items: [
    { id:"adana", name:"Adana Kebap", price:280 },
    { id:"urfa", name:"Urfa Kebap", price:270 },
    { id:"pirzola", name:"Kuzu Pirzola", price:420 },
    { id:"tavuk", name:"Tavuk Şiş", price:220 }
  ]},
  { cat: "İçecekler", items: [
    { id:"ayran", name:"Ayran", price:40 },
    { id:"kola", name:"Kola", price:50 },
    { id:"su", name:"Su", price:20 }
  ]}
];

let state = {
  tables: Array.from({length:10}, (_,i) => ({ no: i+1, status: 'empty', order: { items:{}, note:'' } })),
  menu: INITIAL_MENU,
  activeView: 'masalar',
  selectedTableNo: null,
  currentUser: null
};

// REALTIME DATABASE SYNC
db.collection("restaurant").doc("live_state")
  .onSnapshot((doc) => {
    const indicator = document.getElementById('sync-indicator');
    if (doc.exists) {
      const cloudData = doc.data();
      if(cloudData.tables) state.tables = cloudData.tables;
      if(cloudData.menu) state.menu = cloudData.menu;
      
      indicator.textContent = "🟢 Live Sync Active";
      indicator.className = "sync-status sync-online";
      renderUI();
    } else {
      // First-time DB initialization
      saveStateToCloud();
    }
  }, (err) => {
    console.error("Firebase Sync Error:", err);
    const indicator = document.getElementById('sync-indicator');
    indicator.textContent = "🔴 Sync Error";
    indicator.className = "sync-status sync-offline";
  });

function saveStateToCloud() {
  db.collection("restaurant").doc("live_state").set({
    tables: state.tables,
    menu: state.menu
  });
}

// UI RENDER ENGINE
function renderUI() {
  updateBadges();
  const root = document.getElementById('view-root');
  
  if (state.activeView === 'masalar') {
    if (state.selectedTableNo !== null) {
      renderOrderPanel(root);
    } else {
      renderMasalarGrid(root);
    }
  } else if (state.activeView === 'mutfak') {
    renderMutfak(root);
  } else if (state.activeView === 'kasa') {
    renderKasa(root);
  } else if (state.activeView === 'gunsonu') {
    renderGunSonu(root);
  }
}

function renderMasalarGrid(root) {
  root.innerHTML = `<h2 class="section-title">MASALAR</h2>`;
  const grid = document.createElement('div');
  grid.className = 'table-grid';

  state.tables.forEach(t => {
    const total = Object.values(t.order.items || {}).reduce((s,i)=>s+i.price*i.qty, 0);
    const card = document.createElement('div');
    card.className = 'table-card';
    card.onclick = () => { state.selectedTableNo = t.no; renderUI(); };
    card.innerHTML = `
      <div class="tno">Masa ${t.no}</div>
      <span class="tstatus ${getStatusClass(t.status)}">${t.status.toUpperCase()}</span>
      ${total > 0 ? `<div class="ttotal">₺${total}</div>` : ''}
    `;
    grid.appendChild(card);
  });
  root.appendChild(grid);
}

function renderOrderPanel(root) {
  const table = state.tables.find(t => t.no === state.selectedTableNo);
  const total = Object.values(table.order.items || {}).reduce((s,i)=>s+i.price*i.qty, 0);

  let html = `
    <button onclick="state.selectedTableNo=null; renderUI();" style="background:none; border:1px solid var(--line); color:var(--chalk); padding:6px 12px; border-radius:4px; cursor:pointer; margin-bottom:15px;">← Masalara Dön</button>
    <div class="order-layout">
      <div>
        <h2 class="section-title">Masa ${table.no} - Menü</h2>
  `;

  state.menu.forEach(cat => {
    html += `<h3 style="color:var(--mustard); font-size:14px; margin-top:15px;">${cat.cat}</h3><div class="items-grid">`;
    cat.items.forEach(item => {
      html += `
        <div class="item-btn" onclick="addItemToTable(${table.no}, '${item.id}', '${item.name}', ${item.price})">
          <span>${item.name}</span>
          <b style="color:var(--mustard);">₺${item.price}</b>
        </div>
      `;
    });
    html += `</div>`;
  });

  html += `</div>
    <div>
      <div class="ticket">
        <h3 style="margin:0 0 10px; text-align:center;">MASA ${table.no} ADİSYON</h3>
        <hr style="border:dashed 1px #ccc;">
  `;

  Object.values(table.order.items || {}).forEach(item => {
    html += `
      <div class="ticket-line">
        <span>${item.name} x${item.qty}</span>
        <b>₺${item.price * item.qty}</b>
      </div>
    `;
  });

  html += `
        <hr style="border:dashed 1px #ccc;">
        <div style="display:flex; justify-content:space-between; font-size:16px; font-weight:bold; margin-top:10px;">
          <span>TOPLAM:</span>
          <span>₺${total}</span>
        </div>
        <button onclick="clearTable(${table.no})" style="width:100%; margin-top:15px; background:var(--rust); color:#fff; border:none; padding:10px; border-radius:4px; font-weight:bold; cursor:pointer;">Adisyonu Kapat / Öde</button>
      </div>
    </div>
  </div>`;

  root.innerHTML = html;
}

function addItemToTable(tableNo, id, name, price) {
  const t = state.tables.find(x => x.no === tableNo);
  if(!t.order.items) t.order.items = {};
  if(t.order.items[id]) {
    t.order.items[id].qty++;
  } else {
    t.order.items[id] = { name, price, qty: 1 };
  }
  t.status = 'ordering';
  saveStateToCloud();
}

function clearTable(tableNo) {
  const t = state.tables.find(x => x.no === tableNo);
  t.order = { items:{}, note:'' };
  t.status = 'empty';
  state.selectedTableNo = null;
  saveStateToCloud();
}

function getStatusClass(s) {
  return { empty:'s-empty', ordering:'s-ordering', kitchen:'s-kitchen', ready:'s-ready', payment:'s-payment' }[s] || 's-empty';
}

function switchView(view) {
  state.activeView = view;
  state.selectedTableNo = null;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.getAttribute('onclick').includes(view));
  });
  renderUI();
}

function updateBadges() {
  const activeCount = state.tables.filter(t => t.status !== 'empty').length;
  document.getElementById('badge-mutfak').textContent = activeCount;
  document.getElementById('badge-mutfak').style.display = activeCount > 0 ? 'inline-block' : 'none';
}

function handleLogin() {
  const name = document.getElementById('login-name').value;
  if(name) {
    state.currentUser = name;
    document.body.classList.add('logged-in');
    document.getElementById('current-user').textContent = "👤 " + name;
    renderUI();
  }
}

function handleLogout() {
  document.body.classList.remove('logged-in');
  state.currentUser = null;
}
</script>
</body>
</html>
