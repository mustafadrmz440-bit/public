if (!window.storage) {
  window.storage = {
    async get(key) {
      const v = localStorage.getItem(key);
      return v !== null ? { key, value: v } : null;
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value };
    },
    async delete(key) {
      localStorage.removeItem(key);
      return { key, deleted: true };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return { keys };
    }
  };
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function formatTL(n) { return Number(n || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function paidTotal(inv) {
  if (Array.isArray(inv.payments) && inv.payments.length) return inv.payments.reduce((s, p) => s + p.amount, 0);
  if (inv.status === 'paid') return inv.amount; // eski (kısmi ödeme öncesi) kayıtlarla uyumluluk
  return 0;
}
function remainingAmount(inv) { return Math.max(0, inv.amount - paidTotal(inv)); }
function invStatus(inv) {
  const paid = paidTotal(inv);
  if (paid >= inv.amount) return 'paid';
  if (paid > 0) return 'partial';
  return 'unpaid';
}

function daysSince(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  return Math.floor((now - d) / 86400000);
}
function currentYYYYMM() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

function parseTrDate(str) {
  const parts = (str || '').split('.');
  if (parts.length !== 3) return null;
  const [d, m, y] = parts.map(Number);
  if (!d || !m || !y) return null;
  return new Date(y, m - 1, d);
}
function daysBetweenIsoAndDate(isoDateStr, dateObj) {
  if (!dateObj) return 0;
  const start = new Date(isoDateStr + 'T00:00:00');
  return Math.floor((dateObj - start) / 86400000);
}

function personReliability(personInvoices) {
  if (!personInvoices || personInvoices.length === 0) return null;
  const rank = { onTime: 0, medium: 1, late: 2 };
  let worst = 'onTime';
  personInvoices.forEach(inv => {
    const rem = remainingAmount(inv);
    let days;
    if (rem <= 0.004) {
      const payments = inv.payments || [];
      const last = payments[payments.length - 1];
      if (!last) return;
      days = daysBetweenIsoAndDate(inv.date, parseTrDate(last.date));
    } else {
      days = daysSince(inv.date);
    }
    let cat = 'onTime';
    if (days > 45) cat = 'late';
    else if (days > 30) cat = 'medium';
    if (rank[cat] > rank[worst]) worst = cat;
  });
  return worst;
}
