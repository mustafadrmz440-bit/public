function setLang(l){lang=l;t=translations[l];localStorage.setItem('sp-lang',l);document.documentElement.lang=l;render();}
function statusLabel(s){return t[s]||s}function money(n){return new Intl.NumberFormat(lang==='de'?'de-DE':'tr-TR').format(n)+' ₺'}
function brand(){return `<span class="brand-mark">${icon('wrench')}</span><span>Servis<span style="color:var(--orange)">Pilot</span></span>`}
function languagePicker(){return `<div class="language-picker"><button class="lang-btn" onclick="toggleLang(event)">${icon('globe')} ${lang.toUpperCase()} ▾</button><div id="lang-menu" class="lang-menu hidden"><button onclick="setLang('tr')">🇹🇷 Türkçe</button><button onclick="setLang('en')">🇬🇧 English</button><button onclick="setLang('de')">🇩🇪 Deutsch</button></div></div>`}

function renderAuth(){return `<section class="auth-shell"><div class="auth-form-side"><div class="brand">${brand()}</div>${languagePicker()}<div class="auth-card"><div class="eyebrow">${t.loginTag}</div><h1>${t.welcome}</h1><p class="sub">${t.loginSub}</p><form onsubmit="doLogin(event)"><div class="field"><label>${t.workshopCode}</label><div class="input-wrap">${icon('code')}<input id="workshop" value="DEMO01" autocomplete="organization" required></div></div><div class="field"><label>${t.username}</label><div class="input-wrap">${icon('user')}<input id="username" value="demo" autocomplete="username" required></div></div><div class="field"><div class="row-between"><label>${t.password}</label><button type="button" class="link-btn" onclick="toast('${t.demo}')">${t.forgot}</button></div><div class="input-wrap">${icon('lock')}<input type="password" value="demo123" autocomplete="current-password" required></div></div><button class="primary full">${t.login} →</button></form><div class="trial"><button onclick="showRegister()">${t.newAccount}</button> · ${t.free}</div><div class="divider"></div><div class="customer-box"><h3>${t.customer}</h3><p>${t.customerSub}</p><div class="track-row"><input id="track-code" placeholder="SRV-24091"><button class="outline-btn" onclick="track()">${t.track}</button></div></div><div class="admin-link">${t.admin}</div></div></div><div class="auth-visual"><div class="visual-inner"><div class="eyebrow">SERVİSPİLOT</div><h2>${t.hero}</h2><p>${t.heroSub}</p><div class="floating-card"><div style="font-size:12px;color:#97a4b7;margin:0 0 11px">${t.live}</div><div class="car-row"><div class="car-icon">${icon('car')}</div><div><div class="plate">34 EKA 742</div><div class="small-muted">Volkswagen Passat · ${t.repair}</div></div><span class="status progress">%65</span></div><div class="features"><div class="feature">${icon('clock')}<b>8 ${t.appointments}</b><span>Bugün</span></div><div class="feature">${icon('box')}<b>${t.inventory}</b><span>12 kritik parça</span></div><div class="feature">${icon('chart')}<b>${t.reports}</b><span>+18% verim</span></div></div></div></div></div></section>`}
function doLogin(e){e.preventDefault();logged=true;localStorage.setItem('sp-login','1');render()}
function logout(){logged=false;localStorage.removeItem('sp-login');render()}
function navButton(id,ico,label,badge=''){return `<button class="${page===id?'active':''}" onclick="go('${id}')">${icon(ico)}<span>${label}</span>${badge?`<i class="badge">${badge}</i>`:''}</button>`}
function shell(content,title){return `<div class="app-shell"><aside class="sidebar" id="sidebar"><div class="side-brand">${brand()}</div><div class="workshop"><b>Hızlı Oto Servis</b><span>DEMO01 · Pro paket</span></div><div class="nav-label">${t.menu}</div><nav class="nav">${navButton('dashboard','dashboard',t.dashboard)}${navButton('jobs','wrench',t.jobs,jobs.filter(x=>x.status!=='done').length)}${navButton('appointments','clock',t.appointments)}${navButton('customers','users',t.customers)}${navButton('stock','box',t.stock)}</nav><div class="nav-label" style="margin-top:24px">${t.management}</div><nav class="nav">${navButton('analytics','chart',t.analytics)}${navButton('settings','settings',t.settings)}</nav><div class="side-bottom"><div class="user-mini"><div class="avatar">MY</div><div><b>Mehmet Yılmaz</b><span>Atölye yöneticisi</span></div><button class="logout" title="${t.logout}" onclick="logout()">${icon('logout')}</button></div></div></aside><main class="main"><header class="topbar"><button class="mobile-toggle icon-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">${icon('menu')}</button><div class="page-title">${title}</div><div class="top-search">${icon('search')}<input placeholder="${t.search}" onkeydown="if(event.key==='Enter'){page='jobs';render();setTimeout(()=>{let e=document.getElementById('job-search');e.value=this.value;filterJobs()},0)}"></div><div class="top-actions">${languagePicker()}<button class="icon-btn">${icon('bell')}<i class="dot"></i></button></div></header>${content}</main></div>`}
function go(p){page=p;render();scrollTo(0,0)}
function dashboard(){const active=jobs.filter(x=>x.status!=='done').length,waiting=jobs.filter(x=>x.status==='waiting').length,done=jobs.filter(x=>x.status==='done').length;return shell(`<div class="content"><div class="welcome"><div><h1>${t.goodMorning}</h1><p>${t.today}</p></div><button class="primary add-btn" onclick="newJob()">${icon('plus')}<span>${t.newJob}</span></button></div><div class="stats"><div class="stat-card"><div><div class="label">${t.activeJobs}</div><div class="value">${active}</div><div class="trend">↑ 3 dünden fazla</div></div><div class="stat-icon orange">${icon('wrench')}</div></div><div class="stat-card"><div><div class="label">${t.waitingJobs}</div><div class="value">${waiting}</div><div class="trend neutral">Parça / onay bekliyor</div></div><div class="stat-icon yellow">${icon('clock')}</div></div><div class="stat-card"><div><div class="label">${t.completed}</div><div class="value">${done+42}</div><div class="trend">↑ %12 geçen aya göre</div></div><div class="stat-icon green">${icon('car')}</div></div><div class="stat-card"><div><div class="label">${t.revenue}</div><div class="value">₺184K</div><div class="trend">↑ %8,4 geçen aya göre</div></div><div class="stat-icon blue">${icon('chart')}</div></div></div><div class="dashboard-grid"><div class="panel"><div class="panel-head"><h2>${t.recentJobs}</h2><button onclick="go('jobs')">${t.viewAll} →</button></div>${jobsTable(jobs.slice(0,5))}</div><div style="display:grid;gap:18px;align-content:start"><div class="panel"><div class="panel-head"><h2>${t.activity}</h2></div><div class="activity-list"><div class="activity"><div class="activity-icon">${icon('car')}</div><div><b>35 AGS 905 teslime hazır</b><p>Klima kontrolü tamamlandı.</p><time>12 dakika önce</time></div></div><div class="activity"><div class="activity-icon" style="color:var(--orange);background:#fff1eb">${icon('box')}</div><div><b>Parça siparişi geldi</b><p>06 NVR 118 · Fren balatası</p><time>38 dakika önce</time></div></div><div class="activity"><div class="activity-icon" style="color:var(--green);background:#eaf9f4">${icon('money')}</div><div><b>Ödeme alındı</b><p>Emre Kaya · 2.500 ₺</p><time>1 saat önce</time></div></div></div></div><div class="panel"><div class="panel-head"><h2>${t.quick}</h2></div><div class="quick"><button onclick="toast('${t.addCustomer}')">${icon('users')}${t.addCustomer}</button><button onclick="newJob()">${icon('car')}${t.addVehicle}</button><button onclick="toast('${t.addStock}')">${icon('box')}${t.addStock}</button><button onclick="toast('${t.sendMessage}')">${icon('bell')}${t.sendMessage}</button></div></div></div></div></div>`,t.dashboard)}
function jobsTable(list){return `<div class="table-wrap"><table class="jobs-table"><thead><tr><th>${t.vehicle}</th><th>${t.customerCol}</th><th>${t.operation}</th><th>${t.status}</th><th>${t.delivery}</th></tr></thead><tbody>${list.map(j=>`<tr onclick="jobDetail(${j.id})"><td><div class="vehicle-cell"><div class="vehicle-dot">${icon('car')}</div><div><b>${j.plate}</b><span class="small-muted">${j.model}</span></div></div></td><td><b>${j.customer}</b><div class="small-muted">${j.phone}</div></td><td>${j.desc}<div class="progressbar"><i style="width:${j.progress}%"></i></div></td><td><span class="status ${j.status}">${statusLabel(j.status)}</span></td><td>${j.delivery}<div class="code">${j.code}</div></td></tr>`).join('')}</tbody></table></div>`}
function jobsPage(){return shell(`<div class="content"><div class="welcome"><div><h1>${t.allJobs}</h1><p>${t.allJobsSub}</p></div><button class="primary add-btn" onclick="newJob()">${icon('plus')}<span>${t.newJob}</span></button></div><div class="toolbar"><div class="searchbox">${icon('search')}<input id="job-search" placeholder="${t.search}" oninput="filterJobs()"></div><select id="status-filter" onchange="filterJobs()"><option value="">${t.filters}</option><option value="new">${t.new}</option><option value="progress">${t.progress}</option><option value="waiting">${t.waiting}</option><option value="done">${t.done}</option></select></div><div id="record-grid" class="record-grid">${jobCards(jobs)}</div></div>`,t.jobs)}
function jobCards(list){if(!list.length)return `<div class="empty" style="grid-column:1/-1">${icon('search')}<p>${t.notFound}</p></div>`;return list.map(j=>`<article class="record-card" onclick="jobDetail(${j.id})"><div class="record-top"><div><div class="record-plate">${j.plate}</div><div class="small-muted">${j.model}</div></div><span class="status ${j.status}">${statusLabel(j.status)}</span></div><h3>${j.desc}</h3><div class="small-muted">${j.customer} · ${j.phone}</div><div class="progressbar"><i style="width:${j.progress}%"></i></div><div class="record-meta"><span class="code">${j.code}</span><span>${money(j.price)}</span><span style="margin-left:auto">${j.delivery}</span></div></article>`).join('')}
function filterJobs(){let q=document.getElementById('job-search').value.toLowerCase(),s=document.getElementById('status-filter').value;let out=jobs.filter(j=>(!s||j.status===s)&&Object.values(j).join(' ').toLowerCase().includes(q));document.getElementById('record-grid').innerHTML=jobCards(out)}
function allCustomers(){let map={};jobs.forEach(j=>{if(!map[j.phone])map[j.phone]={id:'j'+j.id,name:j.customer,phone:j.phone,vehicle:j.model,plate:j.plate,visits:0,total:0};map[j.phone].visits++;map[j.phone].total+=j.price});extraCustomers.forEach(c=>map['x'+c.id]=c);return Object.values(map)}
function customersPage(){let list=allCustomers();return shell(`<div class="content"><div class="welcome"><div><h1>${t.customers}</h1><p>Müşteri, araç ve servis geçmişini tek ekrandan yönetin.</p></div><button class="primary add-btn" onclick="newCustomer()">${icon('plus')}<span>${t.addCustomer}</span></button></div><div class="stats"><div class="stat-card"><div><div class="label">Toplam müşteri</div><div class="value">${list.length}</div><div class="trend">↑ Bu ay 6 yeni</div></div><div class="stat-icon blue">${icon('users')}</div></div><div class="stat-card"><div><div class="label">Kayıtlı araç</div><div class="value">${list.filter(x=>x.plate).length}</div><div class="trend neutral">Aktif kayıtlar</div></div><div class="stat-icon orange">${icon('car')}</div></div></div><div class="panel"><div class="panel-head"><h2>${t.customers}</h2><button onclick="newCustomer()">+ ${t.addCustomer}</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>${t.customerCol}</th><th>${t.phone}</th><th>${t.vehicle}</th><th>Servis sayısı</th><th>Toplam işlem</th></tr></thead><tbody>${list.map(c=>`<tr><td><div class="customer-name"><div class="initial">${(c.name||'?').split(' ').map(x=>x[0]).slice(0,2).join('')}</div><b>${c.name}</b></div></td><td>${c.phone||'-'}</td><td><b>${c.plate||'-'}</b><div class="small-muted">${c.vehicle||''}</div></td><td>${c.visits||0}</td><td><b>${money(c.total||0)}</b></td></tr>`).join('')}</tbody></table></div></div></div>`,t.customers)}
function newCustomer(){modal(`<div class="modal-head"><h2>${t.addCustomer}</h2><button class="modal-close" onclick="closeModal()">×</button></div><form onsubmit="saveCustomer(event)"><div class="modal-body"><div class="form-grid"><div class="field"><label>Ad soyad</label><input name="name" required></div><div class="field"><label>${t.phone}</label><input name="phone" required></div><div class="field"><label>${t.plate}</label><input name="plate"></div><div class="field"><label>${t.brandModel}</label><input name="vehicle"></div><div class="field span-2"><label>Not</label><textarea name="note" rows="2"></textarea></div></div></div><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">${t.cancel}</button><button class="primary">Kaydet</button></div></form>`)}
function saveCustomer(e){e.preventDefault();let f=new FormData(e.target);extraCustomers.push({id:Date.now(),name:f.get('name'),phone:f.get('phone'),plate:f.get('plate').toUpperCase(),vehicle:f.get('vehicle'),note:f.get('note'),visits:0,total:0});localStorage.setItem('sp-customers',JSON.stringify(extraCustomers));closeModal();toast('Müşteri kaydedildi');render()}
function stockPage(){let low=stockItems.filter(x=>x.qty<=x.min);return shell(`<div class="content"><div class="welcome"><div><h1>${t.stock}</h1><p>Yedek parça stoklarını ve kritik seviyeleri takip edin.</p></div><button class="primary add-btn" onclick="newStock()">${icon('plus')}<span>${t.addStock}</span></button></div><div class="stats"><div class="stat-card"><div><div class="label">Stok kalemi</div><div class="value">${stockItems.length}</div><div class="trend neutral">${stockItems.reduce((a,b)=>a+b.qty,0)} toplam ürün</div></div><div class="stat-icon blue">${icon('box')}</div></div><div class="stat-card"><div><div class="label">Kritik stok</div><div class="value">${low.length}</div><div class="trend" style="color:var(--red)">Sipariş gerekli</div></div><div class="stat-icon orange">${icon('bell')}</div></div><div class="stat-card"><div><div class="label">Stok değeri</div><div class="value">${money(stockItems.reduce((a,b)=>a+b.qty*b.price,0))}</div><div class="trend neutral">Güncel alış değeri</div></div><div class="stat-icon green">${icon('money')}</div></div></div><div class="panel"><div class="panel-head"><h2>${t.stock}</h2><button onclick="newStock()">+ Stok girişi</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Parça kodu</th><th>Ürün</th><th>Kategori</th><th>Stok</th><th>Birim fiyat</th><th>Durum</th></tr></thead><tbody>${stockItems.map(x=>`<tr><td class="code">${x.code}</td><td><b>${x.name}</b></td><td>${x.category}</td><td><div class="stock-level"><span class="${x.qty<=x.min?'stock-low':'stock-ok'}">${x.qty} adet</span><div class="progressbar"><i style="width:${Math.min(100,x.qty/(x.min*2)*100)}%;background:${x.qty<=x.min?'var(--red)':'var(--green)'}"></i></div></div></td><td>${money(x.price)}</td><td><span class="status ${x.qty<=x.min?'waiting':'done'}">${x.qty<=x.min?'Kritik':'Yeterli'}</span></td></tr>`).join('')}</tbody></table></div></div></div>`,t.stock)}
function newStock(){modal(`<div class="modal-head"><h2>${t.addStock}</h2><button class="modal-close" onclick="closeModal()">×</button></div><form onsubmit="saveStock(event)"><div class="modal-body"><div class="form-grid"><div class="field"><label>Parça kodu</label><input name="code" required></div><div class="field"><label>Ürün adı</label><input name="name" required></div><div class="field"><label>Kategori</label><input name="category" required></div><div class="field"><label>Adet</label><input name="qty" type="number" min="0" required></div><div class="field"><label>Minimum stok</label><input name="min" type="number" min="1" value="5"></div><div class="field"><label>Birim fiyat</label><input name="price" type="number" min="0"></div></div></div><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">${t.cancel}</button><button class="primary">Kaydet</button></div></form>`)}
function saveStock(e){e.preventDefault();let f=new FormData(e.target);stockItems.unshift({id:Date.now(),code:f.get('code').toUpperCase(),name:f.get('name'),category:f.get('category'),qty:+f.get('qty'),min:+f.get('min'),price:+f.get('price')});localStorage.setItem('sp-stock',JSON.stringify(stockItems));closeModal();toast('Stok kaydedildi');render()}
function appointmentsPage(){return shell(`<div class="content"><div class="welcome"><div><h1>${t.appointments}</h1><p>Servis randevularını planlayın ve araç kabulünü hızlandırın.</p></div><button class="primary add-btn" onclick="newAppointment()">${icon('plus')}<span>Yeni randevu</span></button></div><div class="panel"><div class="panel-head"><h2>Yaklaşan randevular</h2><button onclick="newAppointment()">+ Randevu ekle</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Tarih / Saat</th><th>${t.customerCol}</th><th>${t.vehicle}</th><th>${t.operation}</th><th>İşlem</th></tr></thead><tbody>${appointments.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(a=>`<tr><td><div class="appt-time">${a.time}</div><div class="small-muted">${a.date}</div></td><td><b>${a.customer}</b></td><td><b>${a.plate}</b></td><td>${a.desc}</td><td><button class="outline-btn" onclick="appointmentToJob(${a.id})">Servise kabul</button></td></tr>`).join('')}</tbody></table></div></div></div>`,t.appointments)}
function newAppointment(){modal(`<div class="modal-head"><h2>Yeni randevu</h2><button class="modal-close" onclick="closeModal()">×</button></div><form onsubmit="saveAppointment(event)"><div class="modal-body"><div class="form-grid"><div class="field"><label>Tarih</label><input type="date" name="date" required></div><div class="field"><label>Saat</label><input type="time" name="time" required></div><div class="field"><label>${t.customerCol}</label><input name="customer" required></div><div class="field"><label>${t.plate}</label><input name="plate" required></div><div class="field span-2"><label>${t.operation}</label><textarea name="desc" required></textarea></div></div></div><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">${t.cancel}</button><button class="primary">Kaydet</button></div></form>`)}
function saveAppointment(e){e.preventDefault();let f=new FormData(e.target);appointments.push({id:Date.now(),date:f.get('date'),time:f.get('time'),customer:f.get('customer'),plate:f.get('plate').toUpperCase(),desc:f.get('desc')});localStorage.setItem('sp-appts',JSON.stringify(appointments));closeModal();toast('Randevu oluşturuldu');render()}
function appointmentToJob(id){let a=appointments.find(x=>x.id===id);jobs.unshift({id:Date.now(),code:'SRV-'+String(Date.now()).slice(-5),plate:a.plate,model:'Araç bilgisi girilecek',customer:a.customer,phone:'',desc:a.desc,status:'new',price:0,delivery:'Planlanacak',progress:10});appointments=appointments.filter(x=>x.id!==id);localStorage.setItem('sp-jobs',JSON.stringify(jobs));localStorage.setItem('sp-appts',JSON.stringify(appointments));toast('Araç servise kabul edildi');page='jobs';render()}
function analyticsPage(){let total=jobs.reduce((a,b)=>a+b.price,0),done=jobs.filter(x=>x.status==='done').length;let months=[42,58,49,68,74,82,66,91,78,88,72,96];return shell(`<div class="content"><div class="welcome"><div><h1>${t.analytics}</h1><p>Atölye performansı, gelir ve servis istatistikleri.</p></div><button class="outline-btn" onclick="window.print()">Raporu yazdır</button></div><div class="stats"><div class="stat-card"><div><div class="label">Toplam işlem hacmi</div><div class="value">${money(total)}</div><div class="trend">↑ %8,4 büyüme</div></div><div class="stat-icon green">${icon('money')}</div></div><div class="stat-card"><div><div class="label">Tamamlanan iş</div><div class="value">${done}</div><div class="trend neutral">Demo kayıtları</div></div><div class="stat-icon blue">${icon('wrench')}</div></div><div class="stat-card"><div><div class="label">Ortalama işlem</div><div class="value">${money(total/jobs.length)}</div><div class="trend">↑ %5,2</div></div><div class="stat-icon orange">${icon('chart')}</div></div></div><div class="dashboard-grid"><div class="panel chart-card"><div class="panel-head" style="padding:0 0 15px"><h2>Aylık servis geliri</h2><span class="small-muted">2026</span></div><div class="bar-chart">${months.map((v,i)=>`<div class="bar-col"><i style="height:${v}%"></i><span>${['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'][i]}</span></div>`).join('')}</div></div><div class="panel"><div class="panel-head"><h2>İş emri dağılımı</h2></div><div class="activity-list">${['progress','waiting','new','done'].map(s=>`<div class="activity"><div class="activity-icon">${icon('wrench')}</div><div style="width:100%"><div class="row-between"><b>${statusLabel(s)}</b><b>${jobs.filter(x=>x.status===s).length}</b></div><div class="progressbar"><i style="width:${jobs.filter(x=>x.status===s).length/jobs.length*100}%"></i></div></div></div>`).join('')}</div></div></div></div>`,t.analytics)}
function settingsPage(){return shell(`<div class="content"><div class="welcome"><div><h1>${t.settings}</h1><p>Atölye bilgilerini ve uygulama tercihlerini yönetin.</p></div><button class="primary" onclick="toast('Ayarlar kaydedildi')">Kaydet</button></div><div class="settings-grid"><div class="panel settings-card"><h3>Atölye bilgileri</h3><p>Belge ve müşteri mesajlarında görünecek bilgiler.</p><div class="field"><label>Atölye adı</label><input value="Hızlı Oto Servis"></div><div class="field"><label>${t.phone}</label><input value="0532 000 00 00"></div><div class="field"><label>Adres</label><textarea rows="3">İstanbul, Türkiye</textarea></div></div><div class="panel settings-card"><h3>${t.language}</h3><p>Uygulamanın görüntüleneceği dili seçin.</p><div class="field"><select onchange="setLang(this.value)"><option value="tr" ${lang==='tr'?'selected':''}>🇹🇷 Türkçe</option><option value="en" ${lang==='en'?'selected':''}>🇬🇧 English</option><option value="de" ${lang==='de'?'selected':''}>🇩🇪 Deutsch</option></select></div><h3 style="margin-top:25px">Bildirimler</h3><div class="toggle-row"><span>Müşteriye durum mesajı gönder</span><button class="switch on" onclick="this.classList.toggle('on')"><i></i></button></div><div class="toggle-row"><span>Kritik stok uyarıları</span><button class="switch on" onclick="this.classList.toggle('on')"><i></i></button></div><div class="toggle-row"><span>Günlük özet e-postası</span><button class="switch" onclick="this.classList.toggle('on')"><i></i></button></div></div></div></div>`,t.settings)}
function placeholderPage(id){return settingsPage()}
function newJob(){modal(`<div class="modal-head"><h2>${t.newJob}</h2><button class="modal-close" onclick="closeModal()">×</button></div><form onsubmit="saveJob(event)"><div class="modal-body"><div class="form-grid"><div class="field"><label>${t.plate}</label><input name="plate" placeholder="34 ABC 123" required></div><div class="field"><label>${t.brandModel}</label><input name="model" placeholder="2022 Toyota Corolla" required></div><div class="field"><label>${t.customerCol}</label><input name="customer" required></div><div class="field"><label>${t.phone}</label><input name="phone" placeholder="05__ ___ __ __"></div><div class="field span-2"><label>${t.desc}</label><textarea name="desc" rows="3" required></textarea></div><div class="field"><label>${t.status}</label><select name="status"><option value="new">${t.new}</option><option value="progress">${t.progress}</option><option value="waiting">${t.waiting}</option></select></div><div class="field"><label>${t.estimated}</label><input name="price" type="number" min="0" value="0"></div></div></div><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">${t.cancel}</button><button class="primary">${t.save}</button></div></form>`)}
function saveJob(e){e.preventDefault();let f=new FormData(e.target),status=f.get('status');jobs.unshift({id:Date.now(),code:'SRV-'+String(Date.now()).slice(-5),plate:f.get('plate').toUpperCase(),model:f.get('model'),customer:f.get('customer'),phone:f.get('phone'),desc:f.get('desc'),status,price:+f.get('price'),delivery:'Planlanacak',progress:status==='progress'?45:10});localStorage.setItem('sp-jobs',JSON.stringify(jobs));closeModal();toast(t.success);page='jobs';render()}
function jobDetail(id){let j=jobs.find(x=>x.id===id);modal(`<div class="modal-head"><h2>${j.plate}</h2><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="track-result"><div class="track-hero"><div class="row-between"><div><small>${t.codeLabel}</small><div style="font:800 19px Manrope;margin-top:4px">${j.code}</div></div><span class="status ${j.status}">${statusLabel(j.status)}</span></div></div><h3 style="font:800 17px Manrope;margin-bottom:4px">${j.model}</h3><p class="sub" style="margin-bottom:18px">${j.customer} · ${j.phone}</p><div class="field"><label>${t.operation}</label><div>${j.desc}</div></div><div class="row-between" style="padding:14px 0;border-top:1px solid var(--line)"><span>${t.estimated}</span><b>${money(j.price)}</b></div><div class="field"><label>${t.status}</label><select onchange="changeStatus(${j.id},this.value)"><option value="new" ${j.status==='new'?'selected':''}>${t.new}</option><option value="progress" ${j.status==='progress'?'selected':''}>${t.progress}</option><option value="waiting" ${j.status==='waiting'?'selected':''}>${t.waiting}</option><option value="done" ${j.status==='done'?'selected':''}>${t.done}</option></select></div></div></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">${t.cancel}</button><button class="primary" onclick="toast('${t.sendMessage}')">${t.sendMessage}</button></div>`)}
function changeStatus(id,s){let j=jobs.find(x=>x.id===id);j.status=s;j.progress={new:10,progress:60,waiting:35,done:100}[s];localStorage.setItem('sp-jobs',JSON.stringify(jobs));toast(statusLabel(s));closeModal();render()}
function track(){let code=(document.getElementById('track-code').value||'').trim().toUpperCase(),j=jobs.find(x=>x.code===code);if(!j){toast(t.notFound);return}modal(`<div class="modal-head"><h2>${t.trackTitle}</h2><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="track-result"><div class="track-hero"><small>${j.code}</small><div class="row-between" style="margin-top:6px"><div style="font:800 21px Manrope">${j.plate}</div><span class="status ${j.status}">${statusLabel(j.status)}</span></div><div style="margin-top:5px;color:#aeb9ca;font-size:12px">${j.model}</div></div><div class="timeline"><div class="timeline-item active"><b>Araç kabul edildi</b><p>Servis kaydı oluşturuldu.</p></div><div class="timeline-item ${j.status!=='new'?'active':''}"><b>Kontrol ve onarım</b><p>${j.desc}</p></div><div class="timeline-item ${j.status==='done'?'active':''}"><b>${t.done}</b><p>${j.status==='done'?j.delivery:'İşlem devam ediyor.'}</p></div></div></div></div>`)}
function showRegister(){modal(`<div class="modal-head"><h2>${t.newAccount}</h2><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body"><p class="sub">${t.heroSub}</p><div class="form-grid"><div class="field span-2"><label>Atölye adı</label><input placeholder="Örn. Hızlı Oto Servis"></div><div class="field"><label>${t.username}</label><input></div><div class="field"><label>E-posta</label><input type="email"></div></div></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">${t.cancel}</button><button class="primary" onclick="closeModal();toast('${t.free}')">${t.newAccount}</button></div>`)}
function modal(html){document.getElementById('modal-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){document.getElementById('modal-root').innerHTML=''}
let toastTimer;function toast(msg){clearTimeout(toastTimer);document.getElementById('toast-root').innerHTML=`<div class="toast">✓ &nbsp;${msg}</div>`;toastTimer=setTimeout(()=>document.getElementById('toast-root').innerHTML='',2600)}
function render(){t=translations[lang];document.documentElement.lang=lang;let html;if(!logged)html=renderAuth();else if(page==='dashboard')html=dashboard();else if(page==='jobs')html=jobsPage();else if(page==='appointments')html=appointmentsPage();else if(page==='customers')html=customersPage();else if(page==='stock')html=stockPage();else if(page==='analytics')html=analyticsPage();else html=settingsPage();document.getElementById('root').innerHTML=html}
render();
</script>
</body>
</html>
